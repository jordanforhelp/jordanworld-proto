<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bankroll IQ — Optimal Stake Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            jw: { black: '#000', card: '#0a0a0a', light: '#efefef', grey: '#868686', border: '#2a2a2a' }
          },
          fontFamily: { sans: ['Montserrat', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.15.0/umd/Recharts.js"></script>
  <style>
    body { background: #000; color: #efefef; font-family: Montserrat, system-ui, sans-serif; margin: 0; min-height: 100vh; }
    .card { border-radius: 0.75rem; border: 1px solid #2a2a2a; background: #0a0a0a; }
    .input-base { width: 100%; border-radius: 0.5rem; border: 1px solid #2a2a2a; background: #000; padding: 0.6rem 0.75rem; font-size: 0.875rem; color: #efefef; font-family: inherit; }
    .input-base:focus { outline: none; border-color: rgba(239,239,239,0.6); box-shadow: 0 0 0 1px rgba(239,239,239,0.25); }
    .label { display: block; font-size: 0.65rem; font-weight: 700; color: #868686; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.15em; }
    .btn-ghost { display: inline-flex; align-items: center; gap: 0.4rem; border-radius: 0.5rem; border: 1px solid #2a2a2a; background: transparent; padding: 0.4rem 0.75rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #efefef; cursor: pointer; }
    .btn-ghost:hover { border-color: rgba(239,239,239,0.5); background: #0a0a0a; }
    input[type=range] { accent-color: #efefef; width: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

    // ── Math helpers ──────────────────────────────────────────────
    function americanToDecimal(a) {
      if (a === 0) return 1;
      return a > 0 ? a / 100 + 1 : 100 / Math.abs(a) + 1;
    }
    function decimalToAmerican(d) {
      if (d <= 1) return 0;
      return d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1));
    }
    function parseOdds(input, format) {
      const n = parseFloat(String(input).trim().replace(/,/g, ''));
      if (isNaN(n)) return null;
      if (format === 'decimal' && n <= 1) return null;
      return n;
    }
    function impliedProbability(d) { return d <= 1 ? 0 : 1 / d; }
    function fullKellyFraction(p, d) {
      if (p <= 0 || p >= 1 || d <= 1) return 0;
      const b = d - 1, q = 1 - p;
      return Math.max(0, (p * b - q) / b);
    }
    function expectedValue(p, d) { return p * d - 1; }
    function formatUSD(v, dec = 2) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v);
    }
    function formatPct(v, dec = 1) { return (v * 100).toFixed(dec) + '%'; }

    function calculateKelly({ bankroll, decimalOdds, winProbability: p, minStake }) {
      const fStar = fullKellyFraction(p, decimalOdds);
      const halfF = fStar / 2, quarterF = fStar / 4;
      const fullStake = fStar * bankroll, halfStake = halfF * bankroll, quarterStake = quarterF * bankroll;
      const flatStake = 0.02 * bankroll;
      const ev = expectedValue(p, decimalOdds);
      const isPositiveEV = ev > 0;
      let recommendedStake = quarterStake, recommendedLabel = 'Quarter Kelly';
      if (quarterStake < minStake && halfStake >= minStake) { recommendedStake = halfStake; recommendedLabel = 'Half Kelly (raised)'; }
      else if (quarterStake < minStake && fullStake >= minStake) { recommendedStake = fullStake; recommendedLabel = 'Full Kelly (raised)'; }
      return {
        fullKellyFraction: fStar, fullKellyStake: fullStake,
        halfKellyFraction: halfF, halfKellyStake: halfStake,
        quarterKellyFraction: quarterF, quarterKellyStake: quarterStake,
        flat2PctStake: flatStake, expectedValue: ev, isPositiveEV,
        belowMinStake: recommendedStake > 0 && recommendedStake < minStake,
        recommendedStake, recommendedLabel
      };
    }

    function removeVig(o1, o2) {
      const i1 = 1 / o1, i2 = 1 / o2, over = i1 + i2;
      if (over <= 0) return { fairP1: 0.5, fairP2: 0.5, overround: 0 };
      return { fairP1: i1 / over, fairP2: i2 / over, overround: over - 1 };
    }

    function simulateBankrollTrajectory(start, decimalOdds, winProb, numBets = 50, seed = 42) {
      let state = seed;
      const random = () => {
        state |= 0; state = (state + 0x6d2b79f5) | 0;
        let t = Math.imul(state ^ (state >>> 15), 1 | state);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const points = [{ bet: 0, quarterKelly: start, halfKelly: start, flat: start }];
      let qBank = start, hBank = start, fBank = start;
      const b = decimalOdds - 1;
      const trueKelly = fullKellyFraction(winProb, decimalOdds);
      const isNeg = trueKelly <= 0;
      const qFrac = isNeg ? 0.005 : trueKelly / 4;
      const hFrac = isNeg ? 0.01 : trueKelly / 2;
      for (let i = 1; i <= numBets; i++) {
        const win = random() < winProb;
        const qStake = Math.min(qBank * qFrac, qBank);
        if (qStake > 0.0001) { qBank = win ? qBank + qStake * b : qBank - qStake; qBank = Math.max(0, qBank); }
        const hStake = Math.min(hBank * hFrac, hBank);
        if (hStake > 0.0001) { hBank = win ? hBank + hStake * b : hBank - hStake; hBank = Math.max(0, hBank); }
        const fStake = Math.min(fBank * 0.02, fBank);
        if (fStake > 0.0001) { fBank = win ? fBank + fStake * b : fBank - fStake; fBank = Math.max(0, fBank); }
        points.push({ bet: i, quarterKelly: Math.round(qBank * 100) / 100, halfKelly: Math.round(hBank * 100) / 100, flat: Math.round(fBank * 100) / 100 });
      }
      return points;
    }

    // ── Components ────────────────────────────────────────────────
    function App() {
      const [bankroll, setBankroll] = useState(20);
      const [oddsFormat, setOddsFormat] = useState('american');
      const [oddsInput, setOddsInput] = useState('+110');
      const [winProbPct, setWinProbPct] = useState(52);
      const [minStake, setMinStake] = useState(0.5);
      const [noVigOpen, setNoVigOpen] = useState(false);

      const decimalOdds = useMemo(() => {
        const p = parseOdds(oddsInput, oddsFormat);
        if (p === null) return null;
        return oddsFormat === 'american' ? americanToDecimal(p) : p;
      }, [oddsInput, oddsFormat]);

      const result = useMemo(() => {
        if (!decimalOdds || decimalOdds <= 1 || bankroll <= 0) return null;
        const p = winProbPct / 100;
        if (p <= 0 || p >= 1) return null;
        return calculateKelly({ bankroll, decimalOdds, winProbability: p, minStake });
      }, [bankroll, decimalOdds, winProbPct, minStake]);

      const chartEnabled = !!decimalOdds && decimalOdds > 1 && bankroll > 0 && winProbPct > 0 && winProbPct < 100;

      const chartData = useMemo(() => {
        if (!chartEnabled) return [];
        return simulateBankrollTrajectory(bankroll, decimalOdds, winProbPct / 100, 50);
      }, [chartEnabled, bankroll, decimalOdds, winProbPct]);

      const handleDerive = () => {
        if (decimalOdds && decimalOdds > 1) setWinProbPct(Math.round(impliedProbability(decimalOdds) * 1000) / 10);
      };

      const profitIfWin = result && decimalOdds && result.recommendedStake > 0
        ? result.recommendedStake * (decimalOdds - 1) : 0;

      return (
        <div style={{ minHeight: '100vh', background: '#000', position: 'relative' }}>
          <div style={{ pointerEvents: 'none', position: 'fixed', inset: 0, overflow: 'hidden', zIndex: -1 }}>
            <div style={{ position: 'absolute', top: '-20%', left: '-15%', width: '55vw', height: '55vw', borderRadius: '50%', background: 'radial-gradient(circle,rgba(134,134,134,0.06) 0%,transparent 70%)', filter: 'blur(80px)' }} />
          </div>

          {/* Header */}
          <header style={{ borderBottom: '1px solid #2a2a2a', background: 'rgba(0,0,0,0.8)', backdropFilter: 'blur(16px)', position: 'sticky', top: 0, zIndex: 40 }}>
            <div style={{ maxWidth: 1152, margin: '0 auto', padding: '1rem 1.5rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <div style={{ fontSize: '1.125rem', fontWeight: 700, color: '#efefef' }}>Bankroll IQ</div>
                <div style={{ fontSize: '0.65rem', color: '#868686', textTransform: 'uppercase', letterSpacing: '0.15em' }}>Micro-bankroll stake optimizer</div>
              </div>
              <button className="btn-ghost" onClick={() => setNoVigOpen(true)}>No-Vig Tool</button>
            </div>
          </header>

          <main style={{ maxWidth: 1152, margin: '0 auto', padding: '1.5rem' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: '1.5rem' }} className="lg-grid">
              <style>{`@media(min-width:1024px){ .lg-grid{ grid-template-columns: 1fr 2fr !important; } }`}</style>

              {/* Inputs */}
              <div>
                <div className="card" style={{ padding: '1.25rem' }}>
                  <div style={{ fontWeight: 600, marginBottom: '1.25rem', color: '#efefef' }}>Inputs</div>

                  <div style={{ marginBottom: '1rem' }}>
                    <label className="label">Starting Bankroll (USD)</label>
                    <input className="input-base" type="number" min="1" value={bankroll}
                      onChange={e => setBankroll(Math.max(0, parseFloat(e.target.value) || 0))} />
                  </div>

                  <div style={{ marginBottom: '1rem' }}>
                    <label className="label">Odds Format</label>
                    <div style={{ display: 'flex', borderRadius: 8, border: '1px solid #2a2a2a', overflow: 'hidden' }}>
                      {['american', 'decimal'].map(f => (
                        <button key={f} onClick={() => {
                          if (f === 'american' && decimalOdds) {
                            const am = decimalToAmerican(decimalOdds);
                            setOddsInput(am > 0 ? '+' + am : String(am));
                          } else if (f === 'decimal' && decimalOdds) {
                            setOddsInput(decimalOdds.toFixed(2));
                          }
                          setOddsFormat(f);
                        }}
                          style={{
                            flex: 1, padding: '0.6rem', fontSize: '0.8rem', fontWeight: 700, textTransform: 'uppercase',
                            letterSpacing: '0.08em', border: 'none', cursor: 'pointer',
                            background: oddsFormat === f ? '#efefef' : '#000',
                            color: oddsFormat === f ? '#000' : '#868686'
                          }}>{f}</button>
                      ))}
                    </div>
                  </div>

                  <div style={{ marginBottom: '1rem' }}>
                    <label className="label">Bookie Odds</label>
                    <input className="input-base" type="text" value={oddsInput}
                      onChange={e => setOddsInput(e.target.value)}
                      placeholder={oddsFormat === 'american' ? '+110' : '2.10'} />
                    {decimalOdds && decimalOdds > 1 && (
                      <p style={{ marginTop: 6, fontSize: 12, color: '#868686', fontFamily: 'JetBrains Mono, monospace' }}>
                        Decimal: {decimalOdds.toFixed(3)} · Implied: {(impliedProbability(decimalOdds) * 100).toFixed(1)}%
                      </p>
                    )}
                  </div>

                  <div style={{ marginBottom: '1rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                      <label className="label" style={{ marginBottom: 0 }}>Win Probability (%)</label>
                      <button className="btn-ghost" style={{ fontSize: '0.65rem', padding: '0.25rem 0.5rem' }}
                        onClick={handleDerive} disabled={!decimalOdds || decimalOdds <= 1}>Derive Implied</button>
                    </div>
                    <input className="input-base" type="number" min="1" max="99" step="0.1" value={winProbPct}
                      onChange={e => setWinProbPct(Math.min(99, Math.max(0, parseFloat(e.target.value) || 0)))} />
                    <input type="range" min="1" max="99" step="0.5" value={winProbPct}
                      onChange={e => setWinProbPct(parseFloat(e.target.value))} style={{ marginTop: 8 }} />
                  </div>

                  <div>
                    <label className="label">Sportsbook Min Stake ($)</label>
                    <input className="input-base" type="number" min="0.01" step="0.01" value={minStake}
                      onChange={e => setMinStake(Math.max(0.01, parseFloat(e.target.value) || 0.5))} />
                  </div>
                </div>

                <div className="card" style={{ marginTop: '1rem', padding: '1rem', fontSize: 12, color: '#868686', lineHeight: 1.5 }}>
                  <strong style={{ color: '#efefef' }}>Tip:</strong> With a $20 roll prefer Quarter Kelly. Always require a real edge (your win % &gt; implied).
                </div>
              </div>

              {/* Outputs */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                {!result ? (
                  <div className="card" style={{ padding: '2rem', textAlign: 'center', color: '#868686' }}>
                    Enter odds and win probability to see recommended stakes
                  </div>
                ) : (
                  <>
                    {/* EV banner */}
                    <div className="card" style={{ padding: '1rem', display: 'flex', alignItems: 'center', gap: '0.75rem',
                      borderColor: result.isPositiveEV ? 'rgba(239,239,239,0.25)' : 'rgba(134,134,134,0.4)' }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 600, fontSize: 14, color: '#efefef' }}>
                          {result.isPositiveEV ? 'Positive Expected Value' : 'Negative EV — Do Not Bet'}
                        </div>
                        <div style={{ fontSize: 12, color: '#868686', marginTop: 2 }}>
                          EV = {result.expectedValue >= 0 ? '+' : ''}{(result.expectedValue * 100).toFixed(2)}% per unit risked
                        </div>
                      </div>
                      <div style={{ fontSize: 18, fontFamily: 'JetBrains Mono, monospace', fontWeight: 600,
                        color: result.isPositiveEV ? '#efefef' : '#868686' }}>
                        {result.expectedValue >= 0 ? '+' : ''}{formatPct(result.expectedValue)}
                      </div>
                    </div>

                    {/* Profit / Loss */}
                    {result.recommendedStake > 0 && decimalOdds && (
                      <div className="card" style={{ padding: '1rem', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                        <div>
                          <div className="label">Profit if Win</div>
                          <div style={{ fontSize: 20, fontWeight: 600, fontFamily: 'JetBrains Mono, monospace', color: '#efefef' }}>
                            +{formatUSD(profitIfWin)}
                          </div>
                          <div style={{ fontSize: 11, color: '#868686', marginTop: 2 }}>
                            Stake {formatUSD(result.recommendedStake)} @ {decimalOdds.toFixed(2)}
                          </div>
                        </div>
                        <div>
                          <div className="label">Loss if Lose</div>
                          <div style={{ fontSize: 20, fontWeight: 600, fontFamily: 'JetBrains Mono, monospace', color: '#868686' }}>
                            {formatUSD(-result.recommendedStake)}
                          </div>
                          <div style={{ fontSize: 11, color: '#868686', marginTop: 2 }}>Full stake at risk</div>
                        </div>
                      </div>
                    )}

                    {result.belowMinStake && result.isPositiveEV && (
                      <div className="card" style={{ padding: '1rem', borderColor: 'rgba(134,134,134,0.5)', fontSize: 13 }}>
                        <strong style={{ color: '#efefef' }}>Bankroll Guardrail:</strong>
                        <span style={{ color: '#868686' }}> Bet size is below sportsbook minimum ({formatUSD(minStake)}). Rounding up increases bankruptcy risk.</span>
                      </div>
                    )}

                    {/* Stake cards */}
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.75rem' }}>
                      {[
                        { title: 'Quarter Kelly', stake: result.quarterKellyStake, frac: result.quarterKellyFraction, hl: result.recommendedLabel.startsWith('Quarter') },
                        { title: 'Half Kelly', stake: result.halfKellyStake, frac: result.halfKellyFraction, hl: result.recommendedLabel.startsWith('Half') },
                        { title: 'Flat 2%', stake: result.flat2PctStake, frac: 0.02, hl: false }
                      ].map(c => (
                        <div key={c.title} className="card" style={{
                          padding: '1rem', opacity: result.isPositiveEV ? 1 : 0.5,
                          borderColor: c.hl ? 'rgba(239,239,239,0.4)' : '#2a2a2a',
                          boxShadow: c.hl ? '0 0 0 1px rgba(239,239,239,0.3)' : 'none'
                        }}>
                          <div className="label">{c.title}</div>
                          <div style={{ fontSize: 22, fontWeight: 600, fontFamily: 'JetBrains Mono, monospace', color: '#efefef' }}>{formatUSD(c.stake)}</div>
                          <div style={{ fontSize: 13, color: '#868686', fontFamily: 'JetBrains Mono, monospace' }}>{formatPct(c.frac)} of bankroll</div>
                        </div>
                      ))}
                    </div>

                    {result.isPositiveEV && (
                      <div className="card" style={{ padding: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderColor: 'rgba(239,239,239,0.2)' }}>
                        <span style={{ fontSize: 14, color: '#868686' }}>Recommended for ${bankroll.toFixed(0)} bankroll:</span>
                        <div style={{ textAlign: 'right' }}>
                          <div style={{ fontSize: 20, fontWeight: 600, fontFamily: 'JetBrains Mono, monospace', color: '#efefef' }}>{formatUSD(result.recommendedStake)}</div>
                          <div style={{ fontSize: 11, color: '#868686', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{result.recommendedLabel}</div>
                        </div>
                      </div>
                    )}
                  </>
                )}

                {/* Chart */}
                <div className="card" style={{ padding: '1.25rem' }}>
                  <div style={{ marginBottom: '0.75rem' }}>
                    <div style={{ fontWeight: 600, fontSize: 14, color: '#efefef' }}>Bankroll Trajectory Simulator</div>
                    <div style={{ fontSize: 11, color: '#868686', marginTop: 2 }}>
                      50-bet path · on negative EV, Kelly lines force small stakes so the decline is visible
                    </div>
                  </div>
                  {!chartEnabled || chartData.length === 0 ? (
                    <div style={{ height: 280, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#868686', fontSize: 13 }}>
                      Enter valid odds and win probability to run simulation
                    </div>
                  ) : (
                    <div style={{ height: 280 }}>
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={chartData} margin={{ top: 5, right: 10, left: 0, bottom: 5 }}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#1a1a1a" />
                          <XAxis dataKey="bet" tick={{ fill: '#868686', fontSize: 11 }} axisLine={{ stroke: '#2a2a2a' }} />
                          <YAxis tick={{ fill: '#868686', fontSize: 11 }} axisLine={{ stroke: '#2a2a2a' }} tickFormatter={v => '$' + v} width={55} />
                          <Tooltip
                            contentStyle={{ background: '#0a0a0a', border: '1px solid #2a2a2a', borderRadius: 8, fontSize: 12 }}
                            labelStyle={{ color: '#868686' }}
                            formatter={(v, name) => [formatUSD(v), name === 'quarterKelly' ? 'Quarter Kelly' : name === 'halfKelly' ? 'Half Kelly' : 'Flat 2%']}
                          />
                          <Legend wrapperStyle={{ fontSize: 12 }} formatter={v => v === 'quarterKelly' ? 'Quarter Kelly' : v === 'halfKelly' ? 'Half Kelly' : 'Flat 2%'} />
                          <Line type="monotone" dataKey="quarterKelly" stroke="#efefef" strokeWidth={2} dot={false} />
                          <Line type="monotone" dataKey="halfKelly" stroke="#868686" strokeWidth={2} dot={false} />
                          <Line type="monotone" dataKey="flat" stroke="#5a5a5a" strokeWidth={2} dot={false} />
                        </LineChart>
                      </ResponsiveContainer>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </main>

          {/* No-Vig Modal */}
          {noVigOpen && (
            <NoVigModal oddsFormat={oddsFormat} onClose={() => setNoVigOpen(false)} />
          )}
        </div>
      );
    }

    function NoVigModal({ oddsFormat, onClose }) {
      const [o1, setO1] = useState(oddsFormat === 'american' ? '-110' : '1.91');
      const [o2, setO2] = useState(oddsFormat === 'american' ? '-110' : '1.91');
      const result = useMemo(() => {
        const r1 = parseOdds(o1, oddsFormat), r2 = parseOdds(o2, oddsFormat);
        if (r1 === null || r2 === null) return null;
        const d1 = oddsFormat === 'american' ? americanToDecimal(r1) : r1;
        const d2 = oddsFormat === 'american' ? americanToDecimal(r2) : r2;
        if (d1 <= 1 || d2 <= 1) return null;
        const { fairP1, fairP2, overround } = removeVig(d1, d2);
        return { fairP1, fairP2, overround, fairOdds1: 1 / fairP1, fairOdds2: 1 / fairP2 };
      }, [o1, o2, oddsFormat]);

      return (
        <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.8)', backdropFilter: 'blur(4px)' }} onClick={onClose} />
          <div className="card" style={{ position: 'relative', width: '100%', maxWidth: 420, padding: '1.5rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
              <div style={{ fontWeight: 600, fontSize: 16, color: '#efefef' }}>No-Vig / Fair Odds</div>
              <button className="btn-ghost" onClick={onClose} style={{ padding: '0.25rem 0.5rem' }}>✕</button>
            </div>
            <p style={{ fontSize: 13, color: '#868686', marginBottom: '1rem' }}>
              Enter both sides of a two-way market. We remove the vig and return fair probabilities.
            </p>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: '1rem' }}>
              <div>
                <label className="label">Side 1 Odds</label>
                <input className="input-base" value={o1} onChange={e => setO1(e.target.value)} />
              </div>
              <div>
                <label className="label">Side 2 Odds</label>
                <input className="input-base" value={o2} onChange={e => setO2(e.target.value)} />
              </div>
            </div>
            {result ? (
              <div style={{ background: '#000', border: '1px solid #2a2a2a', borderRadius: 8, padding: '1rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 12 }}>
                  <span style={{ color: '#868686' }}>Overround (Vig)</span>
                  <span style={{ fontFamily: 'JetBrains Mono, monospace', color: '#efefef' }}>{formatPct(result.overround)}</span>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, borderTop: '1px solid #2a2a2a', paddingTop: 12 }}>
                  <div>
                    <div className="label">Fair Prob Side 1</div>
                    <div style={{ fontSize: 20, fontWeight: 600, fontFamily: 'JetBrains Mono, monospace', color: '#efefef' }}>{formatPct(result.fairP1)}</div>
                  </div>
                  <div>
                    <div className="label">Fair Prob Side 2</div>
                    <div style={{ fontSize: 20, fontWeight: 600, fontFamily: 'JetBrains Mono, monospace', color: '#efefef' }}>{formatPct(result.fairP2)}</div>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{ textAlign: 'center', color: '#868686', fontSize: 13, padding: '1rem', border: '1px solid #2a2a2a', borderRadius: 8 }}>
                Enter valid odds for both sides
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
