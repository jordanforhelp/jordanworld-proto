      const open = await cloudGetOpenSession(tableKey);
      if (!open) return { claimed: false, joinCode: null };
      const owner = open.guest_phone || "";
      if (!owner) {
        return { claimed: true, session: open, takeover: true, joinCode: open.join_code || null };
      }
      if (phonesMatch(owner, phone)) {
        return { claimed: true, session: open, mine: true, joinCode: open.join_code || null };
      }
      const code = String(joinCode || "").replace(/\D/g, "");
      const sessionCode = String(open.join_code || "").replace(/\D/g, "");
      if (code && sessionCode && code === sessionCode) {
        return { claimed: true, session: open, joined: true, joinCode: sessionCode };
      }
      if (code && sessionCode && code !== sessionCode) {
        throw new Error("BAD_OTP");
      }
      throw new Error("TABLE_IN_USE");
    }

    function periodBounds(period) {
      const now = new Date();
      if (period === "all") return { from: null, to: null };
      if (period === "month") {
        const from = new Date(now.getFullYear(), now.getMonth(), 1);
        return { from: from.toISOString(), to: null };
      }
      const from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const to = new Date(from);
      to.setDate(to.getDate() + 1);
      return { from: from.toISOString(), to: to.toISOString() };
    }

    async function cloudFetchInsights(period) {
      if (!sb) throw new Error("Cloud not connected");
      const { from, to } = periodBounds(period || "day");
      let q = sb.from("bloom_order_rounds").select("id, status, items, total, created_at, session_id");
      if (from) q = q.gte("created_at", from);
      if (to) q = q.lt("created_at", to);
      const { data: rounds, error } = await q.order("created_at", { ascending: false }).limit(2000);
      if (error) throw error;
      let list = rounds || [];
      const sids = [...new Set(list.map(r => r.session_id).filter(Boolean))];
      let sessionMap = {};
      if (sids.length) {
        const { data: sessions, error: e2 } = await sb.from("bloom_table_sessions").select("id, table_no, status, guest_name").in("id", sids);
        if (e2) throw e2;
        (sessions || []).forEach(s => { sessionMap[s.id] = s; });
        list = list.map(r => ({ ...r, table_sessions: sessionMap[r.session_id] || null }));
      }
      const isOpenSess = (r) => r.table_sessions && r.table_sessions.status === "open";
      const isCancelled = (r) => /cancel/i.test(String(r.status || ""));
      // Pending = waiting confirm on a table that is still open (not old abandoned rounds)
      const pendingList = list.filter(r => r.status === "new" && isOpenSess(r) && !isCancelled(r));
      // Confirmed flow (exclude new + cancelled)
      const confirmed = list.filter(r => {
        if (!r.status || r.status === "new" || isCancelled(r)) return false;
        return true;
      });
      let revenue = 0;
      const byTable = {};
      const byDish = {};
      confirmed.forEach(r => {
        revenue += Number(r.total) || 0;
        const tno = (r.table_sessions && r.table_sessions.table_no) || "?";
        if (!byTable[tno]) byTable[tno] = { table: tno, rounds: 0, bill: 0 };
        byTable[tno].rounds += 1;
        byTable[tno].bill += Number(r.total) || 0;
        (r.items || []).forEach(it => {
          const name = it.name || "Item";
          byDish[name] = (byDish[name] || 0) + (it.qty || 1);
        });
      });
      const tables = Object.values(byTable);
      const avgBill = tables.length ? Math.round(tables.reduce((s, x) => s + x.bill, 0) / tables.length) : 0;
      const topDishes = Object.entries(byDish).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const meaningful = list.filter(r => !isCancelled(r));
      return {
        period: period || "day",
        pending: pendingList.length,
        confirmedRounds: confirmed.length,
        totalRounds: pendingList.length + confirmed.length,
        revenue,
        avgBill,
        tablesActive: tables.length,
        tables,
        topDishes,
        rawRounds: meaningful,
      };
    }

    /** Never trust client prices — reprice from cached bloom_menu. */
    async function repriceOrderItems(items) {
      const byId = await getMenuByIdMap();
      const out = [];
      for (const i of items) {
        if (String(i.id) === "snake-discount") continue;
        const d = byId[String(i.id)];
        if (!d || d.visible === false) throw new Error("Item unavailable: " + (i.name || i.id));
        let unit = Number(d.price) || 0;
        const vLabel = i.variantLabel || null;
        if (vLabel && Array.isArray(d.variants)) {
          const v = d.variants.find(x => x.label === vLabel);
          if (!v) throw new Error("Invalid size for " + d.name);
          unit = Number(v.price) || unit;
        }
        const qty = Math.max(1, Math.min(50, Number(i.qty) || 1));
        out.push({
          id: d.id,
          name: d.name,
          variantLabel: vLabel,
          price: unit,
          qty,
          note: i.note ? String(i.note).slice(0, 120) : null,
        });
      }
      if (!out.length) throw new Error("Cart is empty");
      return out;
    }

    async function cloudPlaceOrder(items, tableLabel, guest, discount) {
      if (!sb) throw new Error("Supabase not loaded");
      const tableKey = String(tableLabel).trim().replace(/^0+/, "") || String(tableLabel).trim();

      // Always load registered tables from cloud (fixes table 13+ and undefined tablePins)
      let pinsMap = DEFAULT_TABLE_PINS;
      try {
        const remote = await cloudFetchPins();
        if (remote && typeof remote === "object") pinsMap = remote;
      } catch (e) {}
      if (!isRegisteredTable(tableKey, pinsMap)) {
        throw new Error("Invalid table. Scan the QR code on your table.");
      }

      const phone = normalizePhoneIN(guest && guest.phone);
      if (!phone || phone.replace(/\D/g, "").length < 10) {
        throw new Error("Enter a valid mobile number to order");
      }
      if (guest && guest.table && String(guest.table).replace(/^0+/, "") !== String(tableKey)) {
        throw new Error("TABLE_IN_USE");
      }

      const slimItems = (items || [])
        .filter(i => String(i.id) !== "snake-discount")
        .map(i => ({
          id: i.id,
          name: i.name,
          variantLabel: i.variantLabel || null,
          qty: i.qty,
          note: i.note ? String(i.note).slice(0, 120) : null,
        }));

      const pct = discount && discount.percent > 0
        ? Math.min(5, Math.max(0, Number(discount.percent) || 0))
        : 0;

      // Preferred path: server RPC (prices + claim enforced in Postgres)
      try {
        // Never send a stale OTP from an old paid visit
        let joinForRpc = (guest && (guest.joinCode || guest.tableOtp)) || null;
        try {
          const openNow = await cloudGetOpenSession(tableKey);
          const live = openNow && openNow.join_code ? String(openNow.join_code).replace(/\D/g, "") : "";
          const held = joinForRpc ? String(joinForRpc).replace(/\D/g, "") : "";
          if (!openNow) {
            joinForRpc = null; // new visit after clear
          } else if (held && live && held !== live) {
            if (!phonesMatch(openNow.guest_phone, phone)) {
              throw new Error("BAD_OTP");
            }
            joinForRpc = live; // same claimer, refresh code
          } else if (!held && live) {
            joinForRpc = null;
          }
        } catch (e) {
          if (e && e.message === "BAD_OTP") throw e;
        }
        const { data, error } = await sb.rpc("bloom_place_order", {
          p_table_no: tableKey,
          p_guest_name: (guest && guest.name) || null,
          p_guest_phone: phone,
          p_join_code: joinForRpc,
          p_items: slimItems,
          p_discount_percent: pct,
        });
        if (error) throw error;
        const joinCode = (data && data.joinCode) || "";
        if (joinCode) {
          try { localStorage.setItem("bloom_table_otp_" + tableKey, joinCode); } catch (e) {}
        }
        return {
          tableKey,
          sessionId: data && data.sessionId,
          roundId: data && data.roundId,
          joinCode,
          orderedBy: (data && data.orderedBy) || (guest && guest.name) || null,
        };
      } catch (rpcErr) {
        const msg = (rpcErr && rpcErr.message) || String(rpcErr || "");
        if (/table_in_use/i.test(msg)) throw new Error("TABLE_IN_USE");
        if (/invalid_table/i.test(msg)) throw new Error("Invalid table. Scan the QR code on your table.");
        if (/invalid_phone/i.test(msg)) throw new Error("Enter a valid mobile number to order");
        if (/empty_cart|item_unavailable|invalid_size|menu_missing/i.test(msg)) throw new Error(msg);
        // If RPC not installed yet, fall back to client path (still reprice from menu)
        if (!/could not find|function.*bloom_place_order|PGRST202|404/i.test(msg)) {
          // claim / OTP errors from RPC
          if (/BAD_OTP|otp/i.test(msg)) throw new Error("BAD_OTP");
          console.warn("bloom_place_order RPC failed, using fallback", msg);
        }
      }

      // Fallback (older DB without RPC) — still reprice from menu
      const [payloadItems, openSess] = await Promise.all([
        repriceOrderItems(items),
        cloudGetOpenSession(tableKey),
      ]);
      let total = payloadItems.reduce((s, i) => s + i.price * i.qty, 0);
      if (pct > 0) {
        const off = Math.round(total * (pct / 100));
        total = Math.max(0, total - off);
        payloadItems.push({
          id: "snake-discount",
          name: "Snake reward (" + pct + "% off)",
          variantLabel: null,
          price: -off,
          qty: 1,
        });
      }
      const ordererName = (guest && guest.name) ? String(guest.name).slice(0, 80) : null;
      let sessionId;
      let jcOut = "";
      if (openSess) {
        const owner = openSess.guest_phone || "";
        const isOwner = !owner || phonesMatch(owner, phone);
        if (!isOwner) {
          const code = String((guest && (guest.joinCode || guest.tableOtp)) || "").replace(/\D/g, "");
          const sessionCode = String(openSess.join_code || "").replace(/\D/g, "");
          if (!code || !sessionCode || code !== sessionCode) {
            if (code && sessionCode) throw new Error("BAD_OTP");
            throw new Error("TABLE_IN_USE");
          }
        }
        sessionId = openSess.id;
        jcOut = openSess.join_code || "";
        const patch = {};
        if (isOwner) {
          if (guest && guest.name && !openSess.guest_name) patch.guest_name = guest.name;
          if (!owner) patch.guest_phone = phone;
        }
        if (!openSess.join_code) {
          jcOut = makeJoinCode();
          patch.join_code = jcOut;
        }
        const roundPayload = {
          session_id: sessionId,
          status: "new",
          items: payloadItems,
          total,
          ordered_by_name: ordererName,
          ordered_by_phone: phone,
        };
        const tasks = [
          sb.from("bloom_order_rounds").insert(roundPayload).select("id").single(),
        ];
        if (Object.keys(patch).length) {
          tasks.push(sb.from("bloom_table_sessions").update(patch).eq("id", sessionId));
        }
        const results = await Promise.all(tasks);
        const roundRes = results[0];
        if (roundRes.error) throw roundRes.error;
        if (jcOut) {
          try { localStorage.setItem("bloom_table_otp_" + tableKey, jcOut); } catch (e) {}
        }
        return { tableKey, sessionId, roundId: roundRes.data && roundRes.data.id, joinCode: jcOut, orderedBy: ordererName };
      }
      jcOut = makeJoinCode();
      const { data: created, error: e1 } = await sb
        .from("bloom_table_sessions")
        .insert({
          table_no: tableKey,
          guest_name: ordererName,
          guest_phone: phone,
          join_code: jcOut,
          status: "open",
        })
        .select("id")
        .single();
      if (e1) throw e1;
      sessionId = created.id;
      const ins = await sb.from("bloom_order_rounds").insert({
        session_id: sessionId,
        status: "new",
        items: payloadItems,
        total,
        ordered_by_name: ordererName,
        ordered_by_phone: phone,
      }).select("id").single();
      if (ins.error) throw ins.error;
      try { localStorage.setItem("bloom_table_otp_" + tableKey, jcOut); } catch (e) {}
      return { tableKey, sessionId, roundId: ins.data && ins.data.id, joinCode: jcOut, orderedBy: ordererName };
    }

          return {

            kind: i % 3 === 0 ? "petal" : "confetti",
            color: colors[i % colors.length],
            bx: Math.cos(angle) * dist + (i % 2 ? 20 : -20),

    const PinModal = ({ onSuccess, onClose, forced }) => {
      const [pin, setPin] = useState("");

      const [shake, setShake] = useState(false);
      const [lockLeft, setLockLeft] = useState(() => staffLockRemainingMs());

      useEffect(() => {
        const id = setInterval(() => setLockLeft(staffLockRemainingMs()), 1000);
        return () => clearInterval(id);
      }, []);

      const locked = lockLeft > 0;

      const handleDigit = (d) => {
        if (locked) return;
        if (pin.length >= STAFF_PIN_LEN) return;
        const next = pin + d;
        setPin(next);
        setError("");
        if (next.length === STAFF_PIN_LEN) {
          hashStaffPin(next).then(h => {
            if (h === STAFF_PIN_HASH) {
              clearStaffLock();
              setTimeout(() => onSuccess(), 180);
            } else {
              const cur = readStaffLock();
              const fails = (cur.fails || 0) + 1;
              if (fails >= STAFF_LOCK_MAX) {
                const until = Date.now() + STAFF_LOCK_MS;
                writeStaffLock(0, until);
                setLockLeft(STAFF_LOCK_MS);
                setError("Too many attempts. Try again in 5 minutes.");
              } else {
                writeStaffLock(fails, 0);
                setError(`Incorrect PIN. ${STAFF_LOCK_MAX - fails} tries left.`);
              }
              setShake(true);
              setTimeout(() => { setPin(""); setShake(false); }, 600);
            }
          }).catch(() => {
            setError("Could not verify PIN");
            setShake(true);
            setTimeout(() => { setPin(""); setShake(false); }, 600);
          });
        }
      };
      const handleBack = () => { if (!locked) setPin(p => p.slice(0, -1)); };

      useEffect(() => {
        const onKey = (e) => {
          if (e.key >= "0" && e.key <= "9") handleDigit(e.key);
          else if (e.key === "Backspace") handleBack();
          else if (e.key === "Escape" && !forced && onClose) onClose();
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [pin, locked]);

      const mins = Math.floor(lockLeft / 60000);

    // Mini Snake — play from order History while you wait
    const SnakeGame = ({ open, onClose, snakeDiscount, onRewardUnlocked, showToast }) => {
      const canvasRef = useRef(null);
      const [score, setScore] = useState(0);
      const [high, setHigh] = useState(() => {
        try { return parseInt(localStorage.getItem("bloom_snake_high") || "0", 10) || 0; } catch { return 0; }
      });
      const [running, setRunning] = useState(false);
      const [gameOver, setGameOver] = useState(false);
      const [started, setStarted] = useState(false);
      const [rewardHit, setRewardHit] = useState(false);
      const stateRef = useRef(null);
      const drawRef = useRef(null);
      const runningRef = useRef(false);
      const rewardGivenRef = useRef(false);
      const touchRef = useRef({ x: 0, y: 0 });
      const settingsRef = useRef(snakeDiscount || DEFAULT_SNAKE_DISCOUNT);
      settingsRef.current = snakeDiscount || DEFAULT_SNAKE_DISCOUNT;

      const COLS = 18;
      const ROWS = 18;
      const CELL = 22;
      const W = COLS * CELL;
      const H = ROWS * CELL;

      const resetState = () => {
        const mid = Math.floor(COLS / 2);
        const snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
        const dir = { x: 1, y: 0 };
        const placeFood = (body) => {
          let f;
          do {
            f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
          } while (body.some(s => s.x === f.x && s.y === f.y));
          return f;
        };
        return { snake, dir, nextDir: { ...dir }, food: placeFood(snake), score: 0, alive: true };
      };

      const setupCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return null;
        // Sharp pixels — no soft scaling blur
        const dpr = Math.min(Math.floor(window.devicePixelRatio || 1), 2);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;
        return ctx;
      };

      const drawFrame = (ctx, st) => {
        if (!ctx || !st) return;
        // crisp board
        ctx.fillStyle = "#FFF8FA";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(194,24,91,0.08)";
        ctx.lineWidth = 1;
        for (let i = 0; i <= COLS; i++) {
          ctx.beginPath(); ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, H); ctx.stroke();
        }
        for (let j = 0; j <= ROWS; j++) {
          ctx.beginPath(); ctx.moveTo(0, j * CELL + 0.5); ctx.lineTo(W, j * CELL + 0.5); ctx.stroke();
        }
        // boba pearl (food) — solid, clear circle
        const fx = st.food.x * CELL + CELL / 2;
        const fy = st.food.y * CELL + CELL / 2;
        const pr = CELL * 0.34;
        ctx.beginPath();
        ctx.arc(fx, fy, pr, 0, Math.PI * 2);
        ctx.fillStyle = "#C2185B";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(fx - pr * 0.28, fy - pr * 0.28, pr * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.globalAlpha = 0.45;
        ctx.fill();
        ctx.globalAlpha = 1;
        // snake — solid rounded blocks (classic, sharp)
        st.snake.forEach((s, i) => {
          const pad = 2;
          const x = s.x * CELL + pad;
          const y = s.y * CELL + pad;
          const size = CELL - pad * 2;
          const r = 5;
          ctx.fillStyle = i === 0 ? "#AD1457" : "#C2185B";
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x, y, size, size, r);
          else ctx.rect(x, y, size, size);
          ctx.fill();
          if (i === 0) {
            // simple eyes

            const ey = s.y * CELL + CELL * 0.32 + st.dir.y * 2;
            const gap = st.dir.x === 0 ? 5 : 0;
            const gapY = st.dir.y === 0 ? 5 : 0;
            ctx.beginPath(); ctx.arc(ex, ey, 2.2, 0, Math.PI * 2); ctx.fill();

        const g = guest && guest.exp && Date.now() < guest.exp && String(guest.table || "") === String(tk) ? guest : null;
        if (!g) {
          setShownTableOtp("");
          return;
        }
        (async () => {
          try {
            if (!sb) {
              setShownTableOtp("");
              return;
            }
            const open = await cloudGetOpenSession(tk);
            if (cancelled) return;
            if (!open) {
              // Table was paid / cleared — wipe this visit on this browser
              setOrderHistory([]);
              setShownTableOtp("");
              setGuest(null);
              try {
                localStorage.removeItem("bloom_history_" + tk);
                localStorage.removeItem("bloom_dining_" + tk);
                localStorage.removeItem("bloom_table_otp_" + tk);
                localStorage.removeItem("bloom_dining_any");
              } catch (e) {}
              return;
            }
            const live = String(open.join_code || "").replace(/\D/g, "");
            const local = String(g.joinCode || g.tableOtp || "").replace(/\D/g, "")
              || String((() => { try { return localStorage.getItem("bloom_table_otp_" + tk) || ""; } catch (e) { return ""; } })()).replace(/\D/g, "");
            // Only show OTP when this browser already holds the code for the CURRENT session
            if (live && local && live === local) {
              setShownTableOtp(live);
            } else {
              // Stale code from a previous visit (after paid clear) — hide and drop it
              setShownTableOtp("");
              try { localStorage.removeItem("bloom_table_otp_" + tk); } catch (e) {}
              if (local && live && local !== live) {
                const ng = { ...g, joinCode: "", tableOtp: "" };
                setGuest(ng);
                try { localStorage.setItem("bloom_dining_" + tk, JSON.stringify(ng)); } catch (e) {}
              }
            }
          } catch (e) {
            if (!cancelled) setShownTableOtp("");
          }
        })();
        return () => { cancelled = true; };
      }, [tableFromQr, guest]);
      const [gatePhone, setGatePhone] = useState("");
      const [loginBusy, setLoginBusy] = useState(false);
      const pendingPlace = useRef(null);
      const [search, setSearch] = useState("");
      const [pairingDish, setPairingDish] = useState(null);
      const [variantDish, setVariantDish] = useState(null);
      const [cartOpen, setCartOpen] = useState(false);
      const [cartTab, setCartTab] = useState("cart");
      const [showSnake, setShowSnake] = useState(false);
      const [orderBurst, setOrderBurst] = useState(false);
      const [badgePulse, setBadgePulse] = useState(false);
      const [headerScrolled, setHeaderScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setHeaderScrolled(window.scrollY > 24);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      const [orderHistory, setOrderHistory] = useState(() => {
        try {
          const t = (tableFromQr || "").toString();
          const key = "bloom_history_" + (t || "guest");
          return JSON.parse(localStorage.getItem(key) || "[]");
        } catch { return []; }
      });
      const pushHistory = (items, tableLabel, extra) => {
        const entry = {
          id: (extra && extra.roundId) ? String(extra.roundId) : ("H-" + Date.now()),
          roundId: extra && extra.roundId ? String(extra.roundId) : null,
          table: String(tableLabel),
          orderedBy: (extra && extra.orderedBy) || (guest && guest.name) || null,
          items: items.map(i => ({
            name: i.name,
            variantLabel: i.variantLabel || null,
            qty: i.qty,
            price: i.price,
            note: i.note || null,
          })),
          total: items.reduce((s, i) => s + i.price * i.qty, 0),
          status: (extra && extra.status) || "new",
          at: new Date().toISOString(),
        };
        setOrderHistory(prev => {
          const next = [entry, ...prev.filter(h => String(h.id) !== String(entry.id) && String(h.roundId || "") !== String(entry.roundId || ""))].slice(0, 40);
          try {
            localStorage.setItem("bloom_history_" + (String(tableLabel) || "guest"), JSON.stringify(next));
          } catch {}
          return next;
        });
      };

      // History is only for the *current* open table session.
      // When staff marks Paid, clear table, session closes → wipe local history.
      const clearLocalHistory = useCallback((tableLabel) => {
        const t = String(tableLabel || tableFromQr || "guest").replace(/^0+/, "") || String(tableLabel || tableFromQr || "guest");
        setOrderHistory([]);
        setShownTableOtp("");
        setGuest(null);
        saveSnakeReward(null); // bill paid / session closed — end visit discount
        try {
          localStorage.removeItem("bloom_history_" + t);
          localStorage.removeItem("bloom_history_guest");
          localStorage.removeItem("bloom_dining_" + t);
          localStorage.removeItem("bloom_table_otp_" + t);
          localStorage.removeItem("bloom_dining_any");
        } catch {}
      }, [tableFromQr]);

      const syncHistoryWithSession = useCallback(async () => {
        const tk = String(tableFromQr || "").replace(/^0+/, "") || String(tableFromQr || "");
        if (!tk || !sb) return;
        try {
          const list = await cloudFetchTableHistory(tk);
          if (!list.length) {
            // Session closed or no orders yet — keep empty shared view
            const open = await cloudGetOpenSession(tk);
            if (!open) {
              clearLocalHistory(tk);
              return;
            }
            setOrderHistory([]);
            try { localStorage.setItem("bloom_history_" + tk, "[]"); } catch (e) {}
            return;
          }
          setOrderHistory(list);
          try { localStorage.setItem("bloom_history_" + tk, JSON.stringify(list)); } catch (e) {}
        } catch (e) {
          console.error("history sync", e);
        }
      }, [tableFromQr, clearLocalHistory]);

      useEffect(() => {
        syncHistoryWithSession();
        const id = setInterval(syncHistoryWithSession, 4000);
        return () => clearInterval(id);
      }, [syncHistoryWithSession]);

      useEffect(() => {
        if (cartOpen) syncHistoryWithSession();
      }, [cartOpen, syncHistoryWithSession]);

      // Live updates when anyone at the table orders
      useEffect(() => {
        if (!sb || !tableFromQr) return;
        const tk = String(tableFromQr).replace(/^0+/, "") || String(tableFromQr);
        const ch = sb.channel("table-hist-" + tk)
          .on("postgres_changes", { event: "*", schema: "public", table: "bloom_order_rounds" }, () => {
            syncHistoryWithSession();
          })
          .on("postgres_changes", { event: "*", schema: "public", table: "bloom_table_sessions" }, () => {
            syncHistoryWithSession();
          })
          .subscribe();
        return () => { try { sb.removeChannel(ch); } catch (e) {} };
      }, [tableFromQr, syncHistoryWithSession]);

      const filtered = useMemo(() => {
        let list = dishes.filter(d => d.visible);
        if (filter !== "All") list = list.filter(d => d.category === filter);
        if (search.trim()) {
          const q = search.toLowerCase();
          list = list.filter(d => d.name.toLowerCase().includes(q));
        }
        const catOrder = { "Milk Tea": 1, "Fruit Tea": 2, "Signature": 3, "Slush & Smoothies": 4, "Pure Tea": 5, "Coffee": 6, "Toppings": 7, "Snacks": 8 };
        return [...list].sort((a, b) => {
          const ca = catOrder[a.category] || 50;
          const cb = catOrder[b.category] || 50;
          if (ca !== cb) return ca - cb;
          return (a.sortOrder || 99) - (b.sortOrder || 99);
        });
      }, [dishes, filter, search]);

      const total = sessionItems.reduce((s, i) => s + i.price * i.qty, 0);
      const itemCount = sessionItems.reduce((s, i) => s + i.qty, 0);

      const addToSession = (item) => {
        const key = item.variantLabel ? `${item.id}::${item.variantLabel}` : String(item.id);
        setSessionItems(prev => {
          const existing = prev.find(i => (i.sessionKey || String(i.id)) === key);
          if (existing) return prev.map(i => (i.sessionKey || String(i.id)) === key ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { ...item, sessionKey: key, qty: 1 }];
        });
        setBadgePulse(true);
        setTimeout(() => setBadgePulse(false), 400);
        const label = item.variantLabel ? `${item.name} (${item.variantLabel})` : item.name;
        showToast(`${label} added`);
      };

      const handleAdd = (dish) => {
        if (!tableFromQr) {
          showToast("Scan the QR on your table to order");
          return;
        }
        if (!isRegisteredTable(tableFromQr, tablePins)) {
          showToast("Invalid table. Scan the official QR on your table.");
          return;
        }
        if (dish.variants && dish.variants.length > 0) {
          setVariantDish(dish);
          return;
        }
        addToSession(dish);
      };

      const handleVariantPick = (variant) => {
        if (!variantDish) return;
        addToSession({
          ...variantDish,
          price: variant.price,
          variantLabel: variant.label,
          name: variantDish.name,
        });
        setVariantDish(null);
      };

      return (
        <div className="min-h-screen ambient-bg pb-10" style={{ paddingBottom: "max(2.5rem, calc(env(safe-area-inset-bottom) + 1.5rem))" }}>
          <header className="relative pt-10 pb-10 px-4 overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(194,24,91,0.07)_0%,_transparent_55%)]" />
            <div className="relative max-w-5xl mx-auto text-center">
              <p className="text-pink tracking-[0.3em] uppercase text-xs font-medium mb-3">Boba Café</p>
              <h1 className="font-display text-5xl md:text-7xl text-ink tracking-tight">Bloom</h1>
              {tableFromQr && !isRegisteredTable(tableFromQr, tablePins) ? (
                <div className="mt-5 max-w-md mx-auto rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 text-left">
                  <strong>Table {tableFromQr}</strong> is not valid. Do not change the link — scan the QR on your table.
                </div>
              ) : tableFromQr ? (
                <div className="mt-5 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-pink-soft border border-pink/25">
                  <span className="w-2 h-2 rounded-full bg-pink" />
                  <span className="text-pink text-sm font-medium">Table {tableFromQr}</span>
                  {(() => {
                    const tk = String(tableFromQr || "").replace(/^0+/, "") || String(tableFromQr || "");
                    const otp = shownTableOtp || (typeof localStorage !== "undefined" && tk ? localStorage.getItem("bloom_table_otp_" + tk) : "") || "";
                    return otp ? (
                      <span className="ml-2 inline-flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded-full bg-pink text-white shadow-sm">
                        Table OTP {otp}
                      </span>
                    ) : null;
                  })()}
                </div>
              ) : (
                <div className="mt-5 max-w-sm mx-auto px-3">
                  <p className="text-mist text-sm leading-relaxed">
                    Scan the <span className="text-pink font-medium">QR code on your table</span> to order.
                  </p>
                </div>
              )}
            </div>
          </header>

          <div className={`sticky top-0 z-40 glass border-y border-pink/10 sticky-search ${headerScrolled ? "scrolled" : ""}`}>
            <div className="max-w-6xl mx-auto px-4 py-3">
              <div className="flex items-center gap-2">
                <div className="relative flex-1 min-w-0">
                  <Icon name="search" size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mist pointer-events-none" aria-hidden="true" />
                  <input type="search" placeholder="Search drinks & snacks…" value={search} onChange={e => setSearch(e.target.value)}
                    className="w-full min-h-[44px] bg-white border border-pink/15 rounded-2xl pl-11 pr-4 text-[15px] leading-5 text-ink placeholder:text-mist/50 focus:outline-none focus:border-pink/40 transition"
                    aria-label="Search menu" autoComplete="off" />
                </div>
                <button type="button" onClick={() => { setCartTab("cart"); setCartOpen(true); }}
                  className={`relative shrink-0 glass-strong rounded-2xl min-h-[44px] min-w-[44px] px-3 flex items-center justify-center border border-pink/25 hover:border-pink/50 transition ${badgePulse ? "animate-bounce-soft" : ""}`}
                  aria-label={itemCount ? `Cart, ${itemCount} items` : "Open cart"}>
                  <Icon name="shopping-bag" size={20} className="text-pink" />
                  {itemCount > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-pink text-white text-[10px] font-bold flex items-center justify-center">{itemCount}</span>
                  )}
                </button>
              </div>
            </div>
          </div>
          <div className="max-w-6xl mx-auto px-4 pt-3 pb-1">
            <div className="flex gap-2 overflow-x-auto pb-1" role="tablist" aria-label="Menu categories">
              {CATEGORIES.map(cat => (
                <button key={cat} role="tab" aria-selected={filter === cat} onClick={() => setFilter(cat)}
                  className={`px-5 min-h-[44px] rounded-full text-[15px] font-medium whitespace-nowrap transition-colors duration-200 ${
                    filter === cat ? "bg-pink text-white" : "text-mist hover:text-ink hover:bg-white"
                  }`}>{cat}</button>
              ))}
            </div>
          </div>

          <main className="max-w-6xl mx-auto px-4 py-8">
            <div className="flex items-center justify-between mb-4">
              <p className="text-sm text-mist">{filtered.length} item{filtered.length !== 1 ? "s" : ""}</p>
              {(search || filter !== "All") && (
                <button onClick={() => { setSearch(""); setFilter("All"); }} className="text-xs text-pink hover:underline">Clear filters</button>
              )}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 items-stretch" key={filter}>
              {filtered.map((dish, i) => (
                <MenuCard key={dish.id} dish={dish} onAdd={handleAdd} onPair={setPairingDish} sessionItems={sessionItems} index={i} />
              ))}
            </div>
            {filtered.length === 0 && (
              <div className="text-center py-20">
                <Icon name="search" size={36} className="text-mist/40 mx-auto mb-3" />
                <p className="text-mist">No items match your filters.</p>
                <button onClick={() => { setSearch(""); setFilter("All"); }} className="mt-3 text-pink text-sm hover:underline">Reset all filters</button>
              </div>
            )}
          </main>
          <CartDrawer open={cartOpen} onClose={() => { setCartOpen(false); setCartTab("cart"); }} items={sessionItems} setItems={setSessionItems}
            orderHistory={orderHistory} cartTab={cartTab} setCartTab={setCartTab}
            onOrderPlaced={(items, tableLabel, res) => pushHistory(items, tableLabel, {
              orderedBy: (res && res.orderedBy) || (guest && guest.name) || null,
              roundId: res && res.roundId,
              status: "new",
            })}
            onPlaySnake={() => { setCartOpen(false); setCartTab("cart"); setShowSnake(true); }}
            onOrderCelebrate={() => { setOrderBurst(true); }}
            onPlaceOrder={(items, tableLabel, disc) => {
              const tkey = String(tableLabel || "").replace(/^0+/, "") || String(tableLabel);
              let saved = null;
              if (guest && guest.exp && Date.now() < guest.exp && String(guest.table || "") === String(tkey)) {
                saved = guest;
              } else {
                saved = loadDiningGuest(tkey);
              }
              if (saved && saved.phone && saved.exp && Date.now() < saved.exp && String(saved.table || "") === String(tkey)) {
                if (!guest || String(guest.table) !== String(tkey)) setGuest(saved);
                return Promise.resolve(onPlaceOrder(items, tkey, saved, disc)).then(res => {
                  if (res && res.joinCode) {
                    setShownTableOtp(res.joinCode);
                    try { localStorage.setItem("bloom_table_otp_" + tkey, res.joinCode); } catch (e) {}
                  }
                  return res;
                });
              }
              pendingPlace.current = { items, tableLabel: tkey, disc };
              setNeedJoinOtp(false);
              setGateJoinCode("");
              setGateError("");
              setShowGuestGate(true);
              return false;
            }} showToast={showToast}
            tableNumber={tableNumber} setTableNumber={setTableNumber} tableFromQr={tableFromQr} />

          <OrderBurst active={orderBurst} onDone={() => setOrderBurst(false)} />
          {(() => {
            const tk = String(tableFromQr || "").replace(/^0+/, "") || String(tableFromQr || "");
            const otp = shownTableOtp || (typeof localStorage !== "undefined" && tk ? localStorage.getItem("bloom_table_otp_" + tk) : "") || "";
            if (!otp || !tk) return null;
            return (
              <div className="mx-4 mb-3 rounded-2xl border border-pink/25 bg-white px-4 py-3 flex items-center justify-between gap-3 shadow-sm">
                <div>
                  <p className="text-[10px] uppercase tracking-wider text-mist">Share with friends at this table</p>
                  <p className="font-display text-xl text-ink">Table OTP <span className="text-pink">{otp}</span></p>
                </div>
                <button type="button" className="text-xs font-semibold px-3 py-2 rounded-xl bg-pink text-white"
                  onClick={() => {
                    try {
                      navigator.clipboard.writeText(otp);
                      showToast("OTP copied");
                    } catch (e) {
                      showToast("OTP: " + otp);
                    }
                  }}>Copy</button>
              </div>
            );
          })()}
          <SnakeGame
            open={showSnake}
            onClose={() => setShowSnake(false)}
            snakeDiscount={snakeDiscount}
            showToast={showToast}
            onRewardUnlocked={() => {}}
          />

          {showGuestGate && (
            <div className="fixed inset-0 z-[170] flex items-end sm:items-center justify-center p-4 bg-ink/50 backdrop-blur-sm" role="dialog" aria-modal="true">
              <div className="glass-strong rounded-2xl max-w-md w-full p-6 shadow-float border border-pink/20 animate-scale-in iphone-modal">
                <h3 className="font-display text-2xl text-ink mb-1">Login to order</h3>
                <p className="text-mist text-sm mb-4">
                  {needJoinOtp
                    ? "This table is already in use. If you are with them, enter the table OTP to join and order."
                    : "Enter your name and mobile to start ordering on this table."}
                </p>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs uppercase tracking-wider text-mist">Your name *</label>
                    <input value={gateName} onChange={e => setGateName(e.target.value)}
                      className="mt-1 w-full min-h-[44px] bg-white border border-pink/20 rounded-xl px-4 text-ink text-sm focus:outline-none focus:border-pink" placeholder="Full name" autoComplete="name" />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wider text-mist">Mobile number *</label>
                    <input type="tel" value={gatePhone} onChange={e => setGatePhone(e.target.value)}
                      className="mt-1 w-full min-h-[44px] bg-white border border-pink/20 rounded-xl px-4 text-ink text-sm focus:outline-none focus:border-pink" placeholder="10-digit mobile" autoComplete="tel" />
                  </div>
                  {needJoinOtp && (
                  <div>
                    <label className="text-xs uppercase tracking-wider text-mist">Table OTP *</label>
                    <input type="tel" inputMode="numeric" maxLength={4} value={gateJoinCode} onChange={e => setGateJoinCode(e.target.value.replace(/\D/g, "").slice(0, 4))}
                      className="mt-1 w-full min-h-[44px] bg-white border border-pink/20 rounded-xl px-4 text-ink text-sm focus:outline-none focus:border-pink" placeholder="Table OTP" autoFocus />
                    <p className="text-mist text-xs mt-1">Ask the first guest for the code, or ask staff to free the table.</p>
                  </div>
                  )}
                  {gateError && <p className="text-sm text-mist">{gateError}</p>}
                  <button type="button" disabled={loginBusy} onClick={async () => {
                    if (!gateName.trim() || gatePhone.replace(/\D/g, "").length < 10) {
                      showToast("Enter name and valid mobile");
                      return;
                    }
                    if (needJoinOtp && gateJoinCode.replace(/\D/g, "").length < 4) {
                      setGateError("Enter the 4-digit table OTP");
                      return;
                    }
                    const tKey = String(tableFromQr || (pendingPlace.current && pendingPlace.current.tableLabel) || "").replace(/^0+/, "") || "any";
                    if (tKey && tKey !== "any" && !isRegisteredTable(tKey, tablePins)) {
                      setGateError("Invalid table. Scan the official QR on your table — do not change the link.");
                      return;
                    }
                    const g = { name: gateName.trim(), phone: normalizePhoneIN(gatePhone), method: "claim" };
                    setLoginBusy(true);
                    setGateError("");
                    try {
                      let claimInfo = null;
                      if (tKey && tKey !== "any" && sb) {
                        claimInfo = await cloudAssertTableClaim(tKey, g, needJoinOtp ? gateJoinCode : "");
                      }
                      let jcFinal = (claimInfo && claimInfo.joinCode) || (needJoinOtp ? gateJoinCode : "") || "";
                      // Ensure session + join code exist when first claim
                      if (tKey && tKey !== "any" && sb) {
                        const open = await cloudGetOpenSession(tKey);
                        if (!open) {
                          jcFinal = makeJoinCode();
                          await sb.from("bloom_table_sessions").insert({
                            table_no: tKey,
                            guest_name: g.name,
                            guest_phone: g.phone,
                            join_code: jcFinal,
                            status: "open",
                          });
                        } else {
                          jcFinal = open.join_code || jcFinal;
                          if (!open.join_code && claimInfo && (claimInfo.mine || claimInfo.takeover || !claimInfo.joined)) {
                            jcFinal = makeJoinCode();
                            await sb.from("bloom_table_sessions").update({ join_code: jcFinal, guest_name: g.name, guest_phone: g.phone }).eq("id", open.id);
                          }
                        }
                      }
                      if (jcFinal) {
                        setShownTableOtp(jcFinal);
                        try { localStorage.setItem("bloom_table_otp_" + tKey, jcFinal); } catch (e) {}
                      }
                      g.joinCode = jcFinal || "";
                      g.tableOtp = jcFinal || "";
                      const payload = saveDiningGuest(g, tKey);
                      setGuest(payload);
                      setShowGuestGate(false);
                      if (pendingPlace.current) {
                        const { items, tableLabel, disc } = pendingPlace.current;
                        pendingPlace.current = null;
                        const res = await Promise.resolve(onPlaceOrder(items, tableLabel, payload, disc));
                        if (res && res.joinCode) {
                          setShownTableOtp(res.joinCode);
                          try { localStorage.setItem("bloom_table_otp_" + tableLabel, res.joinCode); } catch (e) {}
                        }
                        pushHistory(items, tableLabel, { roundId: res && res.roundId, status: "new", orderedBy: (res && res.orderedBy) || (payload && payload.name) || null });
                        setSessionItems([]);
                        setCartOpen(false);
                        setCartTab("history");
                        setOrderBurst(true);
                        showToast("Order sent to Table " + tableLabel);
                      } else {
                        const otpShow = (typeof localStorage !== "undefined" && localStorage.getItem("bloom_table_otp_" + tKey)) || "";
                        showToast(otpShow ? ("Logged in. Share table OTP " + otpShow + " with friends") : "Logged in. You can order on this table.");
                      }
                    } catch (e) {
                      const msg = (e && e.message) || "Could not claim table";
                      if (/BAD_OTP/i.test(msg)) {
                        setNeedJoinOtp(true);
                        setGateError("That code does not match. Try again or ask the first guest.");
                      } else if (/TABLE_IN_USE|already claimed|already in use|table OTP/i.test(msg)) {
                        setNeedJoinOtp(true);
                        setGateError("");
                      } else {
                        setGateError(msg);
                        showToast(msg);
                      }
                    } finally {
                      setLoginBusy(false);
                    }
                  }} className="w-full py-3 rounded-xl bg-pink text-white font-semibold text-sm disabled:opacity-60">
                    {loginBusy ? "Checking table…" : (needJoinOtp ? "Join table & order" : "Continue & order")}
                  </button>
                  <button type="button" onClick={() => { setShowGuestGate(false); pendingPlace.current = null; setNeedJoinOtp(false); setGateJoinCode(""); setGateError(""); }} className="w-full py-2 text-mist text-sm">Cancel</button>
                </div>
              </div>
            </div>
          )}
          {pairingDish && <PairingModal dish={pairingDish} dishes={dishes} onClose={() => setPairingDish(null)} onAdd={handleAdd} />}
          {variantDish && <VariantPicker dish={variantDish} onPick={handleVariantPick} onClose={() => setVariantDish(null)} />}

          <footer className="border-t border-pink/10 mt-16 py-10 px-4">
            <div className="max-w-6xl mx-auto text-center sm:text-left">

              tooltip: { backgroundColor: "#FFFFFF", titleColor: "#1F2937", bodyColor: "#C2185B", borderColor: "rgba(194,24,91,0.3)", borderWidth: 1 },

            scales: {

    const InsightPieChart = ({ labels, values }) => {
      const canvasRef = useRef(null);

            labels: labels || [],

              backgroundColor: (labels || []).map((_, i) => colors[i % colors.length]),
              borderWidth: 0,

          },

    const ORDER_FLOW = [
      { key: "new", label: "Pending confirm", guestLabel: "Sent", next: "accepted", nextLabel: "Confirm order" },
      { key: "accepted", label: "Confirmed", guestLabel: "Confirmed", next: "cooking", nextLabel: "Start prep" },
      { key: "cooking", label: "In prep", guestLabel: "Preparing", next: "ready", nextLabel: "Mark ready" },
      { key: "ready", label: "Ready", guestLabel: "Ready for you", next: "delivered", nextLabel: "Mark served" },
      { key: "delivered", label: "Served", guestLabel: "Served", next: null, nextLabel: null },
    ];
    const statusMeta = (s) => ORDER_FLOW.find(x => x.key === s) || ORDER_FLOW[0];
    const statusColor = (s) => ({
      new: "bg-amber-100 text-amber-700 border-amber-300",
      accepted: "bg-sky-100 text-sky-700 border-sky-300",
      cooking: "bg-orange-100 text-orange-700 border-orange-300",
      ready: "bg-emerald-100 text-emerald-700 border-emerald-300",
      delivered: "bg-pink-soft text-pink-deep border-pink/40",
    }[s] || "bg-blush text-mist");

    function maskPhone(p) {
      const d = String(p || "").replace(/\D/g, "");
      if (d.length < 4) return d || "";
      return "••••" + d.slice(-4);
    }

    function playStaffChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.value = 0.08;
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        o.stop(ctx.currentTime + 0.4);
        setTimeout(() => ctx.close(), 500);
      } catch {}
    }

    const OwnerView = ({ dishes, setDishes, recommendations, setRecommendations, liveOrders = [], updateRoundStatus, clearTable, cancelRound, tablePins = {}, setTablePins, onLogout, showToast, onReset, onRefreshOrders, snakeDiscount, setSnakeDiscount }) => {
      const [editingDish, setEditingDish] = useState(null);

      useEffect(() => {
        const n = (liveOrders || []).reduce(
          (s, sess) => s + (sess.rounds || []).filter(r => r.status === "new").length,
          0

        if (prevNewRoundsRef.current !== null && n > prevNewRoundsRef.current) {
          playStaffChime();
          try {
            if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(80);
          } catch {}
        }
        prevNewRoundsRef.current = n;
      }, [liveOrders]);
      const [mgrUnlocked, setMgrUnlocked] = useState(() => {
        try { return sessionStorage.getItem("bloom_mgr") === "1"; } catch { return false; }
      });
      const [mgrPin, setMgrPin] = useState("");
      const [mgrError, setMgrError] = useState(false);
      const [insightPeriod, setInsightPeriod] = useState("day");
      const [insights, setInsights] = useState(null);
      const [insightsLoading, setInsightsLoading] = useState(false);
      const [insightsError, setInsightsError] = useState("");
      const dishesRef = useRef(dishes);
      dishesRef.current = dishes;
      const insightsLoadingRef = useRef(false);

      // Manual / period / tab only — NOT on every menu sync (that was flickering charts every second)
      const loadInsights = useCallback(async (period) => {
        if (insightsLoadingRef.current) return;
        const p = period || insightPeriod;
        insightsLoadingRef.current = true;
        setInsightsLoading(true);
        setInsightsError("");
        try {
          const data = await cloudFetchInsights(p);
          const catMap = {};
          const dishById = Object.fromEntries((dishesRef.current || []).map(d => [d.id, d]));
          (data.rawRounds || []).filter(r => r.status && r.status !== "new").forEach(r => {
            (r.items || []).forEach(it => {
              const dish = dishById[it.id];
              const cat = (dish && dish.category) || "Other";
              const qty = it.qty || 1;
              catMap[cat] = (catMap[cat] || 0) + qty;
            });
          });
          const categoryEntries = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
          setInsights({
            ...data,
            categoryLabels: categoryEntries.map(e => e[0]),
            categoryValues: categoryEntries.map(e => e[1]),
          });
        } catch (e) {
          console.error(e);
          setInsightsError(e.message || "Failed to load insights");
        }
        insightsLoadingRef.current = false;
        setInsightsLoading(false);
      }, [insightPeriod]);

      useEffect(() => {

        setRecommendations(prev => {
          const next = prev.map(r => r.id === rec.id ? { ...r, status: action } : r);
          saveState("bloom_recs", next);
          return next;

        if (action === "applied") {
          setDishes(prev => {
            let next = [...prev];
            if (rec.type === "positioning" && rec.dishId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, tags: d.tags.includes("Most Ordered") ? d.tags : [...d.tags, "Most Ordered"], sortOrder: 1 } : d);
            }
            if (rec.type === "pairing" && rec.dishId && rec.targetId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, pairWith: d.pairWith.includes(rec.targetId) ? d.pairWith : [...d.pairWith, rec.targetId] } : d);
            }
            if (rec.type === "timing" && rec.dishId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, tags: d.tags.includes("Peak Feature") ? d.tags : [...d.tags, "Peak Feature"], sortOrder: 1 } : d);

            saveState("bloom_dishes", next);
            return next;

      const saveDish = (updated) => {
        if (updated.id === null) {
          setDishes(prev => {
            const newId = Math.max(0, ...prev.map(d => d.id)) + 1;
            const dish = {
              ...updated,
              id: newId,
              tags: updated.tags || [],
              diet: updated.diet || [],
              margin: updated.margin ?? 50,
              ordersToday: 0,
              visible: true,
              imageVisible: updated.imageVisible === true,
              pairWith: [],
              sortOrder: 99,

            const next = [...prev, dish];
            saveState("bloom_dishes", next);
            return next;

          showToast(`"${updated.name}" added to menu`);

          setDishes(prev => {

            return next;

      return (

              <button onClick={onLogout} className="flex items-center gap-1.5 text-mist hover:text-ink text-sm transition">
                <Icon name="log-out" size={14} /> Logout
              </button>
            </div>
          </div>

          <header className="border-b border-pink/10 px-4 py-6">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h1 className="font-display text-3xl text-ink">Staff Portal</h1>
                <p className="text-mist text-sm mt-1">Live tables and menu control</p>
              </div>
              <div className="flex items-center gap-3 text-sm text-mist">
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" /> Live</span>
                <span>·</span>
                <span>{new Date().toLocaleDateString("en-IN", { weekday: "long", month: "short", day: "numeric" })}</span>

      try {
        const q = new URLSearchParams(window.location.search);
        const t = q.get("table") || q.get("t") || "";
        return (t || "").trim();
      } catch { return ""; }
    }
    function getPinFromUrl() {
      try {
        const q = new URLSearchParams(window.location.search);
        return (q.get("pin") || q.get("code") || "").trim();
      } catch { return ""; }
    }

    function App() {
      const [view, setView] = useState(() => {
        try {
          if (IS_APEX) return sessionStorage.getItem("bloom_staff") === "1" && !staffSessionExpired() ? "owner" : "apex-gate";
          return sessionStorage.getItem("bloom_staff") === "1" && !staffSessionExpired() ? "owner" : "customer";
        } catch { return IS_APEX ? "apex-gate" : "customer"; }
      });
      const [staffAuth, setStaffAuth] = useState(() => {
        try {
          if (sessionStorage.getItem("bloom_staff") !== "1") return false;
          if (staffSessionExpired()) {
            sessionStorage.removeItem("bloom_staff");
            sessionStorage.removeItem("bloom_mgr");
            return false;
          }
          touchStaffActivity();
          return true;
        } catch { return false; }
      });
      const [showPin, setShowPin] = useState(() => IS_APEX && !(typeof sessionStorage !== "undefined" && sessionStorage.getItem("bloom_staff") === "1" && !staffSessionExpired()));
      const [dishes, setDishes] = useState(() => {
        const loaded = loadState("bloom_dishes", null);
        if (!loaded) return mergeMenuList(INITIAL_DISHES);
        const wiped = sessionStorage.getItem("bloom_stats_wiped");
        if (!wiped) {
          try { sessionStorage.setItem("bloom_stats_wiped", "1"); } catch {}
          return mergeMenuList(loaded.map(d => ({ ...d, ordersToday: 0 })));
        }
        return mergeMenuList(loaded);
      });
      const [recommendations, setRecommendations] = useState(() => loadState("bloom_recs", AI_RECOMMENDATIONS));
      const [sessionItems, setSessionItems] = useState([]);
      const [liveOrders, setLiveOrders] = useState([]);
      const [tablePins, setTablePins] = useState(() => ({ ...DEFAULT_TABLE_PINS }));
      // Load pins for guest table validation (tables beyond 1–12)
      React.useEffect(() => {
        if (!sb) return;
        cloudFetchPins().then(p => { if (p) setTablePins(p); }).catch(() => {});
      }, []);
      const [snakeDiscount, setSnakeDiscount] = useState(() => loadSnakeDiscountSettings());
      const [toast, setToast] = useState(null);
      const [tableFromQr] = useState(() => getTableFromUrl());
      const [pinFromQr] = useState(() => getPinFromUrl());
      const menuCloudReady = useRef(false);
      const applyingRemoteMenu = useRef(false);

      useEffect(() => { saveState("bloom_dishes", dishes); }, [dishes]);
      useEffect(() => { saveState("bloom_recs", recommendations); }, [recommendations]);

      // Push menu edits (photo on/off, uploads, prices) to Supabase for all devices
      useEffect(() => {
        if (!menuCloudReady.current || applyingRemoteMenu.current) return;
        scheduleCloudSaveMenu(dishes);
      }, [dishes]);

      const showToast = useCallback((msg) => setToast(msg), []);

      const applyRemoteMenu = useCallback((list, remoteUpdatedAt) => {
        if (!Array.isArray(list) || !list.length) return;
        // Don't clobber a toggle the user just made with an older cloud snapshot
        if (remoteUpdatedAt) {
          const remoteMs = new Date(remoteUpdatedAt).getTime();
          if (Number.isFinite(remoteMs) && remoteMs < _lastLocalMenuWriteAt - 50) {
            return;
          }
        } else if (Date.now() - _lastLocalMenuWriteAt < 2000) {
          return;
        }
        applyingRemoteMenu.current = true;
        setDishes(mergeMenuList(list));
        queueMicrotask(() => { applyingRemoteMenu.current = false; });
      }, []);

      const refreshOrders = useCallback(async () => {
        try {
          if (!sb) {
            showToast("Cloud not connected. Check Supabase script.");
            return;
          }
          const next = await cloudFetchLiveOrders();
          setLiveOrders(next || []);
          showToast("Orders refreshed");
        } catch (e) {
          console.error(e);
          showToast("Refresh failed: " + (e.message || "error"));
        }
      }, [showToast]);

      useEffect(() => {
        let channel;
        (async () => {
          try {
            if (!sb) {
              setTablePins({ ...DEFAULT_TABLE_PINS });
              return;
            }
            const pins = await cloudFetchPins();
            if (pins) setTablePins(pins);
            const orders = await cloudFetchLiveOrders();
            setLiveOrders(orders || []);

            // Load shared menu (photos / visibility) from cloud
            try {
              const remote = await cloudFetchMenu();
              if (remote && remote.dishes && remote.dishes.length) {
                applyRemoteMenu(remote.dishes, remote.updatedAt);
              } else {
                // First time: seed cloud from current local menu
                await cloudSaveMenu(dishes);
              }
              if (remote && remote.snakeDiscount) {
                const s = saveSnakeDiscountSettings(remote.snakeDiscount);
                setSnakeDiscount(s);
              }
            } catch (menuErr) {
              console.error("menu load", menuErr);
            }
            menuCloudReady.current = true;

            channel = sb.channel("bloom-live")
              .on("postgres_changes", { event: "*", schema: "public", table: "bloom_order_rounds" }, async () => {
                try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch (e) { console.error(e); }
              })
              .on("postgres_changes", { event: "*", schema: "public", table: "bloom_table_sessions" }, async () => {
                try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch (e) { console.error(e); }
              })
              .on("postgres_changes", { event: "*", schema: "public", table: "bloom_menu" }, async () => {
                try {
                  const remote = await cloudFetchMenu();
                  if (remote && remote.dishes) applyRemoteMenu(remote.dishes, remote.updatedAt);
                  if (remote && remote.snakeDiscount) {
                    const s = saveSnakeDiscountSettings(remote.snakeDiscount);
                    setSnakeDiscount(s);
                  }
                } catch (e) { console.error(e); }
              })
              .subscribe();
          } catch (e) {
            console.error(e);
            setTablePins({ ...DEFAULT_TABLE_PINS });
            menuCloudReady.current = true;
          }
        })();
        return () => { if (channel && sb) sb.removeChannel(channel); };
      }, [showToast, applyRemoteMenu]);

      const placeOrder = useCallback(async (items, tableLabel, guest, discount) => {
        try {
          const res = await cloudPlaceOrder(items, tableLabel, guest, discount || null);
          // Refresh staff board in background — don't make the guest wait
          cloudFetchLiveOrders().then(next => setLiveOrders(next || [])).catch(() => {});
          return res;
        } catch (e) {
          console.error(e);
          showToast("Order failed: " + (e.message || "cloud error"));
          throw e;
        }
      }, [showToast]);

      const updateRoundStatus = useCallback(async (tableKey, roundId, status) => {
        setLiveOrders(prev => prev.map(session => {
          if (String(session.table) !== String(tableKey)) return session;
          return {
            ...session,
            rounds: (session.rounds || []).map(r =>
              String(r.id) === String(roundId) ? { ...r, status, updatedAt: new Date().toISOString() } : r
            ),
          };
        }));
        try {
          await cloudUpdateRoundStatus(roundId, status);
          if (status === "accepted") {
            const session = liveOrders.find(s => String(s.table) === String(tableKey));
            const round = session?.rounds?.find(r => String(r.id) === String(roundId));
            const confirmedItems = round?.items || [];
            if (confirmedItems.length) {
              setDishes(ds => {
                const dnext = ds.map(d => {
                  const ordered = confirmedItems.find(i => i.id === d.id);
                  if (!ordered) return d;
                  return { ...d, ordersToday: (d.ordersToday || 0) + (ordered.qty || 1) };
                });
                saveState("bloom_dishes", dnext);
                return dnext;
              });
            }
          }
        } catch (e) {
          console.error(e);
          showToast("Status update failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [showToast, liveOrders]);

      const clearTable = useCallback(async (tableKey) => {
        const session = liveOrders.find(s => String(s.table) === String(tableKey));
        setLiveOrders(prev => prev.filter(s => String(s.table) !== String(tableKey)));
        saveSnakeReward(null); // entire-order reward ends when bill is paid
        try {
          await cloudClearTable(session?.sessionId, tableKey);
        } catch (e) {
          console.error(e);
          showToast("Clear failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [liveOrders, showToast]);

      const cancelRound = useCallback(async (tableKey, roundId) => {
        setLiveOrders(prev => prev.map(session => {
          if (String(session.table) !== String(tableKey)) return session;
          return { ...session, rounds: (session.rounds || []).filter(r => String(r.id) !== String(roundId)) };
        }).filter(s => (s.rounds || []).length > 0));
        try {
          await cloudCancelRound(roundId);
        } catch (e) {
          console.error(e);
          showToast("Cancel failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [showToast]);

      const handleStaffAccess = () => {
        if (staffAuth) setView("owner");
        else setShowPin(true);
      };
      const handlePinSuccess = () => {
        setStaffAuth(true);
        touchStaffActivity();
        try { sessionStorage.setItem("bloom_staff", "1"); } catch {}
        setShowPin(false);
        setView("owner");
        showToast("Staff access granted");
      };
      const handleLogout = () => {
        setStaffAuth(false);
        try {
          sessionStorage.removeItem("bloom_staff");
          sessionStorage.removeItem("bloom_mgr");
          sessionStorage.removeItem(STAFF_ACTIVITY_KEY);
        } catch {}
        if (IS_APEX) {
          setView("apex-gate");
          setShowPin(true);
          showToast("Logged out");
        } else {
          setView("customer");
          showToast("Logged out of Staff Mode");
        }
      };

      // Idle timeout for staff session
      useEffect(() => {
        if (!staffAuth) return;
        touchStaffActivity();
        const onAct = () => touchStaffActivity();
        const events = ["pointerdown", "keydown", "touchstart", "scroll"];
        events.forEach(ev => window.addEventListener(ev, onAct, { passive: true }));
        const id = setInterval(() => {
          if (staffSessionExpired()) {
            setStaffAuth(false);
            try {
              sessionStorage.removeItem("bloom_staff");
              sessionStorage.removeItem("bloom_mgr");
            } catch {}
            if (IS_APEX) {
              setView("apex-gate");
              setShowPin(true);
            } else {
              setView("customer");
            }
            showToast("Staff session timed out (20 min idle)");
          }
        }, 15000);
        return () => {
          events.forEach(ev => window.removeEventListener(ev, onAct));
          clearInterval(id);
        };
      }, [staffAuth, showToast]);

      return (
        <div className="min-h-screen bg-blush">
          {!IS_APEX && <BloomPetals />}
          {IS_APEX ? (
            staffAuth && view === "owner" ? (
              <OwnerView dishes={dishes} setDishes={setDishes} recommendations={recommendations} setRecommendations={setRecommendations}
                liveOrders={liveOrders} updateRoundStatus={updateRoundStatus} clearTable={clearTable} cancelRound={cancelRound}
                tablePins={tablePins} setTablePins={setTablePins}
                snakeDiscount={snakeDiscount} setSnakeDiscount={setSnakeDiscount}
                onLogout={handleLogout} showToast={showToast} onRefreshOrders={refreshOrders} />
            ) : (
              <div className="min-h-screen flex flex-col items-center justify-center p-6">
                <h1 className="font-display text-3xl text-ink mb-2">Bloom Apex</h1>
                <p className="text-mist text-sm mb-6">Staff portal · enter PIN to continue</p>
              </div>
            )
          ) : (
            (view === "customer" || !staffAuth) ? (
              <CustomerView dishes={dishes} sessionItems={sessionItems} setSessionItems={setSessionItems} showToast={showToast} onStaffAccess={handleStaffAccess} onPlaceOrder={placeOrder} tableFromQr={tableFromQr} pinFromQr={pinFromQr} tablePins={tablePins} snakeDiscount={snakeDiscount} />
            ) : (
              <OwnerView dishes={dishes} setDishes={setDishes} recommendations={recommendations} setRecommendations={setRecommendations}
                liveOrders={liveOrders} updateRoundStatus={updateRoundStatus} clearTable={clearTable} cancelRound={cancelRound}
                tablePins={tablePins} setTablePins={setTablePins}
                snakeDiscount={snakeDiscount} setSnakeDiscount={setSnakeDiscount}
                onLogout={handleLogout} showToast={showToast} onRefreshOrders={refreshOrders} />
            )
          )}
          {showPin && (
            <PinModal
              onSuccess={handlePinSuccess}
              onClose={IS_APEX ? undefined : () => setShowPin(false)}
              forced={IS_APEX}
            />
          )}
          {toast && <Toast message={toast} onDone={() => setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
