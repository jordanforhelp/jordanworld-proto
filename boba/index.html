      const bySession = {};
      (rounds || []).forEach(r => {

        bySession[r.session_id].push({
          id: r.id,
          status: r.status || "new",
          items: r.items || [],
          total: Number(r.total) || 0,
          createdAt: r.created_at,
          updatedAt: r.updated_at,
        });
      });
      return (sessions || [])
        .filter(s => s.status === "open" || !s.status)

          guestName: s.guest_name || "",

    function periodBounds(period) {
      const now = new Date();
      if (period === "all") return { from: null, to: null };
      if (period === "month") {
        const from = new Date(now.getFullYear(), now.getMonth(), 1);
        return { from: from.toISOString(), to: null };
      }
      const from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const to = new Date(from);
      to.setDate(to.getDate() + 1);
      return { from: from.toISOString(), to: to.toISOString() };
    }

        byTable[tno].rounds += 1;
        byTable[tno].bill += Number(r.total) || 0;
        (r.items || []).forEach(it => {
          const name = it.name || "Item";
          byDish[name] = (byDish[name] || 0) + (it.qty || 1);
        });
      });
      const tables = Object.values(byTable);
      const avgBill = tables.length ? Math.round(tables.reduce((s, x) => s + x.bill, 0) / tables.length) : 0;
      const topDishes = Object.entries(byDish).sort((a, b) => b[1] - a[1]).slice(0, 8);
      return {
        period: period || "day",
        pending: list.filter(r => r.status === "new").length,
        confirmedRounds: confirmed.length,
        totalRounds: list.length,
        revenue,
        avgBill,
        tablesActive: tables.length,
        tables,
        topDishes,
        rawRounds: list,
      };
    }

    async function cloudPlaceOrder(items, tableLabel, guest) {
      if (!sb) throw new Error("Supabase not loaded");
      const tableKey = String(tableLabel).trim().replace(/^0+/, "") || String(tableLabel).trim();
      const payloadItems = items.map(i => ({
        id: i.id,
        name: i.name,
        variantLabel: i.variantLabel || null,
        price: i.price,
        qty: i.qty,
      }));
      const total = items.reduce((s, i) => s + i.price * i.qty, 0);

      let { data: existing, error: e0 } = await sb
        .from("bloom_table_sessions")
        .select("*")
        .eq("table_no", tableKey)
        .eq("status", "open")
        .order("created_at", { ascending: false })
        .limit(1);
      if (e0) throw e0;

      let sessionId;
      if (existing && existing.length) {
        sessionId = existing[0].id;
        const patch = {};
        if (guest?.name) patch.guest_name = guest.name;
        if (guest?.phone) patch.guest_phone = guest.phone;
        if (Object.keys(patch).length) {
          await sb.from("bloom_table_sessions").update(patch).eq("id", sessionId);
        }
      } else {
        const { data: created, error: e1 } = await sb
          .from("bloom_table_sessions")
          .insert({
            table_no: tableKey,
            guest_name: guest?.name || null,
            guest_phone: guest?.phone || null,
            status: "open",
          })
          .select()
          .single();
        if (e1) throw e1;
        sessionId = created.id;
      }

      const { error: e2 } = await sb.from("bloom_order_rounds").insert({
        session_id: sessionId,
        status: "new",
        items: payloadItems,
        total,
      });
      if (e2) throw e2;
      return tableKey;
    }

    // Mini Snake — play from order History while you wait
    const SnakeGame = ({ open, onClose }) => {
      const canvasRef = useRef(null);
      const [score, setScore] = useState(0);
      const [high, setHigh] = useState(() => {
        try { return parseInt(localStorage.getItem("bloom_snake_high") || "0", 10) || 0; } catch { return 0; }
      });
      const [running, setRunning] = useState(false);
      const [gameOver, setGameOver] = useState(false);
      const [started, setStarted] = useState(false);
      const stateRef = useRef(null);
      const drawRef = useRef(null);
      const runningRef = useRef(false);
      const touchRef = useRef({ x: 0, y: 0 });

      const COLS = 18;
      const ROWS = 18;
      const CELL = 22;
      const W = COLS * CELL;
      const H = ROWS * CELL;

      const resetState = () => {
        const mid = Math.floor(COLS / 2);
        const snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
        const dir = { x: 1, y: 0 };
        const placeFood = (body) => {
          let f;
          do {
            f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
          } while (body.some(s => s.x === f.x && s.y === f.y));
          return f;
        };
        return { snake, dir, nextDir: { ...dir }, food: placeFood(snake), score: 0, alive: true };
      };

      const setupCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return null;
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        return ctx;
      };

      const drawFrame = (ctx, st) => {
        if (!ctx || !st) return;
        // soft board
        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, "#FFF8FA");
        bg.addColorStop(1, "#FCE4EC");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(194,24,91,0.07)";
        ctx.lineWidth = 1;
        for (let i = 0; i <= COLS; i++) {
          ctx.beginPath(); ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, H); ctx.stroke();
        }
        for (let j = 0; j <= ROWS; j++) {
          ctx.beginPath(); ctx.moveTo(0, j * CELL + 0.5); ctx.lineTo(W, j * CELL + 0.5); ctx.stroke();
        }
        // pearl (food) with depth
        const fx = st.food.x * CELL + CELL / 2;
        const fy = st.food.y * CELL + CELL / 2;
        const pr = CELL * 0.36;
        ctx.beginPath();
        ctx.arc(fx + 1, fy + 2, pr, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(173,20,87,0.2)";
        ctx.fill();
        const pearl = ctx.createRadialGradient(fx - pr * 0.3, fy - pr * 0.35, pr * 0.1, fx, fy, pr);
        pearl.addColorStop(0, "#F48FB1");
        pearl.addColorStop(0.45, "#C2185B");
        pearl.addColorStop(1, "#880E4F");
        ctx.beginPath();
        ctx.arc(fx, fy, pr, 0, Math.PI * 2);
        ctx.fillStyle = pearl;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(fx - pr * 0.28, fy - pr * 0.3, pr * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.fill();
        // snake body — rounded capsules between segments
        for (let i = st.snake.length - 1; i >= 0; i--) {
          const s = st.snake[i];
          const cx = s.x * CELL + CELL / 2;
          const cy = s.y * CELL + CELL / 2;
          const r = i === 0 ? CELL * 0.42 : CELL * 0.36;
          if (i < st.snake.length - 1) {
            const n = st.snake[i + 1];
            const nx = n.x * CELL + CELL / 2;
            const ny = n.y * CELL + CELL / 2;
            ctx.strokeStyle = i === 0 ? "#AD1457" : "#C2185B";
            ctx.lineWidth = r * 1.7;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(nx, ny);
            ctx.stroke();
          }
          const grad = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.1, cx, cy, r);
          if (i === 0) {
            grad.addColorStop(0, "#E91E63");
            grad.addColorStop(1, "#880E4F");
          } else {
            grad.addColorStop(0, "#EC407A");
            grad.addColorStop(1, "#AD1457");
          }
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        }
        // eyes on head
        const head = st.snake[0];
        const hx = head.x * CELL + CELL / 2;
        const hy = head.y * CELL + CELL / 2;
        const ox = st.dir.x * 4;
        const oy = st.dir.y * 4;
        const px = -st.dir.y * 4.5;
        const py = st.dir.x * 4.5;
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(hx + ox + px, hy + oy + py, 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx + ox - px, hy + oy - py, 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1A1A1A";
        ctx.beginPath(); ctx.arc(hx + ox + px + st.dir.x, hy + oy + py + st.dir.y, 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx + ox - px + st.dir.x, hy + oy - py + st.dir.y, 1.2, 0, Math.PI * 2); ctx.fill();
      };

      // Init board when modal opens — do NOT reset on pause
      useEffect(() => {
        if (!open) {
          runningRef.current = false;
          setRunning(false);
          setStarted(false);
          setGameOver(false);
          setScore(0);
          stateRef.current = null;
          drawRef.current = null;
          return;
        }
        const ctx = setupCanvas();
        if (!ctx) return;
        if (!stateRef.current) stateRef.current = resetState();
        drawRef.current = (st) => drawFrame(ctx, st);
        drawRef.current(stateRef.current);
      }, [open]);

      // Tick loop — pause only stops the interval, keeps snake where it is
      useEffect(() => {
        runningRef.current = running;
        if (!open || !running) return;
        const id = setInterval(() => {
          const st = stateRef.current;
          if (!st || !st.alive || !runningRef.current) return;
          st.dir = { ...st.nextDir };
          let nx = st.snake[0].x + st.dir.x;
          let ny = st.snake[0].y + st.dir.y;
          if (nx < 0) nx = COLS - 1;
          else if (nx >= COLS) nx = 0;
          if (ny < 0) ny = ROWS - 1;
          else if (ny >= ROWS) ny = 0;
          const head = { x: nx, y: ny };
          if (st.snake.some(s => s.x === head.x && s.y === head.y)) {
            st.alive = false;
            setGameOver(true);
            setRunning(false);
            runningRef.current = false;
            setHigh(h => {
              const next = Math.max(h, st.score);
              try { localStorage.setItem("bloom_snake_high", String(next)); } catch {}
              return next;
            });
            if (drawRef.current) drawRef.current(st);
            return;
          }
          st.snake.unshift(head);
          if (head.x === st.food.x && head.y === st.food.y) {
            st.score += 1;
            setScore(st.score);
            let f;
            do {
              f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
            } while (st.snake.some(s => s.x === f.x && s.y === f.y));
            st.food = f;
          } else {
            st.snake.pop();
          }
          if (drawRef.current) drawRef.current(st);
        }, 120);
        return () => clearInterval(id);
      }, [open, running]);

      useEffect(() => {
        if (!open) return;
        const onKey = (e) => {
          const st = stateRef.current;
          if (!st || !st.alive) return;
          const k = e.key;
          let nd = null;
          if (k === "ArrowUp" || k === "w" || k === "W") nd = { x: 0, y: -1 };
          if (k === "ArrowDown" || k === "s" || k === "S") nd = { x: 0, y: 1 };
          if (k === "ArrowLeft" || k === "a" || k === "A") nd = { x: -1, y: 0 };
          if (k === "ArrowRight" || k === "d" || k === "D") nd = { x: 1, y: 0 };
          if (!nd) return;
          e.preventDefault();
          if (nd.x === -st.dir.x && nd.y === -st.dir.y) return;
          st.nextDir = nd;
        };
        window.addEventListener("keydown", onKey, { passive: false });
        return () => window.removeEventListener("keydown", onKey);
      }, [open]);

      const applyDir = (nd) => {
        const st = stateRef.current;
        if (!st || !st.alive) return;
        if (nd.x === -st.dir.x && nd.y === -st.dir.y) return;
        st.nextDir = nd;
      };

      const startGame = () => {
        stateRef.current = resetState();
        setScore(0);
        setGameOver(false);
        setStarted(true);
        setRunning(true);
        if (drawRef.current) drawRef.current(stateRef.current);
      };

      if (!open) return null;
      return (
        <div className="fixed inset-0 z-[180] flex items-end sm:items-center justify-center p-3 sm:p-4 bg-ink/40 backdrop-blur-sm" role="dialog" aria-modal="true" aria-label="Snake">
          <div className="glass-strong rounded-2xl w-full max-w-md p-4 sm:p-5 shadow-float border border-pink/15 animate-scale-in" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <div>
                <h3 className="font-display text-xl text-ink">Boba Snake</h3>
                <p className="text-mist text-xs mt-0.5">Play while your order is being made</p>
              </div>
              <button type="button" onClick={onClose} className="hit-icon text-mist hover:text-ink" aria-label="Close"><Icon name="x" size={22} /></button>
            </div>
            <div className="flex justify-between text-sm mb-3">
              <span className="text-ink">Score <strong className="text-pink tabular-nums">{score}</strong></span>
              <span className="text-mist">Best <strong className="text-ink tabular-nums">{high}</strong></span>
            </div>
            <div
              className="mx-auto rounded-2xl overflow-hidden border border-pink/15 touch-none shadow-sm"
              style={{ width: "min(100%, " + W + "px)" }}
              onTouchStart={(e) => {
                const t = e.touches[0];
                touchRef.current = { x: t.clientX, y: t.clientY };
              }}
              onTouchEnd={(e) => {
                const t = e.changedTouches[0];
                const dx = t.clientX - touchRef.current.x;
                const dy = t.clientY - touchRef.current.y;
                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) applyDir(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
                else applyDir(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });

            >
              <canvas ref={canvasRef} className="block w-full h-auto" style={{ aspectRatio: "1 / 1" }} />

            {gameOver && (

            )}

          setVariantDish(dish);
          return;
        }
        addToSession(dish);
      };

      const handleVariantPick = (variant) => {
        if (!variantDish) return;
        addToSession({

          variantLabel: variant.label,

                <div className="mt-5 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-pink-soft border border-pink/25">

                <div className="mt-5 max-w-sm mx-auto px-3">

          <div className={`sticky top-0 z-40 glass border-y border-pink/10 sticky-search ${headerScrolled ? "scrolled" : ""}`}>
            <div className="max-w-6xl mx-auto px-4 py-3">
              <div className="flex items-center gap-2">
                <div className="relative flex-1 min-w-0">
                  <Icon name="search" size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mist pointer-events-none" aria-hidden="true" />
                  <input type="search" placeholder="Search drinks & snacks…" value={search} onChange={e => setSearch(e.target.value)}
                    className="w-full min-h-[44px] bg-white border border-pink/15 rounded-2xl pl-11 pr-4 text-[15px] leading-5 text-ink placeholder:text-mist/50 focus:outline-none focus:border-pink/40 transition"
                    aria-label="Search menu" autoComplete="off" />
                </div>
                <button type="button" onClick={() => setCartOpen(true)}
                  className={`relative shrink-0 glass-strong rounded-2xl min-h-[44px] min-w-[44px] px-3 flex items-center justify-center border border-pink/25 hover:border-pink/50 transition ${badgePulse ? "animate-bounce-soft" : ""}`}
                  aria-label={itemCount ? `Cart, ${itemCount} items` : "Open cart"}>
                  <Icon name="shopping-bag" size={20} className="text-pink" />
                  {itemCount > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-pink text-white text-[10px] font-bold flex items-center justify-center">{itemCount}</span>
                  )}

            </div>
          </div>
          <div className="max-w-6xl mx-auto px-4 pt-3 pb-1">

              {CATEGORIES.map(cat => (
                <button key={cat} role="tab" aria-selected={filter === cat} onClick={() => setFilter(cat)}
                  className={`px-5 min-h-[44px] rounded-full text-[15px] font-medium whitespace-nowrap transition-colors duration-200 ${
                    filter === cat ? "bg-pink text-white" : "text-mist hover:text-ink hover:bg-white"

              ))}

          <main className="max-w-6xl mx-auto px-4 py-8">
            <div className="flex items-center justify-between mb-4">
              <p className="text-sm text-mist">{filtered.length} item{filtered.length !== 1 ? "s" : ""}</p>
              {(search || filter !== "All") && (
                <button onClick={() => { setSearch(""); setFilter("All"); }} className="text-xs text-pink hover:underline">Clear filters</button>
              )}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 items-stretch" key={filter}>
              {filtered.map((dish, i) => (
                <MenuCard key={dish.id} dish={dish} onAdd={handleAdd} onPair={setPairingDish} sessionItems={sessionItems} index={i} />

            {filtered.length === 0 && (
              <div className="text-center py-20">
                <Icon name="search" size={36} className="text-mist/40 mx-auto mb-3" />
                <p className="text-mist">No items match your filters.</p>
                <button onClick={() => { setSearch(""); setFilter("All"); }} className="mt-3 text-pink text-sm hover:underline">Reset all filters</button>
              </div>
            )}
          </main>
          <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} items={sessionItems} setItems={setSessionItems}
            orderHistory={orderHistory} cartTab={cartTab} setCartTab={setCartTab}
            onOrderPlaced={(items, tableLabel) => pushHistory(items, tableLabel)}
            onPlaySnake={() => { setCartOpen(false); setShowSnake(true); }}
            onPlaceOrder={(items, tableLabel) => {
              const tkey = String(tableLabel || "").replace(/^0+/, "") || String(tableLabel);
              const saved = guest && guest.exp && Date.now() < guest.exp ? guest : loadDiningGuest(tkey);
              if (saved && saved.exp && Date.now() < saved.exp) {
                if (!guest) setGuest(saved);
                return Promise.resolve(onPlaceOrder(items, tkey, saved));
              }
              pendingPlace.current = { items, tableLabel: tkey };
              setShowGuestGate(true);
              return false;
            }} showToast={showToast}
            tableNumber={tableNumber} setTableNumber={setTableNumber} tableFromQr={tableFromQr} />

          <SnakeGame open={showSnake} onClose={() => setShowSnake(false)} />

          {showGuestGate && (
            <div className="fixed inset-0 z-[170] flex items-end sm:items-center justify-center p-4 bg-ink/50 backdrop-blur-sm" role="dialog" aria-modal="true">
              <div className="glass-strong rounded-2xl max-w-md w-full p-6 shadow-float border border-pink/20 animate-scale-in iphone-modal">
                <h3 className="font-display text-2xl text-ink mb-1">Verify to order</h3>
                <p className="text-mist text-sm mb-4">Choose how to unlock ordering for this table.</p>
                {!otpSent ? (
                  <div className="space-y-4">
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setVerifyMode("pin")}
                        className={`flex-1 py-2.5 rounded-xl text-sm font-medium border transition ${verifyMode === "pin" ? "bg-pink text-white border-pink" : "border-pink/25 text-mist"}`}>
                        Table PIN
                      </button>
                      <button type="button" onClick={() => setVerifyMode("otp")}
                        className={`flex-1 py-2.5 rounded-xl text-sm font-medium border transition ${verifyMode === "otp" ? "bg-pink text-white border-pink" : "border-pink/25 text-mist"}`}>
                        Name + OTP
                      </button>
                    </div>

                    {verifyMode === "pin" ? (
                      <div className="space-y-3">
                        <p className="text-mist text-xs">Ask your server for the table PIN, or use the code printed with the table QR.</p>
                        <div>
                          <label className="text-xs uppercase tracking-wider text-mist">Table PIN *</label>
                          <input value={gatePin} onChange={e => setGatePin(e.target.value)} inputMode="numeric" maxLength={8}
                            className="mt-1 w-full min-h-[44px] bg-white border border-pink/20 rounded-xl px-4 text-ink text-center text-lg tracking-widest focus:outline-none focus:border-pink" placeholder="••••" />
                        </div>
                        <div>
                          <label className="text-xs uppercase tracking-wider text-mist">Your name (optional)</label>
                          <input value={gateName} onChange={e => setGateName(e.target.value)}
                            className="mt-1 w-full min-h-[44px] bg-white border border-pink/20 rounded-xl px-4 text-ink text-sm focus:outline-none focus:border-pink" placeholder="Name for the bill" />
                        </div>
                        <button type="button" onClick={() => {
                          const tKey = String(tableFromQr || (pendingPlace.current && pendingPlace.current.tableLabel) || "").replace(/^0+/, "") || "any";
                          const expected = (tablePins && tKey && tablePins[tKey]) || "";
                          if (!expected) {
                            showToast("No PIN set for this table. Ask staff, or use Name + OTP.");
                            return;
                          }
                          if (gatePin.trim() !== String(expected)) {
                            showToast("Wrong table PIN");
                            return;
                          }
                          const g = { name: gateName.trim() || "Guest", phone: "", method: "pin" };
                          const payload = saveDiningGuest(g, tKey);
                          setGuest(payload);
                          setShowGuestGate(false);
                          setGatePin("");
                          if (pendingPlace.current) {
                            const { items, tableLabel } = pendingPlace.current;
                            pendingPlace.current = null;
                            pushHistory(items, tableLabel);
                            Promise.resolve(onPlaceOrder(items, tableLabel, payload)).finally(() => {
                              setSessionItems([]);
                              setCartOpen(false);
                              setCartTab("history");
                              showToast("Order sent to Table " + tableLabel);
                              setTimeout(() => setShowSnake(true), 400);
                            });
                          } else {
                            showToast("Table verified. You can order again on this phone without re-entering the PIN.");
                          }
                        }} className="w-full py-3 rounded-xl bg-pink text-white font-semibold text-sm">Verify with PIN</button>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        <div>
                          <label className="text-xs uppercase tracking-wider text-mist">Your name *</label>
                          <input value={gateName} onChange={e => setGateName(e.target.value)}
                            className="mt-1 w-full min-h-[44px] bg-white border border-pink/20 rounded-xl px-4 text-ink text-sm focus:outline-none focus:border-pink" placeholder="Full name" />
                        </div>
                        <div>
                          <label className="text-xs uppercase tracking-wider text-mist">Mobile *</label>
                          <input type="tel" value={gatePhone} onChange={e => setGatePhone(e.target.value)}
                            className="mt-1 w-full min-h-[44px] bg-white border border-pink/20 rounded-xl px-4 text-ink text-sm focus:outline-none focus:border-pink" placeholder="10-digit number" />
                        </div>
                        <p className="text-mist/60 text-[11px]">Demo OTP is shown on the next screen. Real SMS/WhatsApp can be added later.</p>
                        <button type="button" onClick={() => {
                          if (!gateName.trim() || gatePhone.replace(/\D/g,"").length < 10) { showToast("Enter name and valid mobile"); return; }
                          const code = String(Math.floor(100000 + Math.random() * 900000));
                          setOtpCode(code);
                          setOtpSent(true);
                        }} className="w-full py-3 rounded-xl bg-pink text-white font-semibold text-sm">Send OTP</button>
                      </div>
                    )}
                    <button type="button" onClick={() => { setShowGuestGate(false); pendingPlace.current = null; }} className="w-full py-2 text-mist text-sm">Cancel</button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <p className="text-sm text-mist">Enter the 6-digit code for {gatePhone}</p>
                    <div className="rounded-xl bg-pink/10 border border-pink/30 px-4 py-3 text-center">
                      <p className="text-[10px] uppercase tracking-wider text-mist mb-1">Demo OTP</p>
                      <p className="text-2xl font-semibold text-pink tracking-[0.3em]">{otpCode}</p>
                    </div>
                    <input value={gateOtp} onChange={e => setGateOtp(e.target.value)} inputMode="numeric" maxLength={6}
                      className="w-full min-h-[44px] bg-white border border-pink/20 rounded-xl px-4 text-ink text-center text-lg tracking-widest focus:outline-none focus:border-pink" placeholder="••••••" />
                    <button type="button" onClick={() => {
                      if (gateOtp.trim() !== otpCode) { showToast("Wrong OTP"); return; }
                      const g = { name: gateName.trim(), phone: gatePhone.trim(), method: "otp" };
                      const tKey = String(tableFromQr || (pendingPlace.current && pendingPlace.current.tableLabel) || "").replace(/^0+/, "") || "any";
                      const payload = saveDiningGuest(g, tKey);
                      setGuest(payload);
                      setShowGuestGate(false);
                      setOtpSent(false);
                      setGateOtp("");
                      if (pendingPlace.current) {
                        const { items, tableLabel } = pendingPlace.current;
                        pendingPlace.current = null;
                        pushHistory(items, tableLabel);
                        Promise.resolve(onPlaceOrder(items, tableLabel, payload)).finally(() => {
                          setSessionItems([]);
                          setCartOpen(false);
                          setCartTab("history");
                          showToast("Order sent to Table " + tableLabel);
                          setTimeout(() => setShowSnake(true), 400);
                        });
                      } else {
                        showToast("Verified. You can place orders now.");
                      }
                    }} className="w-full py-3 rounded-xl bg-pink text-white font-semibold text-sm">Verify & place order</button>
                    <button type="button" onClick={() => { setOtpSent(false); setGateOtp(""); }} className="w-full py-2 text-mist text-sm">Back</button>
                  </div>
                )}
              </div>
            </div>
          )}
          {pairingDish && <PairingModal dish={pairingDish} dishes={dishes} onClose={() => setPairingDish(null)} onAdd={handleAdd} />}
          {variantDish && <VariantPicker dish={variantDish} onPick={handleVariantPick} onClose={() => setVariantDish(null)} />}

          <footer className="border-t border-pink/10 mt-16 py-10 px-4">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
              <div>
                <p className="font-display text-lg text-pink">Bloom</p>
                <p className="text-mist/60 text-xs mt-1">Boba Café</p>
              </div>
              <button onClick={onStaffAccess} className="text-mist/40 hover:text-mist text-[10px] tracking-wide transition flex items-center gap-1.5 opacity-60">
                <Icon name="lock" size={12} /> Staff
              </button>
            </div>
          </footer>
        </div>
      );
    };

    const InsightBarChart = ({ labels, values, title }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      const dataKey = JSON.stringify(labels || []) + "|" + JSON.stringify(values || []) + "|" + (title || "");
      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        const labs = labels || [];
        const vals = values || [];
        chartRef.current = new Chart(canvasRef.current.getContext("2d"), {
          type: "bar",
          data: {
            labels: labs.map(n => n.length > 16 ? n.slice(0, 14) + "…" : n),
            datasets: [{
              label: title || "Qty",
              data: vals,
              backgroundColor: vals.map((_, i) => i === 0 ? "rgba(194,24,91,0.95)" : i < 3 ? "rgba(194,24,91,0.55)" : "rgba(252,228,236,0.85)"),
              borderRadius: 6,
              borderSkipped: false,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: { display: false },
              tooltip: { backgroundColor: "#FFFFFF", titleColor: "#1F2937", bodyColor: "#C2185B", borderColor: "rgba(194,24,91,0.3)", borderWidth: 1 },
            },
            scales: {
              x: { ticks: { color: "rgba(138,122,130,0.9)", font: { size: 10 }, maxRotation: 45, minRotation: 0 }, grid: { display: false } },
              y: { beginAtZero: true, ticks: { color: "rgba(138,122,130,0.7)", precision: 0 }, grid: { color: "rgba(194,24,91,0.06)" } },
            },
          },
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [dataKey]);
      return <div className="h-56"><canvas ref={canvasRef} /></div>;
    };

    const InsightPieChart = ({ labels, values }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      const dataKey = JSON.stringify(labels || []) + "|" + JSON.stringify(values || []);
      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        const colors = [
          "rgba(194,24,91,0.9)", "rgba(173,20,87,0.85)", "rgba(252,228,236,0.95)",
          "rgba(244,114,182,0.8)", "rgba(194,24,91,0.5)", "rgba(136,14,79,0.7)",
          "rgba(251,113,133,0.65)", "rgba(244,63,94,0.6)",
        ];
        chartRef.current = new Chart(canvasRef.current.getContext("2d"), {
          type: "doughnut",
          data: {
            labels: labels || [],
            datasets: [{
              data: values || [],
              backgroundColor: (labels || []).map((_, i) => colors[i % colors.length]),
              borderWidth: 0,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: { position: "bottom", labels: { color: "rgba(107,114,128,0.9)", padding: 10, font: { size: 11 }, boxWidth: 12 } },
              tooltip: { backgroundColor: "#FFFFFF", titleColor: "#1F2937", bodyColor: "#C2185B" },
            },
            cutout: "58%",
          },
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [dataKey]);
      return <div className="h-64"><canvas ref={canvasRef} /></div>;
    };

    const ORDER_FLOW = [
      { key: "new", label: "Pending confirm", next: "accepted", nextLabel: "Confirm order" },
      { key: "accepted", label: "Confirmed", next: "cooking", nextLabel: "Start prep" },
      { key: "cooking", label: "In prep", next: "ready", nextLabel: "Mark ready" },
      { key: "ready", label: "Ready", next: "delivered", nextLabel: "Mark served" },
      { key: "delivered", label: "Served", next: null, nextLabel: null },
    ];
    const statusMeta = (s) => ORDER_FLOW.find(x => x.key === s) || ORDER_FLOW[0];
    const statusColor = (s) => ({
      new: "bg-amber-100 text-amber-700 border-amber-300",
      accepted: "bg-sky-100 text-sky-700 border-sky-300",
      cooking: "bg-orange-100 text-orange-700 border-orange-300",
      ready: "bg-emerald-100 text-emerald-700 border-emerald-300",
      delivered: "bg-pink-soft text-pink-deep border-pink/40",
    }[s] || "bg-blush text-mist");

    const OwnerView = ({ dishes, setDishes, recommendations, setRecommendations, liveOrders = [], updateRoundStatus, clearTable, cancelRound, tablePins = {}, setTablePins, onLogout, showToast, onReset, onRefreshOrders }) => {
      const [editingDish, setEditingDish] = useState(null);
      const [staffTab, setStaffTab] = useState("live");
      const [mgrUnlocked, setMgrUnlocked] = useState(() => {
        try { return sessionStorage.getItem("bloom_mgr") === "1"; } catch { return false; }
      });
      const [mgrPin, setMgrPin] = useState("");
      const [mgrError, setMgrError] = useState(false);
      const [insightPeriod, setInsightPeriod] = useState("day");
      const [insights, setInsights] = useState(null);
      const [insightsLoading, setInsightsLoading] = useState(false);
      const [insightsError, setInsightsError] = useState("");
      const dishesRef = useRef(dishes);
      dishesRef.current = dishes;
      const insightsLoadingRef = useRef(false);

      // Manual / period / tab only — NOT on every menu sync (that was flickering charts every second)
      const loadInsights = useCallback(async (period) => {
        if (insightsLoadingRef.current) return;
        const p = period || insightPeriod;
        insightsLoadingRef.current = true;
        setInsightsLoading(true);
        setInsightsError("");
        try {
          const data = await cloudFetchInsights(p);
          const catMap = {};
          const dishById = Object.fromEntries((dishesRef.current || []).map(d => [d.id, d]));
          (data.rawRounds || []).filter(r => r.status && r.status !== "new").forEach(r => {
            (r.items || []).forEach(it => {
              const dish = dishById[it.id];
              const cat = (dish && dish.category) || "Other";
              const qty = it.qty || 1;
              catMap[cat] = (catMap[cat] || 0) + qty;
            });
          });
          const categoryEntries = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
          setInsights({
            ...data,
            categoryLabels: categoryEntries.map(e => e[0]),
            categoryValues: categoryEntries.map(e => e[1]),
          });
        } catch (e) {
          console.error(e);
          setInsightsError(e.message || "Failed to load insights");
        }
        insightsLoadingRef.current = false;
        setInsightsLoading(false);
      }, [insightPeriod]);

      useEffect(() => {
        if (staffTab === "insights" && mgrUnlocked) loadInsights(insightPeriod);
      }, [staffTab, mgrUnlocked, insightPeriod, loadInsights]);

      const handleRecAction = (rec, action) => {
        setRecommendations(prev => {
          const next = prev.map(r => r.id === rec.id ? { ...r, status: action } : r);
          saveState("bloom_recs", next);
          return next;
        });
        if (action === "applied") {
          setDishes(prev => {
            let next = [...prev];
            if (rec.type === "positioning" && rec.dishId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, tags: d.tags.includes("Most Ordered") ? d.tags : [...d.tags, "Most Ordered"], sortOrder: 1 } : d);
            }
            if (rec.type === "pairing" && rec.dishId && rec.targetId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, pairWith: d.pairWith.includes(rec.targetId) ? d.pairWith : [...d.pairWith, rec.targetId] } : d);
            }
            if (rec.type === "timing" && rec.dishId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, tags: d.tags.includes("Peak Feature") ? d.tags : [...d.tags, "Peak Feature"], sortOrder: 1 } : d);
            }
            saveState("bloom_dishes", next);
            return next;
          });
          showToast(`Applied: ${rec.title}`);
        } else if (action === "dismissed") showToast("Recommendation dismissed");
        else showToast("A/B test scheduled");
      };

      const saveDish = (updated) => {
        if (updated.id === null) {
          setDishes(prev => {
            const newId = Math.max(0, ...prev.map(d => d.id)) + 1;
            const dish = {
              ...updated,
              id: newId,
              tags: updated.tags || [],
              diet: updated.diet || [],
              margin: updated.margin ?? 50,
              ordersToday: 0,
              visible: true,
              imageVisible: updated.imageVisible === true,
              pairWith: [],
              sortOrder: 99,
            };
            const next = [...prev, dish];
            saveState("bloom_dishes", next);
            return next;
          });
          showToast(`"${updated.name}" added to menu`);
        } else {
          setDishes(prev => {
            const next = prev.map(d => d.id === updated.id ? { ...updated, imageVisible: updated.imageVisible === true } : d);
            saveState("bloom_dishes", next);
            return next;
          });
          showToast("Item updated successfully");
        }
        setEditingDish(null);
      };

      const deleteDish = (id) => {
        const dish = dishes.find(d => d.id === id);
        if (!dish || !window.confirm(`Remove "${dish.name}" from the menu?`)) return;
        setDishes(prev => {
          const next = prev.filter(d => d.id !== id);
          saveState("bloom_dishes", next);
          return next;
        });
        showToast(`"${dish.name}" removed`);
      };

      const openAddDish = () => setEditingDish({
        id: null, name: "", description: "", price: 0, category: "Milk Tea",
        image: "",
        tags: [], diet: ["Vegetarian"], margin: 50, ordersToday: 0, visible: true, imageVisible: false, pairWith: [], sortOrder: 99,
      });

      const toggleVisible = (id) => {
        setDishes(prev => {
          const next = prev.map(x => x.id === id ? { ...x, visible: !x.visible } : x);
          saveState("bloom_dishes", next);
          return next;
        });
      };

      const toggleImageVisible = (id) => {
        setDishes(prev => {
          const next = prev.map(x => x.id === id ? { ...x, imageVisible: !x.imageVisible } : x);
          saveState("bloom_dishes", next);
          return next;

                      </label>
                      {editingDish.image && (
                        <button type="button" onClick={() => setEditingDish({ ...editingDish, image: "" })}
                          className="px-4 min-h-[44px] rounded-xl border border-pink/25 text-mist text-sm hover:text-red-500">
                          Clear
                        </button>
                      )}
                    </div>
                    <p className="text-mist/70 text-[11px] mt-2">Or paste a link below. Max ~2.5 MB for uploads.</p>
                    <input type="text" value={editingDish.image && !String(editingDish.image).startsWith("data:") ? editingDish.image : ""}
                      onChange={e => setEditingDish({ ...editingDish, image: e.target.value })}
                      placeholder="https://… image URL (optional)"
                      className="mt-2 w-full bg-white border border-pink/20 rounded-xl px-4 py-2.5 text-ink text-sm focus:outline-none focus:border-pink" />
                    {editingDish.image && (
                      <div className="mt-3 relative">
                        <img src={editingDish.image} alt="Preview" className="w-full h-36 object-cover rounded-xl border border-pink/10" onError={e => { e.target.style.display = "none"; }} />
                        {String(editingDish.image).startsWith("data:") && (
                          <span className="absolute top-2 left-2 text-[10px] uppercase tracking-wider bg-white/90 text-pink px-2 py-0.5 rounded-full font-semibold">Uploaded</span>
                        )}
                      </div>
                    )}
                    <div className="mt-3 flex items-center justify-between gap-3 p-3 rounded-xl bg-blush border border-pink/10">
                      <div>
                        <p className="text-sm font-medium text-ink">Show photo on menu</p>
                        <p className="text-[11px] text-mist">Off by default. Customers will not see it until you turn this on.</p>
                      </div>
                      <button type="button"
                        onClick={() => setEditingDish({ ...editingDish, imageVisible: !editingDish.imageVisible })}
                        className={`switch-toggle w-12 h-7 rounded-full flex-shrink-0 ${editingDish.imageVisible ? "is-on" : "is-off"}`}
                        aria-pressed={!!editingDish.imageVisible}
                        aria-label={editingDish.imageVisible ? "Hide photo" : "Show photo"}>
                        <span className="switch-knob" style={{ width: 18, height: 18 }} />
                      </button>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wider text-mist">Name *</label>
                    <input type="text" value={editingDish.name} onChange={e => setEditingDish({ ...editingDish, name: e.target.value })}
                      className="mt-1 w-full bg-white border border-pink/20 rounded-xl px-4 py-2.5 text-ink text-sm focus:outline-none focus:border-pink" />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wider text-mist">Description</label>
                    <textarea rows={3} value={editingDish.description} onChange={e => setEditingDish({ ...editingDish, description: e.target.value })}
                      className="mt-1 w-full bg-white border border-pink/20 rounded-xl px-4 py-2.5 text-ink text-sm focus:outline-none focus:border-pink resize-none" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs uppercase tracking-wider text-mist">Price (₹)</label>
                      <input type="number" min="0" value={editingDish.price} onChange={e => setEditingDish({ ...editingDish, price: parseFloat(e.target.value) || 0 })}
                        className="mt-1 w-full bg-white border border-pink/20 rounded-xl px-4 py-2.5 text-ink text-sm focus:outline-none focus:border-pink" />
                    </div>
                    <div>
                      <label className="text-xs uppercase tracking-wider text-mist">Category</label>
                      <select value={editingDish.category} onChange={e => setEditingDish({ ...editingDish, category: e.target.value })}
                        className="mt-1 w-full bg-white border border-pink/20 rounded-xl px-4 py-2.5 text-ink text-sm focus:outline-none focus:border-pink">
                        {CATEGORIES.filter(c => c !== "All").map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wider text-mist">Margin (%)</label>
                    <input type="number" min="0" max="100" value={editingDish.margin ?? 50} onChange={e => setEditingDish({ ...editingDish, margin: parseFloat(e.target.value) || 0 })}
                      className="mt-1 w-full bg-white border border-pink/20 rounded-xl px-4 py-2.5 text-ink text-sm focus:outline-none focus:border-pink" />
                  </div>
                  <div className="flex items-center gap-3 pt-2">
                    <button onClick={() => {
                      if (!editingDish.name.trim()) { showToast("Please enter a name"); return; }
                      saveDish(editingDish);
                    }} className="flex-1 py-3 rounded-xl bg-pink text-white font-semibold hover:bg-pink-deep transition">
                      {editingDish.id === null ? "Add to Menu" : "Save Changes"}
                    </button>
                    <button onClick={() => setEditingDish(null)} className="px-5 py-3 rounded-xl text-mist hover:text-ink">Cancel</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    function getTableFromUrl() {
      try {
        const q = new URLSearchParams(window.location.search);
        const t = q.get("table") || q.get("t") || "";
        return (t || "").trim();
      } catch { return ""; }
    }
    function getPinFromUrl() {
      try {
        const q = new URLSearchParams(window.location.search);
        return (q.get("pin") || q.get("code") || "").trim();
      } catch { return ""; }
    }

    function App() {
      const [view, setView] = useState(() => { try { return sessionStorage.getItem("bloom_staff") === "1" ? "owner" : "customer"; } catch { return "customer"; } });
      const [staffAuth, setStaffAuth] = useState(() => { try { return sessionStorage.getItem("bloom_staff") === "1"; } catch { return false; } });
      const [showPin, setShowPin] = useState(false);
      const [dishes, setDishes] = useState(() => {
        const loaded = loadState("bloom_dishes", null);
        if (!loaded) return mergeMenuList(INITIAL_DISHES);
        const wiped = sessionStorage.getItem("bloom_stats_wiped");
        if (!wiped) {
          try { sessionStorage.setItem("bloom_stats_wiped", "1"); } catch {}
          return mergeMenuList(loaded.map(d => ({ ...d, ordersToday: 0 })));
        }
        return mergeMenuList(loaded);
      });
      const [recommendations, setRecommendations] = useState(() => loadState("bloom_recs", AI_RECOMMENDATIONS));
      const [sessionItems, setSessionItems] = useState([]);
      const [liveOrders, setLiveOrders] = useState([]);
      const [tablePins, setTablePins] = useState(() => ({ ...DEFAULT_TABLE_PINS }));
      const [toast, setToast] = useState(null);
      const [tableFromQr] = useState(() => getTableFromUrl());
      const [pinFromQr] = useState(() => getPinFromUrl());
      const menuCloudReady = useRef(false);
      const applyingRemoteMenu = useRef(false);

      useEffect(() => { saveState("bloom_dishes", dishes); }, [dishes]);
      useEffect(() => { saveState("bloom_recs", recommendations); }, [recommendations]);

      // Push menu edits (photo on/off, uploads, prices) to Supabase for all devices
      useEffect(() => {
        if (!menuCloudReady.current || applyingRemoteMenu.current) return;
        scheduleCloudSaveMenu(dishes);
      }, [dishes]);

      const showToast = useCallback((msg) => setToast(msg), []);

      const applyRemoteMenu = useCallback((list, remoteUpdatedAt) => {
        if (!Array.isArray(list) || !list.length) return;
        // Don't clobber a toggle the user just made with an older cloud snapshot
        if (remoteUpdatedAt) {
          const remoteMs = new Date(remoteUpdatedAt).getTime();
          if (Number.isFinite(remoteMs) && remoteMs < _lastLocalMenuWriteAt - 50) {
            return;
          }
        } else if (Date.now() - _lastLocalMenuWriteAt < 2000) {
          return;
        }
        applyingRemoteMenu.current = true;
        setDishes(mergeMenuList(list));
        queueMicrotask(() => { applyingRemoteMenu.current = false; });
      }, []);

      const refreshOrders = useCallback(async () => {
        try {
          if (!sb) {
            showToast("Cloud not connected. Check Supabase script.");
            return;
          }
          const next = await cloudFetchLiveOrders();
          setLiveOrders(next || []);
          showToast("Orders refreshed");
        } catch (e) {
          console.error(e);
          showToast("Refresh failed: " + (e.message || "error"));
        }
      }, [showToast]);

      useEffect(() => {
        let channel;
        (async () => {
          try {
            if (!sb) {
              setTablePins({ ...DEFAULT_TABLE_PINS });
              return;
            }
            const pins = await cloudFetchPins();
            if (pins) setTablePins(pins);
            const orders = await cloudFetchLiveOrders();
            setLiveOrders(orders || []);

            // Load shared menu (photos / visibility) from cloud
            try {
              const remote = await cloudFetchMenu();
              if (remote && remote.dishes && remote.dishes.length) {
                applyRemoteMenu(remote.dishes, remote.updatedAt);
              } else {
                // First time: seed cloud from current local menu
                await cloudSaveMenu(dishes);
              }
            } catch (menuErr) {
              console.error("menu load", menuErr);
            }
            menuCloudReady.current = true;

            channel = sb.channel("bloom-live")
              .on("postgres_changes", { event: "*", schema: "public", table: "bloom_order_rounds" }, async () => {
                try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch (e) { console.error(e); }
              })
              .on("postgres_changes", { event: "*", schema: "public", table: "bloom_table_sessions" }, async () => {
                try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch (e) { console.error(e); }
              })
              .on("postgres_changes", { event: "*", schema: "public", table: "bloom_menu" }, async () => {
                try {
                  const remote = await cloudFetchMenu();
                  if (remote && remote.dishes) applyRemoteMenu(remote.dishes, remote.updatedAt);
                } catch (e) { console.error(e); }
              })
              .subscribe();
          } catch (e) {
            console.error(e);
            setTablePins({ ...DEFAULT_TABLE_PINS });
            menuCloudReady.current = true;
          }
        })();
        return () => { if (channel && sb) sb.removeChannel(channel); };
      }, [showToast, applyRemoteMenu]);

      const placeOrder = useCallback(async (items, tableLabel, guest) => {
        try {
          await cloudPlaceOrder(items, tableLabel, guest);
          const next = await cloudFetchLiveOrders();
          setLiveOrders(next || []);
        } catch (e) {
          console.error(e);
          showToast("Order failed: " + (e.message || "cloud error"));
          throw e;
        }
      }, [showToast]);

      const updateRoundStatus = useCallback(async (tableKey, roundId, status) => {
        setLiveOrders(prev => prev.map(session => {
          if (String(session.table) !== String(tableKey)) return session;
          return {
            ...session,
            rounds: (session.rounds || []).map(r =>
              String(r.id) === String(roundId) ? { ...r, status, updatedAt: new Date().toISOString() } : r
            ),
          };
        }));
        try {
          await cloudUpdateRoundStatus(roundId, status);
          if (status === "accepted") {
            const session = liveOrders.find(s => String(s.table) === String(tableKey));
            const round = session?.rounds?.find(r => String(r.id) === String(roundId));
            const confirmedItems = round?.items || [];
            if (confirmedItems.length) {
              setDishes(ds => {
                const dnext = ds.map(d => {
                  const ordered = confirmedItems.find(i => i.id === d.id);
                  if (!ordered) return d;
                  return { ...d, ordersToday: (d.ordersToday || 0) + (ordered.qty || 1) };
                });
                saveState("bloom_dishes", dnext);
                return dnext;
              });
            }
          }
        } catch (e) {
          console.error(e);
          showToast("Status update failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [showToast, liveOrders]);

      const clearTable = useCallback(async (tableKey) => {
        const session = liveOrders.find(s => String(s.table) === String(tableKey));
        setLiveOrders(prev => prev.filter(s => String(s.table) !== String(tableKey)));
        try {
          await cloudClearTable(session?.sessionId, tableKey);
        } catch (e) {
          console.error(e);
          showToast("Clear failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [liveOrders, showToast]);

      const cancelRound = useCallback(async (tableKey, roundId) => {
        setLiveOrders(prev => prev.map(session => {
          if (String(session.table) !== String(tableKey)) return session;
          return { ...session, rounds: (session.rounds || []).filter(r => String(r.id) !== String(roundId)) };
        }).filter(s => (s.rounds || []).length > 0));
        try {
          await cloudCancelRound(roundId);
        } catch (e) {
          console.error(e);
          showToast("Cancel failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [showToast]);

      const handleStaffAccess = () => {
        if (staffAuth) setView("owner");
        else setShowPin(true);
      };
      const handlePinSuccess = () => {
        setStaffAuth(true);
        try { sessionStorage.setItem("bloom_staff", "1"); } catch {}
        setShowPin(false);
        setView("owner");
        showToast("Staff access granted");
      };
      const handleLogout = () => {
        setStaffAuth(false);
        try { sessionStorage.removeItem("bloom_staff"); } catch {}
        setView("customer");
        showToast("Logged out of Staff Mode");
      };

      return (
        <div className="min-h-screen bg-blush">
          {(view === "customer" || !staffAuth) ? (
            <CustomerView dishes={dishes} sessionItems={sessionItems} setSessionItems={setSessionItems} showToast={showToast} onStaffAccess={handleStaffAccess} onPlaceOrder={placeOrder} tableFromQr={tableFromQr} pinFromQr={pinFromQr} tablePins={tablePins} />
          ) : (
            <OwnerView dishes={dishes} setDishes={setDishes} recommendations={recommendations} setRecommendations={setRecommendations}
              liveOrders={liveOrders} updateRoundStatus={updateRoundStatus} clearTable={clearTable} cancelRound={cancelRound}
              tablePins={tablePins} setTablePins={setTablePins}
              onLogout={handleLogout} showToast={showToast} onRefreshOrders={refreshOrders} />
          )}
          {showPin && <PinModal onSuccess={handlePinSuccess} onClose={() => setShowPin(false)} />}
          {toast && <Toast message={toast} onDone={() => setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
