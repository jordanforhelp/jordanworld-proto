<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#FBF6F0" />
  <meta name="description" content="Jordan's Pizza — wood-fired pizza, order from your table." />
  <title>Jordan's Pizza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: '#FBF6F0',
            cream: '#FFFDF8',
            wood: '#5C3A21',
            'wood-deep': '#3D2414',
            'wood-light': '#8B5E3C',
            tomato: '#C2410C',
            'tomato-deep': '#9A3412',
            ember: '#EA580C',
            gold: '#D97706',
            ink: '#1C1410',
            mist: '#6B5B4F',
            soft: '#F5E6D3',
            crust: '#E8D5B7',
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'wood': '0 8px 30px rgba(92, 58, 33, 0.12)',
            'wood-lg': '0 16px 48px rgba(61, 36, 20, 0.16)',
            'card': '0 4px 20px rgba(61, 36, 20, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #FBF6F0;
      color: #1C1410;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    body {
      background-image:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(194,65,12,0.06), transparent),
        radial-gradient(ellipse 60% 40% at 95% 10%, rgba(217,119,6,0.05), transparent);
    }
    button, input, select, textarea { font-size: 16px !important; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #FBF6F0; }
    ::-webkit-scrollbar-thumb { background: #C2410C; border-radius: 3px; }

    .wood-card {
      background: #FFFDF8;
      border: 1px solid rgba(92, 58, 33, 0.12);
      border-radius: 18px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .wood-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(92, 58, 33, 0.1);
      border-color: rgba(194, 65, 12, 0.25);
    }
    .glass {
      background: rgba(255, 253, 248, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(92, 58, 33, 0.1);
    }
    .pizza-preview {
      background: radial-gradient(circle at 50% 45%, #F5E6D3 0%, #E8D5B7 70%, #D4B896 100%);
      border-radius: 50%;
      position: relative;
      overflow: hidden;
    }
    .topping-dot {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;color:#C2410C;font-family:system-ui;font-weight:500">
      Loading Jordan's Pizza…
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ===================== MENU DATA =====================
    const CATEGORIES = ["Pizzas", "Build Your Own", "Sides", "Drinks", "Desserts"];

    const MENU = [
      // Classic Pizzas
      {

      },
      {
        id: "pepperoni",
        name: "Pepperoni",

        price: 349,
        category: "Pizzas",
        image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?w=600&q=80",
        tags: ["Popular"],

      {

      {

      {

        category: "Pizzas",
        image: "https://images.unsplash.com/photo-1604068549295-dea0ed1d5d50?w=600&q=80",

      },
      {
        id: "meat-lovers",
        name: "Meat Lovers",
        description: "Pepperoni, sausage, ham, bacon, mozzarella",
        price: 429,
        category: "Pizzas",
        image: "https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?w=600&q=80",

      },

      // Build Your Own is handled specially
      {

        isBuilder: true
      },

      // Sides
      {
        id: "garlic-bread",
        name: "Garlic Bread",
        description: "Wood-fired, with garlic butter & herbs",
        price: 129,
        category: "Sides",
        image: "https://images.unsplash.com/photo-1619535860434-ba1d8a0e0f0b?w=600&q=80",
        tags: []
      },
      {
        id: "wings",
        name: "Chicken Wings",
        description: "Crispy wings with your choice of sauce",
        price: 249,
        category: "Sides",
        image: "https://images.unsplash.com/photo-1527477396000-e27173b67ebb?w=600&q=80",
        tags: []
      },
      {
        id: "fries",

        description: "Crispy fries, truffle oil, parmesan",
        price: 179,
        category: "Sides",
        image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600&q=80",
        tags: []
      },
      {
        id: "salad",
        name: "Caesar Salad",
        description: "Romaine, croutons, parmesan, classic dressing",
        price: 199,
        category: "Sides",
        image: "https://images.unsplash.com/photo-1546793665-c74683f339c1?w=600&q=80",

      },

      // Drinks
      {
        id: "cola",
        name: "Cola",
        description: "Chilled 330ml",
        price: 79,
        category: "Drinks",
        image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600&q=80",
        tags: []
      },
      {
        id: "lemonade",
        name: "Fresh Lemonade",
        description: "House-made, lightly sweetened",
        price: 99,
        category: "Drinks",
        image: "https://images.unsplash.com/photo-1523677011783-c91d1bbe2fdc?w=600&q=80",
        tags: []
      },
      {
        id: "water",
        name: "Still Water",
        description: "500ml",
        price: 49,
        category: "Drinks",
        image: "https://images.unsplash.com/photo-1548832632-86f161091458?w=600&q=80",
        tags: []
      },

      // Desserts
      {
        id: "tiramisu",
        name: "Tiramisu",
        description: "Classic Italian, espresso-soaked",
        price: 179,
        category: "Desserts",
        image: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=600&q=80",
        tags: []
      },
      {
        id: "brownie",
        name: "Chocolate Brownie",
        description: "Warm, with vanilla ice cream",
        price: 159,
        category: "Desserts",
        image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600&q=80",
        tags: []
      }
    ];

    const TOPPINGS = [
      { id: "pepperoni", name: "Pepperoni", price: 49, color: "#C2410C" },
      { id: "mushroom", name: "Mushroom", price: 39, color: "#78716C" },
      { id: "onion", name: "Red Onion", price: 29, color: "#7C3AED" },
      { id: "olive", name: "Black Olive", price: 39, color: "#1C1917" },
      { id: "pepper", name: "Bell Pepper", price: 35, color: "#16A34A" },
      { id: "jalapeno", name: "Jalapeño", price: 35, color: "#15803D" },
      { id: "chicken", name: "Grilled Chicken", price: 69, color: "#D97706" },
      { id: "bacon", name: "Bacon", price: 59, color: "#9A3412" },
      { id: "pineapple", name: "Pineapple", price: 39, color: "#FBBF24" },
      { id: "basil", name: "Fresh Basil", price: 25, color: "#166534" },
      { id: "extra-cheese", name: "Extra Cheese", price: 49, color: "#FDE68A" },
      { id: "corn", name: "Sweet Corn", price: 29, color: "#FACC15" }
    ];

    const BASES = [
      { id: "tomato", name: "Tomato Sauce", price: 0 },
      { id: "bbq", name: "BBQ Sauce", price: 20 },
      { id: "white", name: "White Sauce", price: 20 },
      { id: "pesto", name: "Pesto", price: 30 }
    ];

    const SIZES = [
      { id: "regular", name: "Regular (10\")", price: 0 },
      { id: "large", name: "Large (12\")", price: 80 },
      { id: "xl", name: "XL (14\")", price: 140 }
    ];

    // ===================== HELPERS =====================
    function formatPrice(n) {
      return "₹" + Number(n).toLocaleString("en-IN");
    }

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    // ===================== TOAST =====================
    function Toast({ message, onDone }) {
      useEffect(() => {
        const t = setTimeout(onDone, 2400);
        return () => clearTimeout(t);
      }, [onDone]);
      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] pointer-events-none">
          <div className="bg-wood-deep text-cream px-5 py-3 rounded-2xl shadow-wood-lg text-sm font-medium">
            {message}
          </div>
        </div>
      );
    }

    // ===================== BUILDER MODAL =====================
    function BuilderModal({ onClose, onAdd }) {
      const [size, setSize] = useState("regular");
      const [base, setBase] = useState("tomato");
      const [selected, setSelected] = useState([]);
      const [note, setNote] = useState("");

      const sizeObj = SIZES.find(s => s.id === size);
      const baseObj = BASES.find(b => b.id === base);
      const toppingsTotal = selected.reduce((sum, id) => {
        const t = TOPPINGS.find(x => x.id === id);
        return sum + (t ? t.price : 0);
      }, 0);
      const total = 249 + sizeObj.price + baseObj.price + toppingsTotal;

      const toggleTopping = (id) => {
        setSelected(prev =>
          prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
        );
      };

      const handleAdd = () => {
        const toppingNames = selected.map(id => TOPPINGS.find(t => t.id === id)?.name).filter(Boolean);
        onAdd({
          id: "build-" + uid(),
          menuId: "build-your-own",
          name: "Custom Pizza",
          description: `${sizeObj.name} · ${baseObj.name}${toppingNames.length ? " · " + toppingNames.join(", ") : ""}`,
          price: total,
          qty: 1,
          image: "https://images.unsplash.com/photo-1571997478779-2adcbbe9b2f0?w=600&q=80",
          note: note.trim() || null,
          meta: { size, base, toppings: selected }
        });
        onClose();
      };

      // Simple visual dots for toppings
      const dots = selected.slice(0, 12).map((id, i) => {
        const t = TOPPINGS.find(x => x.id === id);
        const angle = (i / 12) * Math.PI * 2;
        const r = 28 + (i % 3) * 8;
        return {
          id,
          color: t?.color || "#C2410C",
          left: 50 + Math.cos(angle) * r,
          top: 50 + Math.sin(angle) * r
        };
      });

      return (
        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-ink/50 backdrop-blur-sm p-0 sm:p-4"
          onClick={onClose}>
          <div className="bg-cream w-full sm:max-w-lg max-h-[92dvh] overflow-y-auto rounded-t-3xl sm:rounded-3xl shadow-wood-lg"
            onClick={e => e.stopPropagation()}>
            {/* Header */}
            <div className="sticky top-0 bg-cream/95 backdrop-blur border-b border-wood/10 px-5 py-4 flex items-center justify-between z-10">
              <div>
                <h2 className="font-display text-xl text-ink">Build Your Own</h2>
                <p className="text-xs text-mist mt-0.5">Base starts at ₹249</p>
              </div>
              <button onClick={onClose} className="w-9 h-9 rounded-full bg-soft flex items-center justify-center text-mist hover:text-ink">
                ✕
              </button>
            </div>

            <div className="p-5 space-y-6">
              {/* Visual pizza */}
              <div className="flex justify-center">
                <div className="pizza-preview w-40 h-40 relative shadow-inner">
                  {dots.map(d => (
                    <div key={d.id} className="topping-dot w-3.5 h-3.5"
                      style={{
                        background: d.color,
                        left: d.left + "%",
                        top: d.top + "%",
                        transform: "translate(-50%,-50%)",
                        boxShadow: "0 1px 2px rgba(0,0,0,0.2)"
                      }} />
                  ))}
                  {selected.length === 0 && (
                    <div className="absolute inset-0 flex items-center justify-center text-mist/40 text-xs font-medium">
                      Add toppings
                    </div>
                  )}
                </div>
              </div>

              {/* Size */}
              <div>
                <p className="text-xs font-semibold text-mist uppercase tracking-wider mb-2">Size</p>
                <div className="grid grid-cols-3 gap-2">
                  {SIZES.map(s => (
                    <button key={s.id} onClick={() => setSize(s.id)}
                      className={`py-2.5 rounded-xl text-sm font-medium border transition ${
                        size === s.id
                          ? "bg-tomato text-white border-tomato"
                          : "bg-white border-wood/15 text-ink hover:border-tomato/40"
                      }`}>
                      {s.name.split(" ")[0]}
                      {s.price > 0 && <span className="block text-[10px] opacity-80">+{formatPrice(s.price)}</span>}
                    </button>
                  ))}
                </div>
              </div>

              {/* Base */}
              <div>
                <p className="text-xs font-semibold text-mist uppercase tracking-wider mb-2">Sauce</p>
                <div className="grid grid-cols-2 gap-2">
                  {BASES.map(b => (
                    <button key={b.id} onClick={() => setBase(b.id)}
                      className={`py-2.5 px-3 rounded-xl text-sm font-medium border text-left transition ${
                        base === b.id
                          ? "bg-tomato text-white border-tomato"
                          : "bg-white border-wood/15 text-ink hover:border-tomato/40"
                      }`}>
                      {b.name}
                      {b.price > 0 && <span className="text-xs opacity-80 ml-1">+{formatPrice(b.price)}</span>}
                    </button>
                  ))}
                </div>
              </div>

              {/* Toppings */}
              <div>
                <p className="text-xs font-semibold text-mist uppercase tracking-wider mb-2">Toppings</p>
                <div className="grid grid-cols-2 gap-2">
                  {TOPPINGS.map(t => {
                    const active = selected.includes(t.id);
                    return (
                      <button key={t.id} onClick={() => toggleTopping(t.id)}
                        className={`flex items-center gap-2 py-2.5 px-3 rounded-xl text-sm font-medium border transition ${
                          active
                            ? "bg-soft border-tomato text-tomato-deep"
                            : "bg-white border-wood/15 text-ink hover:border-tomato/30"
                        }`}>
                        <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: t.color }} />
                        <span className="flex-1 text-left truncate">{t.name}</span>
                        <span className="text-xs opacity-70">+{formatPrice(t.price)}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Note */}
              <div>
                <p className="text-xs font-semibold text-mist uppercase tracking-wider mb-2">Special note (optional)</p>
                <input
                  value={note}
                  onChange={e => setNote(e.target.value)}
                  placeholder="e.g. extra crispy, light cheese…"
                  className="w-full px-4 py-3 rounded-xl border border-wood/15 bg-white text-sm focus:outline-none focus:border-tomato/50"
                  maxLength={80}
                />
              </div>
            </div>

            {/* Footer */}
            <div className="sticky bottom-0 bg-cream border-t border-wood/10 px-5 py-4 flex items-center gap-3">
              <div className="flex-1">
                <p className="text-xs text-mist">Total</p>
                <p className="font-display text-xl text-ink">{formatPrice(total)}</p>
              </div>
              <button onClick={handleAdd}
                className="flex-1 py-3.5 rounded-2xl bg-tomato text-white font-semibold text-sm hover:bg-tomato-deep transition shadow-md">
                Add to order
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ===================== CART DRAWER =====================
    function CartDrawer({ items, onClose, onUpdateQty, onUpdateNote, onRemove, onPlaceOrder, placing }) {
      const total = items.reduce((s, i) => s + i.price * i.qty, 0);
      const [editingNote, setEditingNote] = useState(null);
      const [noteDraft, setNoteDraft] = useState("");

      const startNote = (item) => {
        setEditingNote(item.id);
        setNoteDraft(item.note || "");
      };
      const saveNote = (id) => {
        onUpdateNote(id, noteDraft.trim());
        setEditingNote(null);
      };

      return (
        <div className="fixed inset-0 z-[90]">
          <div className="absolute inset-0 bg-ink/40 backdrop-blur-sm" onClick={onClose} />
          <div className="absolute right-0 top-0 bottom-0 w-full max-w-md bg-cream shadow-wood-lg flex flex-col">
            <div className="px-5 py-4 border-b border-wood/10 flex items-center justify-between">
              <h2 className="font-display text-xl text-ink">Your Order</h2>
              <button onClick={onClose} className="w-9 h-9 rounded-full bg-soft flex items-center justify-center text-mist">✕</button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {items.length === 0 ? (
                <div className="text-center py-16 text-mist">
                  <p className="text-4xl mb-3">🍕</p>
                  <p className="font-medium">Your cart is empty</p>
                  <p className="text-sm mt-1">Add some wood-fired goodness</p>
                </div>
              ) : (
                items.map(item => (
                  <div key={item.id} className="wood-card p-3 flex gap-3">
                    <img src={item.image} alt="" className="w-16 h-16 rounded-xl object-cover flex-shrink-0 bg-soft" />
                    <div className="flex-1 min-w-0">
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <p className="font-semibold text-ink text-sm leading-tight">{item.name}</p>
                          {item.description && (
                            <p className="text-xs text-mist mt-0.5 line-clamp-2">{item.description}</p>
                          )}
                        </div>
                        <button onClick={() => onRemove(item.id)} className="text-mist hover:text-tomato text-xs">✕</button>
                      </div>

                      <div className="flex items-center justify-between mt-2">
                        <div className="flex items-center gap-2">
                          <button onClick={() => onUpdateQty(item.id, item.qty - 1)}
                            className="w-7 h-7 rounded-lg bg-soft text-ink font-medium text-sm">−</button>
                          <span className="text-sm font-semibold w-5 text-center">{item.qty}</span>
                          <button onClick={() => onUpdateQty(item.id, item.qty + 1)}
                            className="w-7 h-7 rounded-lg bg-soft text-ink font-medium text-sm">+</button>
                        </div>
                        <p className="font-semibold text-sm text-ink">{formatPrice(item.price * item.qty)}</p>
                      </div>

                      {/* Note chip */}
                      {editingNote === item.id ? (
                        <div className="mt-2 flex gap-1.5">
                          <input
                            autoFocus
                            value={noteDraft}
                            onChange={e => setNoteDraft(e.target.value)}
                            onKeyDown={e => e.key === "Enter" && saveNote(item.id)}
                            onBlur={() => saveNote(item.id)}
                            placeholder="Add a note…"
                            className="flex-1 text-xs px-2.5 py-1.5 rounded-lg border border-wood/20 bg-white focus:outline-none"
                            maxLength={60}
                          />
                        </div>
                      ) : (
                        <button onClick={() => startNote(item)}
                          className="mt-2 text-xs text-mist hover:text-tomato flex items-center gap-1">
                          {item.note ? (
                            <span className="bg-soft text-tomato-deep px-2 py-0.5 rounded-md max-w-full truncate">
                              📝 {item.note}
                            </span>
                          ) : (
                            <span className="opacity-70">+ Add note</span>
                          )}
                        </button>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>

            {items.length > 0 && (
              <div className="border-t border-wood/10 p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-mist text-sm">Total</span>
                  <span className="font-display text-2xl text-ink">{formatPrice(total)}</span>
                </div>
                <button
                  disabled={placing}
                  onClick={onPlaceOrder}
                  className="w-full py-3.5 rounded-2xl bg-tomato text-white font-semibold text-sm hover:bg-tomato-deep transition disabled:opacity-60 shadow-md">
                  {placing ? "Sending…" : "Place Order"}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ===================== ORDER STATUS =====================
    function OrderStatus({ order, onClose }) {
      const steps = [
        { key: "sent", label: "Order sent" },
        { key: "cooking", label: "On the fire" },
        { key: "ready", label: "Ready" }
      ];
      const idx = steps.findIndex(s => s.key === order.status);

      return (
        <div className="fixed inset-0 z-[95] flex items-end sm:items-center justify-center bg-ink/40 backdrop-blur-sm p-4"
          onClick={onClose}>
          <div className="bg-cream w-full max-w-sm rounded-3xl shadow-wood-lg overflow-hidden"
            onClick={e => e.stopPropagation()}>
            <div className="px-5 py-4 border-b border-wood/10 flex items-center justify-between">
              <div>
                <p className="text-xs text-mist font-medium">Order #{order.number}</p>
                <h3 className="font-display text-lg text-ink">
                  {order.status === "ready" ? "Your order is ready!" :
                   order.status === "cooking" ? "On the fire" : "Order sent"}
                </h3>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-soft flex items-center justify-center text-mist">✕</button>
            </div>

            <div className="px-5 py-5">
              {/* Progress */}
              <div className="flex items-center gap-1 mb-6">
                {steps.map((s, i) => (
                  <React.Fragment key={s.key}>
                    <div className={`flex-1 h-1.5 rounded-full ${i <= idx ? "bg-tomato" : "bg-soft"}`} />
                  </React.Fragment>
                ))}
              </div>

              <div className="space-y-2 mb-5">
                {order.items.map(it => (
                  <div key={it.id} className="flex justify-between text-sm">
                    <span className="text-ink">{it.qty}× {it.name}</span>
                    <span className="text-mist">{formatPrice(it.price * it.qty)}</span>
                  </div>
                ))}
              </div>

              <div className="flex justify-between font-semibold text-ink border-t border-wood/10 pt-3">
                <span>Total</span>
                <span>{formatPrice(order.total)}</span>
              </div>

              {order.status === "ready" && (
                <p className="mt-4 text-center text-sm text-tomato font-medium">
                  Come pick it up at the counter 🍕
                </p>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ===================== MAIN APP =====================
    function App() {
      const [category, setCategory] = useState("Pizzas");
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);
      const [showBuilder, setShowBuilder] = useState(false);
      const [toast, setToast] = useState(null);
      const [placing, setPlacing] = useState(false);
      const [activeOrder, setActiveOrder] = useState(null);
      const [tableLabel, setTableLabel] = useState(() => {
        try {
          const q = new URLSearchParams(window.location.search);
          return q.get("table") || "Preview";
        } catch { return "Preview"; }
      });

      const filtered = useMemo(() => {
        if (category === "Build Your Own") return MENU.filter(m => m.isBuilder);
        return MENU.filter(m => m.category === category);
      }, [category]);

      const cartCount = cart.reduce((s, i) => s + i.qty, 0);
      const cartTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);

      const showToast = useCallback((msg) => setToast(msg), []);

      const addToCart = (item) => {
        setCart(prev => {
          // For custom pizzas always add new line
          if (item.menuId === "build-your-own" || item.id.startsWith("build-")) {
            return [...prev, { ...item, id: item.id || uid() }];
          }
          const existing = prev.find(p => p.menuId === item.id && !p.note);
          if (existing) {
            return prev.map(p => p.id === existing.id ? { ...p, qty: p.qty + 1 } : p);
          }
          return [...prev, {
            id: uid(),
            menuId: item.id,
            name: item.name,
            description: item.description,
            price: item.price,
            qty: 1,
            image: item.image,
            note: null
          }];
        });
        showToast(`${item.name} added`);
      };

      const updateQty = (id, qty) => {
        if (qty < 1) {
          setCart(prev => prev.filter(i => i.id !== id));
          return;
        }
        setCart(prev => prev.map(i => i.id === id ? { ...i, qty } : i));
      };

      const updateNote = (id, note) => {
        setCart(prev => prev.map(i => i.id === id ? { ...i, note: note || null } : i));
      };

      const removeItem = (id) => setCart(prev => prev.filter(i => i.id !== id));

      const placeOrder = async () => {
        if (!cart.length) return;
        setPlacing(true);
        // Simulate order placement (later: Supabase)
        await new Promise(r => setTimeout(r, 900));
        const order = {
          number: Math.floor(100 + Math.random() * 900),
          items: [...cart],
          total: cartTotal,
          status: "sent",
          table: tableLabel,
          createdAt: Date.now()
        };
        setActiveOrder(order);
        setCart([]);
        setShowCart(false);
        setPlacing(false);
        showToast("Order sent to kitchen!");

        // Demo: auto progress status
        setTimeout(() => setActiveOrder(o => o ? { ...o, status: "cooking" } : null), 4000);
        setTimeout(() => setActiveOrder(o => o ? { ...o, status: "ready" } : null), 9000);
      };

      return (
        <div className="min-h-screen pb-28">
          {/* Header */}
          <header className="sticky top-0 z-30 glass border-b border-wood/10">
            <div className="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
              <div>
                <h1 className="font-display text-xl text-ink tracking-tight">Jordan's Pizza</h1>
                <p className="text-[11px] text-mist font-medium">
                  {tableLabel === "Preview" ? "Menu preview" : `Table ${tableLabel}`}
                </p>
              </div>
              <div className="flex items-center gap-2">
                {activeOrder && (
                  <button onClick={() => setActiveOrder(activeOrder)}
                    className="text-xs font-semibold px-3 py-1.5 rounded-full bg-soft text-tomato-deep border border-tomato/20">
                    Order #{activeOrder.number}
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Categories */}
          <div className="sticky top-[57px] z-20 bg-parchment/95 backdrop-blur border-b border-wood/8">
            <div className="max-w-lg mx-auto px-3 py-2.5 flex gap-1.5 overflow-x-auto no-scrollbar">
              {CATEGORIES.map(cat => (
                <button key={cat} onClick={() => setCategory(cat)}
                  className={`flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium transition ${
                    category === cat
                      ? "bg-tomato text-white shadow-sm"
                      : "bg-white text-mist border border-wood/10 hover:border-tomato/30"
                  }`}>
                  {cat}
                </button>
              ))}
            </div>
          </div>

          {/* Menu grid */}
          <main className="max-w-lg mx-auto px-4 py-5">
            <div className="grid grid-cols-2 gap-3">
              {filtered.map(item => (
                <div key={item.id} className="wood-card overflow-hidden flex flex-col">
                  <div className="aspect-[4/3] bg-soft overflow-hidden">
                    <img src={item.image} alt={item.name} className="w-full h-full object-cover" loading="lazy" />
                  </div>
                  <div className="p-3 flex flex-col flex-1">
                    <div className="flex-1">
                      <h3 className="font-semibold text-ink text-sm leading-snug">{item.name}</h3>
                      <p className="text-[11px] text-mist mt-1 line-clamp-2">{item.description}</p>
                      {item.tags?.length > 0 && (
                        <div className="flex flex-wrap gap-1 mt-1.5">
                          {item.tags.map(t => (
                            <span key={t} className="text-[9px] font-semibold uppercase tracking-wide px-1.5 py-0.5 rounded bg-soft text-tomato-deep">
                              {t}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                    <div className="flex items-center justify-between mt-3 pt-2">
                      <span className="font-semibold text-ink text-sm">{formatPrice(item.price)}</span>
                      {item.isBuilder ? (
                        <button onClick={() => setShowBuilder(true)}
                          className="px-3 py-1.5 rounded-xl bg-tomato text-white text-xs font-semibold hover:bg-tomato-deep transition">
                          Build
                        </button>
                      ) : (
                        <button onClick={() => addToCart(item)}
                          className="w-8 h-8 rounded-xl bg-tomato text-white flex items-center justify-center text-lg font-medium hover:bg-tomato-deep transition">
                          +
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* Floating cart bar */}
          {cartCount > 0 && (
            <div className="fixed bottom-0 left-0 right-0 z-40 p-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
              <button onClick={() => setShowCart(true)}
                className="max-w-lg mx-auto w-full flex items-center justify-between bg-wood-deep text-cream px-5 py-3.5 rounded-2xl shadow-wood-lg">
                <div className="flex items-center gap-3">
                  <span className="bg-tomato text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center">
                    {cartCount}
                  </span>
                  <span className="font-medium text-sm">View order</span>
                </div>
                <span className="font-display text-lg">{formatPrice(cartTotal)}</span>
              </button>
            </div>
          )}

          {/* Modals */}
          {showBuilder && (
            <BuilderModal
              onClose={() => setShowBuilder(false)}
              onAdd={(item) => {
                addToCart(item);
                setShowBuilder(false);
              }}
            />
          )}

          {showCart && (
            <CartDrawer
              items={cart}
              onClose={() => setShowCart(false)}
              onUpdateQty={updateQty}
              onUpdateNote={updateNote}
              onRemove={removeItem}
              onPlaceOrder={placeOrder}
              placing={placing}
            />
          )}

          {activeOrder && (
            <OrderStatus order={activeOrder} onClose={() => setActiveOrder(null)} />
          )}

          {toast && <Toast message={toast} onDone={() => setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
