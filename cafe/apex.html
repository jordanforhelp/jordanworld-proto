                        : "bg-blush text-mist cursor-not-allowed opacity-60"
                    }`}
                  >
                    {placing ? "Sending…" : `Place Order · ${formatPrice(total)}`}
                  </button>
                  <button
                    type="button"
                    onClick={() => { setItems([]); showToast("Session cleared"); }}
                    className="w-full py-1.5 text-mist text-xs hover:text-ink transition text-center"
                  >
                    Clear Session
                  </button>
                </div>
              </div>
            )}
          </div>
        </>
      );
    };

    const BrokenLinkView = ({ linkError, onBrowseMenu }) => {
      const [showStaffGuide, setShowStaffGuide] = useState(false);
      return (
        <div className="min-h-screen bg-blush flex flex-col justify-between p-4 sm:p-6 text-center select-none animate-fade-up">
          <div className="pt-6 sm:pt-10 max-w-md mx-auto w-full">
            <p className="text-pink tracking-[0.3em] uppercase text-xs font-semibold mb-2">BOBA Café</p>
            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-900 border border-amber-200">
              <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse" />
              Invalid or Expired Table Link
            </span>
          </div>

          <div className="max-w-md mx-auto w-full glass-strong rounded-3xl p-6 sm:p-8 border border-pink/15 shadow-float my-6">
            <div className="w-20 h-20 mx-auto mb-5 rounded-2xl bg-pink-soft flex items-center justify-center border border-pink/20 shadow-sm text-pink">
              <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </div>

            <h1 className="font-display text-2xl sm:text-3xl text-ink font-bold mb-2">
              We Couldn't Connect Your Table
            </h1>
            <p className="text-mist text-sm leading-relaxed mb-6">
              The table link you opened is invalid, expired, or was rotated by staff.
              {linkError?.tableNo ? (
                <span className="block mt-2 text-xs text-ink/90 font-mono bg-pink-soft/80 py-1.5 px-3 rounded-lg border border-pink/15">
                  Table {linkError.tableNo} is not active in the café system.
                </span>
              ) : linkError?.rawToken ? (
                <span className="block mt-2 text-xs text-mist font-mono truncate bg-pink-soft/80 py-1.5 px-3 rounded-lg border border-pink/15">
                  Code: {linkError.rawToken}
                </span>
              ) : null}
            </p>

            <div className="space-y-3">
              <button
                type="button"
                onClick={onBrowseMenu}
                className="w-full py-3.5 px-4 rounded-xl bg-pink text-white font-semibold text-sm hover:bg-pink-deep transition shadow-sm flex items-center justify-center gap-2">
                <Icon name="book-open" size={16} />
                Browse Menu (Preview Mode)
              </button>

              <button
                type="button"
                onClick={() => setShowStaffGuide(prev => !prev)}
                className="w-full py-3 px-4 rounded-xl bg-white border border-pink/20 text-ink text-sm font-medium hover:bg-pink-soft/50 transition flex items-center justify-center gap-1.5">
                <Icon name="help-circle" size={16} className="text-pink" />
                {showStaffGuide ? "Hide Ordering Guide" : "How to Order at Your Table"}
              </button>
            </div>

            {showStaffGuide && (
              <div className="mt-5 p-4 rounded-2xl bg-pink-soft/50 border border-pink/15 text-left text-xs text-mist space-y-2 animate-fade-up">
                <p className="font-semibold text-ink text-xs mb-1">Simple steps to order:</p>
                <p>1. Check the acrylic table stand on your table for the BOBA Café QR code sticker.</p>
                <p>2. Open your smartphone camera or scanner and point at the QR code.</p>
                <p>3. If your table has no sticker or the link still fails, please ask any staff member at the counter — they can generate a fresh QR code in seconds.</p>
              </div>
            )}
          </div>

          <div className="pb-6 text-center text-xs text-mist/60 font-medium">
            BOBA Café · Authentic Artisanal Boba & Teas
          </div>
        </div>
      );
    };

    const CustomerView = ({ dishes, sessionItems, setSessionItems, showToast, onStaffAccess, onPlaceOrder, tableFromQr, pinFromQr, tablePins, snakeDiscount, isPreviewMode }) => {
      const [filter, setFilter] = useState("All");
      const [tableNumber, setTableNumber] = useState(tableFromQr || "");
      const loadDiningGuest = (tableHint) => {
        try {
          const tkey = String(tableHint || "").replace(/^0+/, "") || String(tableHint || "");
          if (!tkey) return null;
          const raw = localStorage.getItem("boba_dining_" + tkey);
          if (!raw) return null;
          const g = JSON.parse(raw);
          // Keep active as long as within valid visit window (90 mins idle limit)
          if (g && String(g.table || tkey) === String(tkey)) {
            if (!g.exp || Date.now() < g.exp) return g;
          }
          localStorage.removeItem("boba_dining_" + tkey);
          return null;
        } catch { return null; }
      };
      const saveDiningGuest = (g, tableKey, sessionId) => {
        const tk = String(tableKey || g.table || "").replace(/^0+/, "") || String(tableKey || g.table || "");
        const payload = {
          ...g,
          table: tk,
          sessionId: sessionId || g.sessionId || null,
          exp: Date.now() + 90 * 60 * 1000, // 90 minutes dining visit TTL (refreshed while active)
        };
        try {
          if (tk) localStorage.setItem("boba_dining_" + tk, JSON.stringify(payload));
          try { localStorage.removeItem("boba_dining_any"); } catch (e) {}
        } catch {}
        return payload;
      };
      const [guest, setGuest] = useState(() => loadDiningGuest(typeof window !== "undefined" ? (new URLSearchParams(window.location.search).get("table") || "") : ""));
      const [activeCloudSession, setActiveCloudSession] = useState(null);
      const [shownTableOtp, setShownTableOtp] = useState(() => {
        try {
          const tk = String(tableFromQr || (typeof window !== "undefined" ? (new URLSearchParams(window.location.search).get("table") || "") : "")).replace(/^0+/, "");
          return (tk && typeof localStorage !== "undefined" ? (localStorage.getItem("boba_table_otp_" + tk) || "") : "");
        } catch (e) { return ""; }
      });
      const guestRef = useRef(guest);
      guestRef.current = guest;

      const handleTableClearedNotice = useCallback((tk) => {
        setGuest(null);
        setShownTableOtp("");
        setOrderHistory([]);
        setSessionItems([]);
        setActiveCloudSession(null);
        try {
          localStorage.removeItem("boba_dining_" + tk);
          localStorage.removeItem("boba_table_otp_" + tk);
          localStorage.removeItem("boba_history_" + tk);
          localStorage.removeItem("boba_dining_any");
        } catch (e) {}
        showToast("Table bill was settled. Table " + tk + " is now free. Thank you for dining with BOBA!");
      }, [showToast]);

      // Instant sync: Listen for table status updates + 5s background poll so open tabs know immediately when table is paid
      React.useEffect(() => {
        let cancelled = false;
        const tk = String(tableFromQr || "").replace(/^0+/, "");
        if (!tk) {
          setGuest(null);
          setShownTableOtp("");
          setActiveCloudSession(null);
          return;
        }

        const pollSession = async () => {
          if (!sb) return;
          try {
            const open = await cloudGetOpenSession(tk);
            if (cancelled) return;
            setActiveCloudSession(open);
            if (!open) {
              if (guestRef.current && String(guestRef.current.table || "") === String(tk)) {
                handleTableClearedNotice(tk);
              } else {
                setGuest(null);
                setShownTableOtp("");
                try {
                  localStorage.removeItem("boba_dining_" + tk);
                  localStorage.removeItem("boba_table_otp_" + tk);
                  localStorage.removeItem("boba_history_" + tk);
                } catch (e) {}
              }
            } else {
              // Open session: refresh local guest if matching
              const g = loadDiningGuest(tk);
              if (g && String(g.table || "") === String(tk)) {
                if (g.sessionId && open.id && g.sessionId !== open.id) {
                  // Table was cleared and reopened under a new session
                  handleTableClearedNotice(tk);
                  return;
                }
                g.sessionId = open.id;
                g.exp = Date.now() + 90 * 60 * 1000;
                try { localStorage.setItem("boba_dining_" + tk, JSON.stringify(g)); } catch (e) {}
                setGuest(g);
                const local = String(g.joinCode || g.tableOtp || "").replace(/\D/g, "")
                  || String((() => { try { return localStorage.getItem("boba_table_otp_" + tk) || ""; } catch (e) { return ""; } })()).replace(/\D/g, "");
                if (local) {
                  setShownTableOtp(local);
                }
              }
            }
          } catch (e) {
            console.warn("pollSession error:", e);
          }
        };

        pollSession();
        const pollId = setInterval(pollSession, 5000);

        let channel = null;
        if (sb) {
          try {
            channel = sb.channel("guest-table-watch-" + tk)
              .on("postgres_changes", { event: "*", schema: "public", table: "boba_table_sessions" }, (payload) => {
                if (payload.new && String(payload.new.table_no) === tk) {
                  if (payload.new.status === "paid" || payload.new.status === "closed" || payload.new.status === "cancelled") {
                    handleTableClearedNotice(tk);
                  } else if (payload.new.status === "open") {
                    setActiveCloudSession(payload.new);
                  }
                }
              })
              .subscribe();
          } catch (e) {}
        }

        return () => {
          cancelled = true;
          clearInterval(pollId);
          if (channel && sb) sb.removeChannel(channel);
        };
      }, [tableFromQr, handleTableClearedNotice]);

      const [showGuestGate, setShowGuestGate] = useState(false);
      const [gateName, setGateName] = useState("");
      const [gateJoinCode, setGateJoinCode] = useState("");
      const [needJoinOtp, setNeedJoinOtp] = useState(false);
      const [gateError, setGateError] = useState("");
      const [gatePhone, setGatePhone] = useState("");
      const [loginBusy, setLoginBusy] = useState(false);
      const pendingPlace = useRef(null);
      const [search, setSearch] = useState("");
      const [pairingDish, setPairingDish] = useState(null);
      const [variantDish, setVariantDish] = useState(null);
      const [cartOpen, setCartOpen] = useState(false);
      const [cartTab, setCartTab] = useState("cart");
      const [showSnake, setShowSnake] = useState(false);
      const [orderBurst, setOrderBurst] = useState(false);
      const [badgePulse, setBadgePulse] = useState(false);
      const [headerScrolled, setHeaderScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setHeaderScrolled(window.scrollY > 24);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      const [orderHistory, setOrderHistory] = useState(() => {
        try {
          const t = (tableFromQr || "").toString();
          const key = "boba_history_" + (t || "guest");
          return JSON.parse(localStorage.getItem(key) || "[]");
        } catch { return []; }
      });
      const pushHistory = (items, tableLabel, extra) => {
        const entry = {
          id: (extra && extra.roundId) ? String(extra.roundId) : ("H-" + Date.now()),
          roundId: extra && extra.roundId ? String(extra.roundId) : null,
          table: String(tableLabel),
          orderedBy: (extra && extra.orderedBy) || (guest && guest.name) || null,
          items: items.map(i => ({
            name: i.name,
            variantLabel: i.variantLabel || null,
            qty: i.qty,
            price: i.price,
            note: i.note || null,
          })),
          total: items.reduce((s, i) => s + i.price * i.qty, 0),
          status: (extra && extra.status) || "new",
          at: new Date().toISOString(),
        };
        setOrderHistory(prev => {
          const next = [entry, ...prev.filter(h => String(h.id) !== String(entry.id) && String(h.roundId || "") !== String(entry.roundId || ""))].slice(0, 40);
          try {
            localStorage.setItem("boba_history_" + (String(tableLabel) || "guest"), JSON.stringify(next));
          } catch {}
          return next;
        });
      };

      // History is only for the *current* open table session.
      // When staff marks Paid, clear table, session closes → wipe local history.
      const clearLocalHistory = useCallback((tableLabel) => {
        const t = String(tableLabel || tableFromQr || "guest").replace(/^0+/, "") || String(tableLabel || tableFromQr || "guest");
        setOrderHistory([]);
        setShownTableOtp("");
        setGuest(null);
        saveSnakeReward(null); // bill paid / session closed — end visit discount
        try {
          localStorage.removeItem("boba_history_" + t);
          localStorage.removeItem("boba_history_guest");
          localStorage.removeItem("boba_dining_" + t);
          localStorage.removeItem("boba_table_otp_" + t);
          localStorage.removeItem("boba_dining_any");
        } catch {}
      }, [tableFromQr]);

      const syncHistoryWithSession = useCallback(async () => {
        const tk = String(tableFromQr || "").replace(/^0+/, "") || String(tableFromQr || "");
        if (!tk || !sb) return;
        // Only members who logged in / joined this table on THIS phone can see shared history
        const g = guest && guest.exp && Date.now() < guest.exp && String(guest.table || "") === String(tk) ? guest : loadDiningGuest(tk);
        if (!g || !g.phone) {
          setOrderHistory([]);
          return;
        }
        try {
          const open = await cloudGetOpenSession(tk);
          if (!open) {
            // Staff cleared table — wipe local login + history so home spam is harder
            clearLocalHistory(tk);
            setGuest(null);
            setShownTableOtp("");
            try {
              localStorage.removeItem("boba_dining_" + tk);
              localStorage.removeItem("boba_table_otp_" + tk);
            } catch (e) {}
            return;
          }
          const list = await cloudFetchTableHistory(tk);
          setOrderHistory(list || []);
          try { localStorage.setItem("boba_history_" + tk, JSON.stringify(list || [])); } catch (e) {}

          const isSnakeOn = Boolean(snakeDiscount && snakeDiscount.enabled);
          const localR = isSnakeOn ? loadSnakeReward() : null;
          const localPct = localR && localR.percent ? Number(localR.percent) : 0;
          const sessionPct = Number((open && open.discount_percent) || 0);
          const maxPct = Math.max(sessionPct, localPct);
          if (isSnakeOn && maxPct > 0 && open && sessionPct < maxPct) {
            cloudApplySessionDiscount(tk, maxPct).then(() => {
              cloudGetOpenSession(tk).then(fresh => {
                if (fresh) setActiveCloudSession(fresh);
                cloudFetchTableHistory(tk).then(reloaded => {
                  if (reloaded) setOrderHistory(reloaded);
                }).catch(() => {});
              }).catch(() => {});
            }).catch(() => {});
          }
        } catch (e) {
          console.error("history sync", e);
        }
      }, [tableFromQr, clearLocalHistory, guest, snakeDiscount]);

      useEffect(() => {
        syncHistoryWithSession();
        const id = setInterval(syncHistoryWithSession, 4000);
        return () => clearInterval(id);
      }, [syncHistoryWithSession]);

      useEffect(() => {
        if (cartOpen) syncHistoryWithSession();
      }, [cartOpen, syncHistoryWithSession]);

      // Live updates when anyone at the table orders
      useEffect(() => {
        if (!sb || !tableFromQr) return;
        const tk = String(tableFromQr).replace(/^0+/, "") || String(tableFromQr);
        const ch = sb.channel("table-hist-" + tk)
          .on("postgres_changes", { event: "*", schema: "public", table: "boba_order_rounds" }, () => {
            syncHistoryWithSession();
          })
          .on("postgres_changes", { event: "*", schema: "public", table: "boba_table_sessions" }, () => {
            syncHistoryWithSession();
          })
          .subscribe();
        return () => { try { sb.removeChannel(ch); } catch (e) {} };
      }, [tableFromQr, syncHistoryWithSession]);

      const filtered = useMemo(() => {
        let list = dishes.filter(d => d.visible);
        if (filter !== "All") list = list.filter(d => d.category === filter);
        if (search.trim()) {
          const q = search.toLowerCase();
          list = list.filter(d => d.name.toLowerCase().includes(q));
        }
        const catOrder = { "Milk Tea": 1, "Fruit Tea": 2, "Signature": 3, "Slush & Smoothies": 4, "Pure Tea": 5, "Coffee": 6, "Toppings": 7, "Snacks": 8 };
        return [...list].sort((a, b) => {
          const ca = catOrder[a.category] || 50;
          const cb = catOrder[b.category] || 50;
          if (ca !== cb) return ca - cb;
          return (a.sortOrder || 99) - (b.sortOrder || 99);
        });
      }, [dishes, filter, search]);

      const total = sessionItems.reduce((s, i) => s + i.price * i.qty, 0);
      const itemCount = sessionItems.reduce((s, i) => s + i.qty, 0);

      const addToSession = (item) => {
        const key = item.variantLabel ? `${item.id}::${item.variantLabel}` : String(item.id);
        setSessionItems(prev => {
          const existing = prev.find(i => (i.sessionKey || String(i.id)) === key);
          if (existing) return prev.map(i => (i.sessionKey || String(i.id)) === key ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { ...item, sessionKey: key, qty: 1 }];
        });
        setBadgePulse(true);
        setTimeout(() => setBadgePulse(false), 400);
        const label = item.variantLabel ? `${item.name} (${item.variantLabel})` : item.name;
        showToast(`${label} added`);
      };

      const handleAdd = (dish) => {
        if (!tableFromQr) {
          showToast("Scan the QR on your table to order");
          return;
        }
        if (!isRegisteredTable(tableFromQr, tablePins)) {
          showToast("Invalid table. Scan the official QR on your table.");
          return;
        }
        if (dish.variants && dish.variants.length > 0) {
          setVariantDish(dish);
          return;
        }
        addToSession(dish);
      };

      const handleVariantPick = (variant) => {
        if (!variantDish) return;
        addToSession({
          ...variantDish,
          price: variant.price,
          variantLabel: variant.label,
          name: variantDish.name,
        });
        setVariantDish(null);
      };

      return (
        <div className="min-h-screen ambient-bg pb-10" style={{ paddingBottom: "max(2.5rem, calc(env(safe-area-inset-bottom) + 1.5rem))" }}>
          <header className="relative pt-10 pb-10 px-4 overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(186,107,37,0.08)_0%,_transparent_55%)]" />
            <div className="relative max-w-5xl mx-auto text-center">
              <p className="text-pink tracking-[0.3em] uppercase text-xs font-medium mb-3">Boba Café</p>
              <h1 className="font-display text-5xl md:text-7xl text-ink tracking-tight">BOBA</h1>
              {tableFromQr && !isRegisteredTable(tableFromQr, tablePins) ? (
                <div className="mt-5 max-w-md mx-auto rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 text-left">
                  <strong>Table {tableFromQr}</strong> is not valid. Do not change the link — scan the QR on your table.
                </div>
              ) : tableFromQr ? (
                <div className="mt-5 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-pink-soft border border-pink/25">
                  <span className="w-2 h-2 rounded-full bg-pink" />
                  <span className="text-pink text-sm font-medium">Table {tableFromQr}</span>
                  {(() => {
                    const tk = String(tableFromQr || "").replace(/^0+/, "") || String(tableFromQr || "");
                    const otp = shownTableOtp || (typeof localStorage !== "undefined" && tk ? localStorage.getItem("boba_table_otp_" + tk) : "") || "";
                    return otp ? (
                      <span className="ml-2 inline-flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded-full bg-pink text-white shadow-sm">
                        Table OTP {otp}
                      </span>
                    ) : null;
                  })()}
                </div>
              ) : (
                <div className="mt-5 max-w-sm mx-auto px-3">
                  {isPreviewMode ? (
                    <div className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-amber-50 border border-amber-200 text-amber-900 text-xs font-medium">
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-600" />
                      Menu Preview Mode · Scan your table QR to place orders
                    </div>
                  ) : (
                    <p className="text-mist text-sm leading-relaxed">
                      Scan the <span className="text-pink font-medium">QR code on your table</span> to order.
                    </p>
                  )}
                </div>
              )}

              {/* Friend Join Banner: When session is active on this table but current phone hasn't joined yet */}
              {tableFromQr && activeCloudSession && !shownTableOtp && (
                <div className="mt-4 max-w-md mx-auto p-3.5 rounded-2xl bg-white border border-pink/30 shadow-card flex items-center justify-between gap-3 text-left animate-fade-up">
                  <div className="min-w-0">
                    <p className="text-ink font-semibold text-xs flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                      Table {tableFromQr} is active
                    </p>
                    <p className="text-mist text-[11px] truncate mt-0.5">
                      {activeCloudSession.guest_name ? `Started by ${activeCloudSession.guest_name}. ` : ""}Join to add items together.
                    </p>
                  </div>
                  <button type="button" onClick={() => { setNeedJoinOtp(true); setGateError(""); setShowGuestGate(true); }}
                    className="shrink-0 px-3.5 py-1.5 rounded-xl bg-pink text-white text-xs font-semibold hover:bg-pink-deep transition shadow-sm">
                    Enter Code
                  </button>
                </div>
              )}
            </div>
          </header>

          <div className={`sticky top-0 z-40 glass border-y border-pink/10 sticky-search ${headerScrolled ? "scrolled" : ""}`}>
            <div className="max-w-6xl mx-auto px-4 py-3">
              <div className="flex items-center gap-2">
                <div className="relative flex-1 min-w-0">
                  <Icon name="search" size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mist pointer-events-none" aria-hidden="true" />
                  <input type="search" placeholder="Search drinks & snacks…" value={search} onChange={e => setSearch(e.target.value)}
                    className="w-full min-h-[44px] bg-white border border-pink/15 rounded-2xl pl-11 pr-4 text-[15px] leading-5 text-ink placeholder:text-mist/50 focus:outline-none focus:border-pink/40 transition"
                    aria-label="Search menu" autoComplete="off" />
                </div>
                <button type="button" onClick={() => { setCartTab("cart"); setCartOpen(true); }}
                  className={`relative shrink-0 glass-strong rounded-2xl min-h-[44px] min-w-[44px] px-3 flex items-center justify-center border border-pink/25 hover:border-pink/50 transition ${badgePulse ? "animate-bounce-soft" : ""}`}
                  aria-label={itemCount ? `Cart, ${itemCount} items` : "Open cart"}>
                  <Icon name="shopping-bag" size={20} className="text-pink" />
                  {itemCount > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-pink text-white text-[10px] font-bold flex items-center justify-center">{itemCount}</span>
                  )}
                </button>
              </div>
            </div>
          </div>
          <div className="max-w-6xl mx-auto px-4 pt-3 pb-1">
            <div className="flex gap-2 overflow-x-auto pb-1" role="tablist" aria-label="Menu categories">
              {CATEGORIES.map(cat => (
                <button key={cat} role="tab" aria-selected={filter === cat} onClick={() => setFilter(cat)}
                  className={`px-5 min-h-[44px] rounded-full text-[15px] font-medium whitespace-nowrap transition-colors duration-200 ${
                    filter === cat ? "bg-pink text-white" : "text-mist hover:text-ink hover:bg-white"
                  }`}>{cat}</button>
              ))}
            </div>
          </div>

          <main className="max-w-6xl mx-auto px-4 py-8">
            <div className="flex items-center justify-between mb-4">
              <p className="text-sm text-mist">{filtered.length} item{filtered.length !== 1 ? "s" : ""}</p>
              {(search || filter !== "All") && (
                <button onClick={() => { setSearch(""); setFilter("All"); }} className="text-xs text-pink hover:underline">Clear filters</button>
              )}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 items-stretch" key={filter}>
              {filtered.map((dish, i) => (
                <MenuCard key={dish.id} dish={dish} onAdd={handleAdd} onPair={setPairingDish} sessionItems={sessionItems} index={i} />
              ))}
            </div>
            {filtered.length === 0 && (
              <div className="text-center py-20">
                <Icon name="search" size={36} className="text-mist/40 mx-auto mb-3" />
                <p className="text-mist">No items match your filters.</p>
                <button onClick={() => { setSearch(""); setFilter("All"); }} className="mt-3 text-pink text-sm hover:underline">Reset all filters</button>
              </div>
            )}
          </main>
          <CartDrawer open={cartOpen} onClose={() => { setCartOpen(false); setCartTab("cart"); }} items={sessionItems} setItems={setSessionItems}
            orderHistory={orderHistory} cartTab={cartTab} setCartTab={setCartTab}
            snakeDiscount={snakeDiscount}
            tableDiscountPercent={Number((activeCloudSession && activeCloudSession.discount_percent) || 0)}
            onOrderPlaced={(items, tableLabel, res) => pushHistory(items, tableLabel, {
              orderedBy: (res && res.orderedBy) || (guest && guest.name) || null,
              roundId: res && res.roundId,
              status: "new",
            })}
            onPlaySnake={Boolean(snakeDiscount && snakeDiscount.enabled) ? () => { setCartOpen(false); setCartTab("cart"); setShowSnake(true); } : null}
            onOrderCelebrate={() => { setOrderBurst(true); }}
            onNeedJoin={() => {
              setNeedJoinOtp(true);
              setGateError("");
              setGateJoinCode("");
              setShowGuestGate(true);
            }}
            onPlaceOrder={(items, tableLabel, disc) => {
              const tkey = String(tableLabel || "").replace(/^0+/, "") || String(tableLabel);
              let saved = null;
              if (guest && guest.exp && Date.now() < guest.exp && String(guest.table || "") === String(tkey)) {
                saved = guest;
              } else {
                saved = loadDiningGuest(tkey);
              }
              if (saved && saved.phone && saved.exp && Date.now() < saved.exp && String(saved.table || "") === String(tkey)) {
                // If table was cleared (activeCloudSession is null) or saved is from a different session, force fresh login
                if (activeCloudSession === null || (saved.sessionId && activeCloudSession && saved.sessionId !== activeCloudSession.id)) {
                  handleTableClearedNotice(tkey);
                  pendingPlace.current = { items, tableLabel: tkey, disc };
                  setNeedJoinOtp(false);
                  setGateJoinCode("");
                  setGateError("");
                  setShowGuestGate(true);
                  return false;
                }
                if (!guest || String(guest.table) !== String(tkey)) setGuest(saved);
                return Promise.resolve(onPlaceOrder(items, tkey, saved, disc)).then(res => {
                  if (res && res.joinCode) {

    function playStaffChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.value = 0.08;
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        o.stop(ctx.currentTime + 0.4);
        setTimeout(() => ctx.close(), 500);
      } catch {}
    }

    const OwnerView = ({ dishes, setDishes, recommendations, setRecommendations, liveOrders = [], updateRoundStatus, updateRoundItems, clearTable, cancelRound, tablePins = {}, setTablePins, onLogout, showToast, onReset, onRefreshOrders, snakeDiscount, setSnakeDiscount }) => {

      const recalculateRoundWithFixedDiscount = (rawItems, sessionTable) => {
        const regularItems = (rawItems || []).filter(it => String(it.id) !== "snake-discount");
        const session = (liveOrders || []).find(s => String(s.table) === String(sessionTable));
        let pct = Number((session && session.discountPercent) || 0);
        if (!pct) {
          const prevDisc = (rawItems || []).find(it => String(it.id) === "snake-discount");
          if (prevDisc) {
            const m = String(prevDisc.name || "").match(/(\d+)%/);
            if (m) pct = Number(m[1]);
          }
        }
        const subtotal = regularItems.reduce((s, it) => s + (Number(it.price) * (Number(it.qty) || 1)), 0);
        if (pct > 0 && subtotal > 0) {
          const off = Math.round(subtotal * (pct / 100));
          const total = Math.max(0, subtotal - off);
          const discItem = {
            id: "snake-discount",
            name: `Snake reward (${pct}% off)`,
            variantLabel: null,
            price: -off,
            qty: 1
          };
          return { items: [...regularItems, discItem], total };
        }
        return { items: regularItems, total: subtotal };
      };

      const requestItemQtyChange = (sessionTable, round, itemIndex, delta) => {

        const unitPrice = Number(item.price) || 0;

        if (newQty <= 0) {
          requestRemoveItem(sessionTable, round, itemIndex);
          return;
        }

        const rawUpdated = items.map((it, idx) => idx === itemIndex ? { ...it, qty: newQty } : it);

        const deltaPrice = (newQty - currentQty) * unitPrice;

        setConfirmOrderModal({

        const rawUpdated = items.filter((_, i) => i !== itemIndex);
        const regularOnly = rawUpdated.filter(it => String(it.id) !== "snake-discount");
        const isLastItem = regularOnly.length === 0;
        const unitPrice = Number(item.price) || 0;
        const qty = Number(item.qty) || 1;
        const itemTotal = unitPrice * qty;
        const { items: newItems, total: newTotal } = recalculateRoundWithFixedDiscount(rawUpdated, sessionTable);

          itemName: item.name,

      const performRotate = async (tableNo) => {
        const confirmed = window.confirm(
          "Are you sure you want to rotate Table " + tableNo + "'s QR code?\n\nWARNING: The old QR code will stop working immediately. You will need to print and replace the physical QR sticker on Table " + tableNo + "."
        );
        if (!confirmed) return;
        try {
          const res = await cloudRotateQrToken(tableNo);
          if (res && res.qr_token) {
            setTableQrTokens(prev => ({ ...prev, [String(tableNo)]: res.qr_token }));
            showToast("Table " + tableNo + " QR token rotated by Manager! Old links invalidated.");
          }
        } catch (e) {
          showToast("Rotate failed: " + (e.message || ""));
        }
      };

      const handleVerifyManagerForRotate = async () => {
        const pin = String(mgrAuthPin || "").trim();
        if (pin.length < MGR_PIN_LEN) {
          setMgrAuthModal(prev => prev ? ({ ...prev, error: "Enter 6-digit manager PIN" }) : null);
          return;
        }
        try {
          const res = await cloudStaffLogin(pin, "manager");
          if (res && res.success) {
            setMgrUnlocked(true);
            const targetTable = mgrAuthModal?.tableNo;
            setMgrAuthModal(null);
            setMgrAuthPin("");
            showToast("Manager verified");
            if (targetTable != null) {
              performRotate(targetTable);
            }
          } else {
            setMgrAuthModal(prev => prev ? ({ ...prev, error: "Incorrect manager PIN" }) : null);
          }
        } catch (e) {
          setMgrAuthModal(prev => prev ? ({ ...prev, error: (e.message || "Manager verification failed") }) : null);
        }
      };
      const [insightPeriod, setInsightPeriod] = useState("day");
      const [insights, setInsights] = useState(null);
      const [insightsLoading, setInsightsLoading] = useState(false);
      const [insightsError, setInsightsError] = useState("");
      const [revealedPhones, setRevealedPhones] = useState({});
      const QR_CACHE_KEY = "boba_table_qr_tokens_map";
      const [tableQrTokens, setTableQrTokens] = useState(() => {
        try {
          const raw = localStorage.getItem(QR_CACHE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch { return {}; }
      });
      const [activeQrModal, setActiveQrModal] = useState(null);

      const fetchQrTokens = useCallback(async () => {
        try {
          const list = await cloudGetTableQrTokens();
          if (Array.isArray(list) && list.length > 0) {
            const map = {};
            list.forEach(r => { if (r.table_no) map[String(r.table_no)] = r.qr_token; });
            setTableQrTokens(prev => {
              const updated = { ...prev, ...map };
              try { localStorage.setItem(QR_CACHE_KEY, JSON.stringify(updated)); } catch {}
              return updated;
            });
          }
        } catch (e) {
          console.warn("fetchQrTokens error:", e);
        }
      }, []);

      useEffect(() => {
        fetchQrTokens();
      }, [fetchQrTokens]);

      useEffect(() => {
        if (staffTab === "tables") {
          fetchQrTokens();
        }
      }, [staffTab, fetchQrTokens]);

      const getOrMakeTableToken = useCallback((n) => {
        const k = String(n);
        if (tableQrTokens && tableQrTokens[k]) return tableQrTokens[k];
        try {
          const cached = JSON.parse(localStorage.getItem(QR_CACHE_KEY) || "{}");
          if (cached[k]) return cached[k];
        } catch {}
        const fresh = generateTableToken(n);
        setTableQrTokens(prev => {
          const u = { ...(prev || {}), [k]: fresh };
          try { localStorage.setItem(QR_CACHE_KEY, JSON.stringify(u)); } catch {}
          return u;
        });
        cloudRotateQrToken(n).then(res => {
          if (res && res.qr_token) {
            setTableQrTokens(prev => {
              const u = { ...(prev || {}), [k]: res.qr_token };
              try { localStorage.setItem(QR_CACHE_KEY, JSON.stringify(u)); } catch {}
              return u;
            });
          }
        }).catch(() => {});
        return fresh;
      }, [tableQrTokens]);

      const downloadQrImage = async (tableNo, url) => {
        const qrImgUrl = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=" + encodeURIComponent(url);
        try {
          showToast("Downloading Table " + tableNo + " QR…");
          const res = await fetch(qrImgUrl);
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = blobUrl;
          link.download = "BOBA-Table-" + tableNo + "-QR.png";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
          showToast("Downloaded Table " + tableNo + " QR!");
        } catch (err) {
          const link = document.createElement("a");
          link.href = qrImgUrl;
          link.target = "_blank";
          link.download = "BOBA-Table-" + tableNo + "-QR.png";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast("Opened high-res QR for Table " + tableNo);
        }
      };

      const dishesRef = useRef(dishes);
      dishesRef.current = dishes;
      const insightsLoadingRef = useRef(false);

      // Manual / period / tab only — NOT on every menu sync (that was flickering charts every second)
      const loadInsights = useCallback(async (period) => {
        if (insightsLoadingRef.current) return;
        const p = period || insightPeriod;
        insightsLoadingRef.current = true;
        setInsightsLoading(true);
        setInsightsError("");
        try {
          const data = await cloudFetchInsights(p);
          const catMap = {};
          const dishById = Object.fromEntries((dishesRef.current || []).map(d => [d.id, d]));
          (data.rawRounds || []).filter(r => r.status && r.status !== "new").forEach(r => {
            (r.items || []).forEach(it => {
              const dish = dishById[it.id];
              const cat = (dish && dish.category) || "Other";
              const qty = it.qty || 1;
              catMap[cat] = (catMap[cat] || 0) + qty;
            });
          });
          const categoryEntries = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
          setInsights({
            ...data,
            categoryLabels: categoryEntries.map(e => e[0]),
            categoryValues: categoryEntries.map(e => e[1]),
          });
        } catch (e) {
          console.error(e);
          setInsightsError(e.message || "Failed to load insights");
        }
        insightsLoadingRef.current = false;
        setInsightsLoading(false);
      }, [insightPeriod]);

      useEffect(() => {
        if (staffTab === "insights" && mgrUnlocked) loadInsights(insightPeriod);
      }, [staffTab, mgrUnlocked, insightPeriod, loadInsights]);

      const handleRecAction = (rec, action) => {
        setRecommendations(prev => {
          const next = prev.map(r => r.id === rec.id ? { ...r, status: action } : r);
          saveState("boba_recs", next);
          return next;
        });
        if (action === "applied") {
          setDishes(prev => {
            let next = [...prev];
            if (rec.type === "positioning" && rec.dishId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, tags: d.tags.includes("Most Ordered") ? d.tags : [...d.tags, "Most Ordered"], sortOrder: 1 } : d);
            }
            if (rec.type === "pairing" && rec.dishId && rec.targetId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, pairWith: d.pairWith.includes(rec.targetId) ? d.pairWith : [...d.pairWith, rec.targetId] } : d);
            }
            if (rec.type === "timing" && rec.dishId) {
              next = next.map(d => d.id === rec.dishId ? { ...d, tags: d.tags.includes("Peak Feature") ? d.tags : [...d.tags, "Peak Feature"], sortOrder: 1 } : d);
            }
            saveState("boba_dishes", next);
            return next;
          });
          showToast(`Applied: ${rec.title}`);
        } else if (action === "dismissed") showToast("Recommendation dismissed");
        else showToast("A/B test scheduled");
      };

      const saveDish = (updated) => {
        _lastLocalMenuWriteAt = Date.now();
        const img = fixMenuImageUrl(updated.image || "");
        const payload = {
          ...updated,
          image: img,
          imageVisible: updated.imageVisible === true,
        };
        if (updated.id === null) {
          setDishes(prev => {
            const newId = Math.max(0, ...prev.map(d => d.id)) + 1;
            const dish = {
              ...payload,
              id: newId,
              tags: updated.tags || [],
              diet: updated.diet || [],
              margin: updated.margin ?? 50,
              ordersToday: 0,
              visible: true,
              pairWith: [],
              sortOrder: 99,
            };
            const next = [...prev, dish];
            saveState("boba_dishes", next);
            return next;
          });
          showToast(`"${updated.name}" added to menu`);
        } else {
          setDishes(prev => {
            const next = prev.map(d => d.id === updated.id ? { ...d, ...payload, id: updated.id } : d);
            saveState("boba_dishes", next);
            return next;
          });
          showToast("Item updated successfully");
        }
        setEditingDish(null);
      };

      const deleteDish = (id) => {
        const dish = dishes.find(d => d.id === id);
        if (!dish || !window.confirm(`Remove "${dish.name}" from the menu?`)) return;
        setDishes(prev => {
          const next = prev.filter(d => d.id !== id);
          saveState("boba_dishes", next);
          return next;
        });
        showToast(`"${dish.name}" removed`);
      };

      const openAddDish = () => setEditingDish({
        id: null, name: "", description: "", price: 0, category: "Milk Tea",
        image: "",
        tags: [], diet: ["Vegetarian"], margin: 50, ordersToday: 0, visible: true, imageVisible: false, soldOut: false, pairWith: [], sortOrder: 99,
      });

      const toggleVisible = (id) => {
        setDishes(prev => {
          const next = prev.map(x => x.id === id ? { ...x, visible: !x.visible } : x);
          saveState("boba_dishes", next);
          return next;
        });
      };

      const toggleImageVisible = (id) => {
        _lastLocalMenuWriteAt = Date.now();
        setDishes(prev => {
          const next = prev.map(x => x.id === id ? { ...x, imageVisible: !x.imageVisible } : x);
          saveState("boba_dishes", next);
          return next;
        });
      };

      const setAllPhotosVisible = (on) => {
        setDishes(prev => {
          const next = prev.map(x => ({
            ...x,
            imageVisible: on ? !!x.image : false,
          }));
          saveState("boba_dishes", next);
          return next;
        });
        showToast(on ? "All photos live on the menu" : "All photos hidden from the menu");
      };

      const toggleSoldOut = (id) => {
        setDishes(prev => {
          const next = prev.map(x => x.id === id ? { ...x, soldOut: !x.soldOut } : x);
          saveState("boba_dishes", next);
          return next;
        });
      };

      const handleImageUpload = (file) => {
        if (!file || !editingDish) return;
        if (!file.type.startsWith("image/") && file.type !== "image/gif") {
          showToast("Please choose an image or GIF");
          return;
        }
        if (file.size > 2.5 * 1024 * 1024) {
          showToast("Image too large. Keep under 2.5 MB.");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          setEditingDish(prev => prev ? { ...prev, image: String(reader.result || "") } : prev);
          showToast("Photo loaded. Save to apply.");
        };
        reader.onerror = () => showToast("Could not read file");
        reader.readAsDataURL(file);
      };

      return (
        <div className="min-h-screen ambient-bg pb-16">
          <div className="bg-pink/10 border-b border-pink/20 px-4 py-2 flex items-center justify-between">
            <div className="flex items-center gap-2 text-sm">
              <span className="w-2 h-2 rounded-full bg-pink animate-pulse" />
              <span className="text-pink font-medium">Staff Mode Active</span>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={onLogout} className="flex items-center gap-1.5 text-mist hover:text-ink text-sm transition">
                <Icon name="log-out" size={14} /> Logout
              </button>
            </div>
          </div>

          <header className="border-b border-pink/10 px-4 py-6">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h1 className="font-display text-3xl text-ink">Staff Portal</h1>
                <p className="text-mist text-sm mt-1">Live tables and menu control</p>
              </div>
              <div className="flex items-center gap-3 text-sm text-mist">
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" /> Live</span>
                <span>·</span>
                <span>{new Date().toLocaleDateString("en-IN", { weekday: "long", month: "short", day: "numeric" })}</span>
              </div>
            </div>
            <div className="max-w-7xl mx-auto mt-5 flex gap-2 overflow-x-auto">
              {[
                { id: "live", label: "Live Tables", count: liveOrders.length },
                { id: "tables", label: "Tables" },
                { id: "menu", label: "Menu", locked: true },
                { id: "insights", label: "Insights", locked: true },
              ].map(tab => (
                <button key={tab.id} onClick={() => setStaffTab(tab.id)}
                  className={`px-5 min-h-[44px] rounded-full text-sm font-medium whitespace-nowrap transition ${
                    staffTab === tab.id ? "bg-pink text-white" : "text-mist hover:text-ink hover:bg-white"
                  }`}>
                  {tab.label}{tab.count != null ? ` (${tab.count})` : ""}{tab.locked && !mgrUnlocked ? " ·" : ""}
                </button>
              ))}
            </div>
          </header>

          <div className="max-w-7xl mx-auto px-4 py-8 space-y-10">
            {staffTab === "live" && (
              <section>
                <div className="flex items-center justify-between mb-5 flex-wrap gap-2">
                  <h2 className="font-display text-2xl text-ink">Live Tables</h2>
                  <div className="flex items-center gap-3">
                    <p className="text-mist text-sm">{liveOrders.length} table{liveOrders.length !== 1 ? "s" : ""}</p>
                    <button type="button" onClick={() => { if (onRefreshOrders) onRefreshOrders(); }}
                      className="px-3 py-2 rounded-xl border border-pink/30 text-pink text-xs font-semibold hover:bg-pink/10 transition flex items-center gap-1.5">
                      <Icon name="refresh-cw" size={14} /> Refresh
                    </button>
                  </div>
                </div>
                {liveOrders.length === 0 ? (
                  <div className="glass rounded-2xl p-10 text-center border border-pink/10">
                    <Icon name="shopping-bag" size={36} className="text-mist/40 mx-auto mb-3" />
                    <p className="text-mist">No live tables yet</p>
                    <p className="text-mist/60 text-sm mt-1">Orders sync to all staff devices via Supabase</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    {liveOrders.map(session => {
                      const rounds = session.rounds || [];
                      const grandTotal = rounds.reduce((s, r) => s + (r.total || 0), 0);
                      const pending = rounds.filter(r => r.status === "new");
                      const allServed = rounds.length > 0 && rounds.every(r => r.status === "delivered");
                      return (
                        <div key={session.table} className="glass rounded-2xl p-5 border border-pink/10 flex flex-col">
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <div>
                              <p className="font-display text-xl text-ink">Table {session.table}</p>
                              {(session.guestName || session.guestPhone) && (
                                <div className="text-mist text-xs mt-0.5">
                                  <span>Claimed by {session.guestName || "Guest"}</span>
                                  {session.guestPhone ? (
                                    <div className="flex items-center gap-1.5 text-ink font-medium text-xs mt-0.5">
                                      <span>
                                        {revealedPhones[session.table]
                                          ? session.guestPhone
                                          : `+91 ••••• •${String(session.guestPhone).slice(-4)}`}
                                      </span>
                                      <button type="button"
                                        onClick={() => setRevealedPhones(prev => ({ ...prev, [session.table]: !prev[session.table] }))}
                                        className="text-[10px] text-pink underline hover:text-pink-deep">
                                        {revealedPhones[session.table] ? "Hide" : "Show"}
                                      </button>
                                    </div>
                                  ) : null}
                                  {session.joinCode ? (
                                     <div className="inline-flex items-center gap-1.5 mt-1.5 px-2.5 py-1 rounded-lg bg-pink-soft border border-pink/30 text-pink-deep text-xs font-semibold">
                                       <span>Table OTP: <strong className="font-mono tracking-wider text-sm">{session.joinCode}</strong></span>
                                     </div>
                                   ) : null}
                                </div>
                              )}
                              <p className="text-mist/60 text-[10px] mt-0.5">{rounds.length} order round{rounds.length !== 1 ? "s" : ""}</p>
                            </div>
                            {pending.length > 0 && (
                              <span className={`text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-full border font-semibold ${statusColor("new")}`}>{pending.length} pending</span>
                            )}
                            {allServed && pending.length === 0 && (
                              <span className={`text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-full border font-semibold ${statusColor("delivered")}`}>All served</span>
                            )}
                          </div>

                          <div className="space-y-3 flex-1 mb-3 max-h-72 overflow-y-auto">
                            {rounds.filter(r => r.items && r.items.length).map((round, ri) => {
                              const meta = statusMeta(round.status);
                              return (
                                <div key={round.id} className="rounded-xl bg-blush border border-pink/10 p-3">
                                  <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs text-mist">Round {rounds.length - ri}, {new Date(round.createdAt).toLocaleTimeString()}{round.orderedBy ? " · " + round.orderedBy : ""}</span>
                                    <span className={`text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full border font-semibold ${statusColor(round.status)}`}>{meta.label}</span>
                                  </div>
                                  <ul className="space-y-1.5 mb-2.5">
                                    {(round.items || []).map((it, idx) => {
                                      const isDiscount = String(it.id) === "snake-discount";
                                      if (isDiscount) {
                                        return (
                                          <li key={idx} className="text-xs bg-pink-soft/60 px-3 py-2 rounded-lg border border-pink/20 flex items-center justify-between">
                                            <span className="font-semibold text-pink truncate">{it.name}</span>
                                            <span className="font-semibold text-pink shrink-0 ml-2">{formatPrice(it.price)}</span>
                                          </li>
                                        );
                                      }
                                      return (
                                        <li key={idx} className="text-sm bg-white/70 p-2 rounded-lg border border-pink/10">
                                          <div className="flex items-center justify-between gap-2">
                                            <div className="min-w-0 flex-1">
                                              <span className="font-semibold text-pink mr-1">{it.qty}×</span>
                                              <span className="text-ink font-medium">{it.name}{it.variantLabel ? ` (${it.variantLabel})` : ""}</span>
                                            </div>
                                            <span className="text-mist text-xs whitespace-nowrap font-medium">{formatPrice(it.price * it.qty)}</span>
                                            <div className="inline-flex items-center gap-1 shrink-0 ml-1">
                                              <button type="button" onClick={() => requestItemQtyChange(session.table, round, idx, -1)}
                                                title="Decrease quantity or remove"
                                                className="w-5 h-5 rounded bg-blush border border-pink/20 hover:border-pink/50 text-ink text-xs flex items-center justify-center font-bold">
                                                -
                                              </button>
                                              <span className="text-xs font-semibold px-1 min-w-[14px] text-center">{it.qty}</span>
                                              <button type="button" onClick={() => requestItemQtyChange(session.table, round, idx, 1)}
                                                title="Increase quantity"
                                                className="w-5 h-5 rounded bg-blush border border-pink/20 hover:border-pink/50 text-ink text-xs flex items-center justify-center font-bold">
                                                +
                                              </button>
                                              <button type="button" onClick={() => requestRemoveItem(session.table, round, idx)}
                                                title="Remove item from order"
                                                className="w-5 h-5 rounded text-mist/60 hover:text-red-500 hover:bg-red-50 text-xs flex items-center justify-center ml-0.5">
                                                ✕
                                              </button>
                                            </div>
                                          </div>
                                          {it.note && <p className="text-xs text-pink-deep mt-1 font-medium bg-pink-soft/60 px-2 py-0.5 rounded">Note: {it.note}</p>}
                                        </li>
                                      );
                                    })}
                                  </ul>
                                  <div className="flex items-center justify-between mb-3 pt-1">
                                    <button
                                      type="button"
                                      onClick={() => setAddItemModal({ table: session.table, roundId: round.id })}
                                      className="inline-flex items-center gap-1 text-xs text-pink hover:text-pink-deep font-semibold py-1 px-2.5 rounded-lg bg-white border border-pink/20 hover:border-pink/40 shadow-xs transition">
                                      <Icon name="plus" size={12} /> Add item to round
                                    </button>
                                    <span className="text-xs text-mist font-medium">Round: <strong className="text-ink">{formatPrice(round.total || 0)}</strong></span>
                                  </div>
                                  <div className="flex flex-wrap gap-2">
                                    {meta.next && (
                                      <button type="button" onClick={() => { updateRoundStatus(session.table, round.id, meta.next); showToast(`Table ${session.table}: ${meta.nextLabel}`); }}
                                        className="px-3 py-1.5 rounded-lg bg-pink text-white text-xs font-semibold hover:bg-pink-deep transition shadow-xs">
                                        {meta.nextLabel}
                                      </button>
                                    )}
                                    {round.status === "new" && (
                                      <button type="button" onClick={() => requestCancelRound(session.table, round)}
                                        className="px-3 py-1.5 rounded-lg text-mist text-xs hover:text-red-500 transition">Cancel</button>
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                          <div className="flex justify-between items-center border-t border-pink/10 pt-3 mb-3">
                            <span className="text-mist text-sm">Bill total</span>
                            <span className="font-semibold text-pink text-lg">{formatPrice(grandTotal)}</span>
                          </div>
                          <button type="button"
                            onClick={() => requestClearTable(session.table, grandTotal)}
                            className="w-full py-2.5 rounded-xl border border-pink/40 text-pink text-sm font-semibold hover:bg-pink/10 transition">
                            Paid, clear table
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            )}

            {staffTab === "tables" && (
              <section>
                <div className="flex items-center justify-between mb-5 flex-wrap gap-2">
                  <div>
                    <h2 className="font-display text-2xl text-ink">Tables</h2>
                    <p className="text-mist text-sm">Add or remove tables and copy guest QR links (menu site, not staff).</p>
                  </div>
                  <button type="button" onClick={() => {
                    const nums = Object.keys(tablePins || {}).map(Number).filter(n => !isNaN(n));
                    const next = (nums.length ? Math.max(...nums) : 0) + 1;
                    const pin = String(1000 + next);
                    setTablePins(prev => ({ ...prev, [String(next)]: pin }));
                    cloudUpsertPin(next, pin);
                    getOrMakeTableToken(next);
                    showToast("Table " + next + " added");
                  }} className="px-4 py-2.5 rounded-xl bg-pink text-white text-sm font-semibold">+ Add table</button>
                </div>
                <div className="glass rounded-2xl p-4 border border-pink/10 space-y-3">
                  <div className="space-y-2 max-h-[70vh] overflow-y-auto">
                    {Object.keys(tablePins || {}).length === 0 ? (
                      <p className="text-mist text-sm py-8 text-center">No tables yet. Tap + Add table.</p>
                    ) : Object.keys(tablePins || {}).sort((a, b) => Number(a) - Number(b)).map(n => {
                      // Guest menu only — points to /cafe/?t=... (never exposing staff portal)
                      const opaqueToken = getOrMakeTableToken(n);
                      const secureUrl = getGuestTableUrl(opaqueToken);

          {confirmOrderModal && (

              onClick={() => setConfirmOrderModal(null)}>
              <div className="glass-strong rounded-3xl p-6 max-w-sm sm:max-w-md w-full border border-pink/30 shadow-float"
                onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-pink/15">
                  <div className="flex items-center gap-2.5">
                    <div className={`w-9 h-9 rounded-2xl flex items-center justify-center text-base ${confirmOrderModal.isDestructive ? 'bg-red-500/15 text-red-600' : 'bg-pink/15 text-pink'}`}>
                      {confirmOrderModal.isDestructive ? '⚠️' : '✏️'}
                    </div>
                    <div>
                      <h3 className="font-display text-lg text-ink leading-tight">{confirmOrderModal.title}</h3>

                    </div>

                  <button type="button" onClick={() => setConfirmOrderModal(null)}
                    className="w-8 h-8 rounded-full flex items-center justify-center text-mist hover:text-ink hover:bg-pink-soft/50 transition">
                    ✕

                <div className="rounded-2xl bg-surface/80 border border-pink/20 p-4 mb-5 space-y-2.5 text-sm">
                  {confirmOrderModal.itemName && (

                      <span className="text-mist font-medium">Item</span>
                      <span className="text-ink font-semibold text-right">

                        {confirmOrderModal.variantLabel ? ` (${confirmOrderModal.variantLabel})` : ""}
