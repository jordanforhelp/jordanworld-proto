                  )}
                  {confirmOrderModal.oldQty !== undefined && confirmOrderModal.newQty !== undefined && (
                    <div className="flex items-center justify-between">
                      <span className="text-mist font-medium">Quantity</span>
                      <span className="font-semibold text-ink">
                        {confirmOrderModal.type === "remove" ? (
                          <span className="text-red-600">{confirmOrderModal.oldQty}× → Removed</span>
                        ) : confirmOrderModal.type === "add_item" ? (
                          <span className="text-pink font-bold">+{confirmOrderModal.newQty}×</span>
                        ) : (
                          <span>{confirmOrderModal.oldQty}× → <span className="text-pink font-bold">{confirmOrderModal.newQty}×</span></span>
                        )}
                      </span>
                    </div>
                  )}
                  {confirmOrderModal.notes && (
                    <div className="flex items-start justify-between gap-3 pt-1 border-t border-pink/10">
                      <span className="text-mist font-medium">Notes</span>
                      <span className="text-ink italic text-xs text-right bg-pink-soft/40 px-2 py-0.5 rounded-lg max-w-[200px]">
                        &quot;{confirmOrderModal.notes}&quot;
                      </span>
                    </div>
                  )}
                  {confirmOrderModal.priceChangeText && (
                    <div className="flex items-center justify-between pt-1 border-t border-pink/10">
                      <span className="text-mist font-medium">Price Impact</span>
                      <span className={`font-bold ${confirmOrderModal.isDestructive ? 'text-red-600' : 'text-pink'}`}>
                        {confirmOrderModal.priceChangeText}
                      </span>
                    </div>
                  )}
                  {confirmOrderModal.newTotalText && (
                    <div className="flex items-center justify-between pt-1 border-t border-pink/10">
                      <span className="text-mist font-medium">Updated Total</span>
                      <span className="font-bold text-ink text-base">
                        {confirmOrderModal.newTotalText}
                      </span>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button type="button" onClick={() => setConfirmOrderModal(null)}
                    className="py-2.5 px-4 rounded-xl border border-pink/30 text-mist hover:text-ink hover:bg-pink-soft/30 font-semibold text-sm transition">
                    Cancel
                  </button>
                  <button type="button" onClick={confirmOrderModal.onConfirm}
                    className={`py-2.5 px-4 rounded-xl font-semibold text-sm transition shadow-sm ${
                      confirmOrderModal.isDestructive
                        ? 'bg-red-600 text-white hover:bg-red-700'
                        : 'bg-pink text-white hover:bg-pink-deep'
                    }`}>
                    {confirmOrderModal.confirmLabel}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    function getTableFromUrl() {
      // Strictly opaque: never guess or extract table number client-side.
      return "";
    }
    function getPinFromUrl() {
      try {
        const q = new URLSearchParams(window.location.search);
        return (q.get("pin") || q.get("code") || "").trim();
      } catch { return ""; }
    }

    function App() {
      const [tableFromQr, setTableFromQr] = useState(() => getTableFromUrl());
      const [pinFromQr] = useState(() => getPinFromUrl());
      const [linkError, setLinkError] = useState(null);
      const [dismissedBrokenLink, setDismissedBrokenLink] = useState(false);

      // If token in URL is an opaque string (?t=... or ?token=...), resolve it strictly
      React.useEffect(() => {
        const q = new URLSearchParams(window.location.search);
        const rawToken = (q.get("t") || q.get("token") || "").trim();
        const tableParam = (q.get("table") || "").trim();
        if (rawToken) {
          cloudResolveQrToken(rawToken).then(res => {
            if (res && res.valid === true && res.table_no) {
              const tNo = String(res.table_no);
              if (isRegisteredTable(tNo, tablePins)) {
                setTableFromQr(tNo);
                setLinkError(null);
              } else {
                setTableFromQr("");
                setLinkError({ rawToken, reason: "unregistered", tableNo: tNo });
              }
            } else {
              setTableFromQr("");
              setLinkError({ rawToken, reason: "not_found" });
            }
          }).catch(err => {
            setTableFromQr("");
            setLinkError({ rawToken, reason: "error", error: err?.message });
          });
        } else if (tableParam) {
          // If a user types ?table=X without an active token, treat as unregistered/broken unless preview mode
          setTableFromQr("");
          setLinkError({ rawToken: tableParam, reason: "not_found" });
        }
      }, [tablePins]);

      // Verify server staff session on boot
      React.useEffect(() => {
        const token = getStaffSessionToken();
        const staffFlag = sessionStorage.getItem("boba_staff") === "1";
        if (staffFlag && !token) {
          // Stale legacy session without crypto token: clear and require PIN
          setStaffSessionToken(null, null);
          setStaffAuth(false);
          if (IS_APEX) setShowPin(true);
        } else if (token) {
          cloudStaffVerify(token).then(valid => {
            if (!valid && !token.startsWith("local_session_")) {
              setStaffSessionToken(null, null);
              setStaffAuth(false);
              if (IS_APEX) setShowPin(true);
            }
          }).catch(() => {});
        }
      }, []);

      const [view, setView] = useState(() => {
        try {
          const hasValidSession = sessionStorage.getItem("boba_staff") === "1" && !staffSessionExpired() && !!getStaffSessionToken();
          if (IS_APEX) return hasValidSession ? "owner" : "apex-gate";
          return hasValidSession ? "owner" : "customer";
        } catch { return IS_APEX ? "apex-gate" : "customer"; }
      });
      const [staffAuth, setStaffAuth] = useState(() => {
        try {
          if (sessionStorage.getItem("boba_staff") !== "1") return false;
          if (staffSessionExpired() || !getStaffSessionToken()) {
            sessionStorage.removeItem("boba_staff");
            sessionStorage.removeItem("boba_mgr");
            setStaffSessionToken(null, null);
            return false;
          }
          touchStaffActivity();
          return true;
        } catch { return false; }
      });
      const [showPin, setShowPin] = useState(() => IS_APEX && !(typeof sessionStorage !== "undefined" && sessionStorage.getItem("boba_staff") === "1" && !staffSessionExpired() && !!getStaffSessionToken()));
      const [dishes, setDishes] = useState(() => {
        const loaded = loadState("boba_dishes", null);
        if (!loaded) return mergeMenuList(INITIAL_DISHES);
        const wiped = sessionStorage.getItem("boba_stats_wiped");
        if (!wiped) {
          try { sessionStorage.setItem("boba_stats_wiped", "1"); } catch {}
          return mergeMenuList(loaded.map(d => ({ ...d, ordersToday: 0 })));
        }
        return mergeMenuList(loaded);
      });
      const [recommendations, setRecommendations] = useState(() => loadState("boba_recs", AI_RECOMMENDATIONS));
      const [sessionItems, setSessionItems] = useState([]);
      const [liveOrders, setLiveOrders] = useState([]);
      const [tablePins, setTablePins] = useState(() => ({ ...DEFAULT_TABLE_PINS }));
      // Load pins for guest table validation (tables beyond 1–12)
      React.useEffect(() => {
        if (!sb) return;
        cloudFetchPins().then(p => { if (p) setTablePins(p); }).catch(() => {});
      }, []);
      const [snakeDiscount, setSnakeDiscount] = useState(() => loadSnakeDiscountSettings());
      const [toast, setToast] = useState(null);
      const menuCloudReady = useRef(false);
      const applyingRemoteMenu = useRef(false);

      useEffect(() => { saveState("boba_dishes", dishes); }, [dishes]);
      useEffect(() => { saveState("boba_recs", recommendations); }, [recommendations]);

      // Push menu edits (photo on/off, uploads, prices) to Supabase for all devices
      useEffect(() => {
        if (!menuCloudReady.current || applyingRemoteMenu.current) return;
        scheduleCloudSaveMenu(dishes);
      }, [dishes]);

      const showToast = useCallback((msg) => setToast(msg), []);

      const applyRemoteMenu = useCallback((list, remoteUpdatedAt) => {
        if (!Array.isArray(list) || !list.length) return;
        if (_editingMenuLock) return;
        if (Date.now() - _lastLocalMenuWriteAt < 8000) return;
        if (remoteUpdatedAt) {
          const remoteMs = new Date(remoteUpdatedAt).getTime();
          if (Number.isFinite(remoteMs) && remoteMs < _lastLocalMenuWriteAt - 50) return;
        }
        applyingRemoteMenu.current = true;
        setDishes(mergeMenuList(list));
        queueMicrotask(() => { applyingRemoteMenu.current = false; });
      }, []);

      const refreshOrders = useCallback(async () => {
        try {
          if (!sb) {
            showToast("Cloud not connected. Check Supabase script.");
            return;
          }
          const next = await cloudFetchLiveOrders();
          setLiveOrders(next || []);
          showToast("Orders refreshed");
        } catch (e) {
          console.error(e);
          showToast("Refresh failed: " + (e.message || "error"));
        }
      }, [showToast]);

      useEffect(() => {
        let channel;
        (async () => {
          try {
            if (!sb) {
              setTablePins({ ...DEFAULT_TABLE_PINS });
              return;
            }
            const pins = await cloudFetchPins();
            if (pins) setTablePins(pins);
            const orders = await cloudFetchLiveOrders();
            setLiveOrders(orders || []);

            // Load shared menu (photos / visibility) from cloud
            try {
              const remote = await cloudFetchMenu();
              if (remote && remote.dishes && remote.dishes.length) {
                applyRemoteMenu(remote.dishes, remote.updatedAt);
              } else {
                // First time: seed cloud from current local menu
                await cloudSaveMenu(dishes);
              }
              if (remote && remote.snakeDiscount !== undefined) {
                const s = saveSnakeDiscountSettings(remote.snakeDiscount || DEFAULT_SNAKE_DISCOUNT);
                setSnakeDiscount(s);
              }
            } catch (menuErr) {
              console.error("menu load", menuErr);
            }
            menuCloudReady.current = true;

            channel = sb.channel("boba-live")
              .on("postgres_changes", { event: "*", schema: "public", table: "boba_order_rounds" }, async () => {
                try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch (e) { console.error(e); }
              })
              .on("postgres_changes", { event: "*", schema: "public", table: "boba_table_sessions" }, async () => {
                try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch (e) { console.error(e); }
              })
              .on("postgres_changes", { event: "*", schema: "public", table: "boba_menu" }, async () => {
                try {
                  const remote = await cloudFetchMenu();
                  if (remote && remote.dishes) applyRemoteMenu(remote.dishes, remote.updatedAt);
                  if (remote && remote.snakeDiscount !== undefined) {
                    const s = saveSnakeDiscountSettings(remote.snakeDiscount || DEFAULT_SNAKE_DISCOUNT);
                    setSnakeDiscount(s);
                  }
                } catch (e) { console.error(e); }
              })
              .subscribe();
          } catch (e) {
            console.error(e);
            setTablePins({ ...DEFAULT_TABLE_PINS });
            menuCloudReady.current = true;
          }
        })();
        return () => { if (channel && sb) sb.removeChannel(channel); };
      }, [showToast, applyRemoteMenu]);

      const placeOrder = useCallback(async (items, tableLabel, guest, discount) => {
        try {
          const res = await cloudPlaceOrder(items, tableLabel, guest, discount || null);
          // Refresh staff board in background — don't make the guest wait
          cloudFetchLiveOrders().then(next => setLiveOrders(next || [])).catch(() => {});
          return res;
        } catch (e) {
          console.error(e);
          showToast("Order failed: " + (e.message || "cloud error"));
          throw e;
        }
      }, [showToast]);

      const updateRoundStatus = useCallback(async (tableKey, roundId, status) => {
        setLiveOrders(prev => prev.map(session => {
          if (String(session.table) !== String(tableKey)) return session;
          return {
            ...session,
            rounds: (session.rounds || []).map(r =>
              String(r.id) === String(roundId) ? { ...r, status, updatedAt: new Date().toISOString() } : r
            ),
          };
        }));
        try {
          await cloudUpdateRoundStatus(roundId, status);
          if (status === "accepted") {
            const session = liveOrders.find(s => String(s.table) === String(tableKey));
            const round = session?.rounds?.find(r => String(r.id) === String(roundId));
            const confirmedItems = round?.items || [];
            if (confirmedItems.length) {
              setDishes(ds => {
                const dnext = ds.map(d => {
                  const ordered = confirmedItems.find(i => i.id === d.id);
                  if (!ordered) return d;
                  return { ...d, ordersToday: (d.ordersToday || 0) + (ordered.qty || 1) };
                });
                saveState("boba_dishes", dnext);
                return dnext;
              });
            }
          }
        } catch (e) {
          console.error(e);
          showToast("Status update failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [showToast, liveOrders]);

      const clearTable = useCallback(async (tableKey) => {
        const session = liveOrders.find(s => String(s.table) === String(tableKey));
        setLiveOrders(prev => prev.filter(s => String(s.table) !== String(tableKey)));
        saveSnakeReward(null); // entire-order reward ends when bill is paid
        try {
          await cloudClearTable(session?.sessionId, tableKey);
        } catch (e) {
          console.error(e);
          showToast("Clear failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [liveOrders, showToast]);

      const cancelRound = useCallback(async (tableKey, roundId) => {
        setLiveOrders(prev => prev.map(session => {
          if (String(session.table) !== String(tableKey)) return session;
          return { ...session, rounds: (session.rounds || []).filter(r => String(r.id) !== String(roundId)) };
        }).filter(s => (s.rounds || []).length > 0));
        try {
          await cloudCancelRound(roundId);
        } catch (e) {
          console.error(e);
          showToast("Cancel failed: " + (e.message || ""));
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [showToast]);

      const updateRoundItems = useCallback(async (tableKey, roundId, newItems) => {
        const newTotal = (newItems || []).reduce((s, it) => s + (Number(it.price) * Number(it.qty || 1)), 0);
        setLiveOrders(prev => prev.map(session => {
          if (String(session.table) !== String(tableKey)) return session;
          return {
            ...session,
            rounds: (session.rounds || []).map(r => String(r.id) === String(roundId) ? { ...r, items: newItems, total: newTotal } : r)
          };
        }));
        try {
          await cloudUpdateRoundItems(roundId, newItems, newTotal);
          showToast("Order round updated");
        } catch (e) {
          console.error(e);
          showToast("Failed to update round items: " + (e.message || ""));
          if (/session expired|enter staff PIN|token missing/i.test(e.message || "")) {
            setShowPin(true);
          }
          try { setLiveOrders(await cloudFetchLiveOrders() || []); } catch {}
        }
      }, [showToast]);

      const handleStaffAccess = () => {
        if (staffAuth) setView("owner");
        else setShowPin(true);
      };
      const handlePinSuccess = () => {
        setStaffAuth(true);
        touchStaffActivity();
        try { sessionStorage.setItem("boba_staff", "1"); } catch {}
        setShowPin(false);
        setView("owner");
        showToast("Staff access granted");
      };
      const handleLogout = () => {
        setStaffAuth(false);
        setStaffSessionToken(null, null);
        try {
          sessionStorage.removeItem("boba_staff");
          sessionStorage.removeItem("boba_mgr");
          sessionStorage.removeItem(STAFF_ACTIVITY_KEY);
        } catch {}
        if (IS_APEX) {
          setView("apex-gate");
          setShowPin(true);
          showToast("Logged out");
        } else {
          setView("customer");
          showToast("Logged out of Staff Mode");
        }
      };

      // Idle timeout for staff session
      useEffect(() => {
        if (!staffAuth) return;
        touchStaffActivity();
        const onAct = () => touchStaffActivity();
        const events = ["pointerdown", "keydown", "touchstart", "scroll"];
        events.forEach(ev => window.addEventListener(ev, onAct, { passive: true }));
        const id = setInterval(() => {
          if (staffSessionExpired()) {
            setStaffAuth(false);
            try {
              sessionStorage.removeItem("boba_staff");
              sessionStorage.removeItem("boba_mgr");
            } catch {}
            if (IS_APEX) {
              setView("apex-gate");
              setShowPin(true);
            } else {
              setView("customer");
            }
            showToast("Staff session timed out (20 min idle)");
          }
        }, 15000);
        return () => {
          events.forEach(ev => window.removeEventListener(ev, onAct));
          clearInterval(id);
        };
      }, [staffAuth, showToast]);

      return (
        <div className="min-h-screen bg-blush">
          {!IS_APEX && <BobaBubbles />}
          {IS_APEX ? (
            staffAuth && view === "owner" ? (
              <OwnerView dishes={dishes} setDishes={setDishes} recommendations={recommendations} setRecommendations={setRecommendations}
                liveOrders={liveOrders} updateRoundStatus={updateRoundStatus} updateRoundItems={updateRoundItems} clearTable={clearTable} cancelRound={cancelRound}
                tablePins={tablePins} setTablePins={setTablePins}
                snakeDiscount={snakeDiscount} setSnakeDiscount={setSnakeDiscount}
                onLogout={handleLogout} showToast={showToast} onRefreshOrders={refreshOrders} />
            ) : (
              <div className="min-h-screen flex flex-col items-center justify-center p-6">
                <h1 className="font-display text-3xl text-ink mb-2">BOBA Apex</h1>
                <p className="text-mist text-sm mb-6">Staff portal · enter PIN to continue</p>
              </div>
            )
          ) : (
            (view === "customer" || !staffAuth) ? (
              linkError && !dismissedBrokenLink ? (
                <BrokenLinkView
                  linkError={linkError}
                  onBrowseMenu={() => setDismissedBrokenLink(true)}
                />
              ) : (
                <CustomerView
                  dishes={dishes}
                  sessionItems={sessionItems}
                  setSessionItems={setSessionItems}
                  showToast={showToast}
                  onStaffAccess={handleStaffAccess}
                  onPlaceOrder={placeOrder}
                  tableFromQr={tableFromQr}
                  pinFromQr={pinFromQr}
                  tablePins={tablePins}
                  snakeDiscount={snakeDiscount}
                  isPreviewMode={!tableFromQr || dismissedBrokenLink}
                />
              )
            ) : (
              <OwnerView dishes={dishes} setDishes={setDishes} recommendations={recommendations} setRecommendations={setRecommendations}
                liveOrders={liveOrders} updateRoundStatus={updateRoundStatus} updateRoundItems={updateRoundItems} clearTable={clearTable} cancelRound={cancelRound}
                tablePins={tablePins} setTablePins={setTablePins}
                snakeDiscount={snakeDiscount} setSnakeDiscount={setSnakeDiscount}
                onLogout={handleLogout} showToast={showToast} onRefreshOrders={refreshOrders} />
            )
          )}
          {showPin && (
            <PinModal
              onSuccess={handlePinSuccess}
              onClose={IS_APEX ? undefined : () => setShowPin(false)}
              forced={IS_APEX}
            />
          )}
          {toast && <Toast message={toast} onDone={() => setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
